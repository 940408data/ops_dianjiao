": "D0012", "type": "實質異文", "left": "法誦而傳之以詔後", "right": "若曲禮少儀内則弟", "base": "丗", "ref": "世", "choices": ["丗", "世"], "chosen": "世", "confidence": 0.95, "ocr_conf": 0.9815, "suspended": false, "risk": "誤判為兩存則體例不純；不改正文無句讀風險。", "note": "丗乃世之古文隸定，三家同認二字本同，非實質異文。底本可通，不改正文，但出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丗", "grade": "確證", "confidence": 0.95, "argument": "丗乃世之古文，碑刻古鈔多存之。南宋本作丗，存古文形貌；今本作世，乃後人臆改以就時俗，失底本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "世", "grade": "確證", "confidence": 0.95, "argument": "丗乃世之隸古定字，敦煌寫本及魏晉碑版屢見。二字同字異體，非實質異文。宋刻存古體，今本從通行，俱可。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "世", "grade": "確證", "confidence": 0.99, "argument": "丗乃世之古文省形，《說文》本有其字，同書他處或作世，二字本同，非實質異文，當從今本作世。"}]}, {"id": "D0013", "type": "實質異文", "left": "以極其規模之大而", "right": "有以盡其節目之詳", "base": "内", "ref": "內", "choices": ["内", "內"], "chosen": "内", "confidence": 0.95, "ocr_conf": 0.9649, "suspended": false, "risk": "若誤改底本或作兩存，則以非異文爲異文，濫出校記。", "note": "底本「内」即「內」之簡體俗字，三家俱謂非實質異文。文義本通，今本作「內」係後人規範，不改正文，僅出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "內", "grade": "確證", "confidence": 0.98, "argument": "南宋本行款避諱存真，今本乃「不誤而改」。簡「内」涉形訛作「內」，隸定古籍多存簡體，此宋代舊刻未經後人轉寫整理，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "內", "grade": "推測", "confidence": 0.9, "argument": "繁體「內」通「內」未得確證，然古書用字未必然悉同今本。底本作「内」未必誤。今本作「內」蓋後人規範。疑底本非誤，存之俟考。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "內", "grade": "確證", "confidence": 0.95, "argument": "「内」即「內」之簡體俗字，二字本同，非實質異文。文義本通，無當改之理。今宜逕錄正字「內」。"}]}, {"id": "D0017", "type": "實質異文", "left": "者又紛然雜出乎其", "right": "使其君子不幸而不", "base": "閒", "ref": "間", "choices": ["閒", "間"], "chosen": "兩存", "confidence": 0.95, "ocr_conf": 0.9581, "suspended": false, "risk": "誤判則妄改正文，失古本之真。", "note": "閒為間之本字，古今字異寫，非實質異文。底本可通，今本作間不改正文，出校記存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "閒", "grade": "確證", "confidence": 0.95, "argument": "底本作閒，今本作間，此乃後人妄改字體。閒為正字，間為後起俗字。當塗郡齋本存古，今本臆改失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "間", "grade": "旁證", "confidence": 0.3, "argument": "閒、間本同一字，古作閒，後別間，古籍通用。此非實質異文，乃古今字異寫耳。未審本條所據爲何書何篇，不敢以他書立證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.98, "argument": "閒乃間之本字，古書通用。二字古音同見紐元部，實一字之異體，非通假亦非誤字。二本俱通，依存異不改之例，當出校記云今本作間可也。"}]}, {"id": "D0024", "type": "衍文重出", "left": "子新安朱熹序大學", "right": "大舊音泰今讀如字", "base": "朱熹章句", "ref": "", "choices": ["朱熹章句", ""], "chosen": "朱熹章句", "confidence": 0.95, "ocr_conf": 0.9591, "suspended": false, "risk": "判錯則誤刪題署，亂卷第，或致句讀失准。", "note": "底本作「朱熹章句」，與下舊音相接。劉向據宋刊行款，戴震以本校通例，皆證非衍文。今本作圈乃後人臆斷，今存底本原貌。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "朱熹章句、", "grade": "確證", "confidence": 0.95, "argument": "宋刊本行款中，題署與舊音相接，本無界畫。今本作圈，乃後人臆斷分段，滅失宋本舊第。當存底本原貌。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "今本刪「朱熹章句」四字，疑以夾注例黜之。然未得他書古注、類書確證，不敢妄斷衍脫，宜兩存。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "朱熹章句", "grade": "確證", "confidence": 0.95, "argument": "「大學〔朱熹章句〕」乃書名與卷端題署，夾注「大舊音泰今讀如字」正釋「大」字。此為全書通例，必非衍文。今本奪去，當據底本補。"}]}, {"id": "D0028", "type": "實質異文", "left": "者也但爲氣稟所拘", "right": "欲所蔽則有時而昏", "base": "入", "ref": "人", "choices": ["入", "人"], "chosen": "人", "confidence": 0.95, "ocr_conf": 0.9677, "suspended": false, "risk": "不改正文，僅出校記。若覆核發現底本實為善本異文，則校記過早定讞，然不影響句讀。", "note": "底本作「入」，乃「人」字殘泐之訛。戴震據本書文例，解縉引陳淳《北溪字義》為證，定為「人欲」。義長，惟底本別作他形，姑存校記不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "人", "grade": "旁證", "confidence": 0.75, "argument": "底本作「入」，今本作「人」。「氣稟所拘」與「物欲所蔽」對文，「人欲」連言乃宋儒常語。南宋刻本於「人」字偶有殘泐作「入」者，今本或出於他本，非臆改，似存古。"}, {"name": "解縉", "method": "他校法", "choice": "人", "grade": "旁證", "confidence": 0.9, "argument": "陳淳《北溪字義》卷上引此句正作「爲氣稟所拘、人欲所蔽」。南宋近古本之他書稱引，當得其真，底本「入」蓋涉形近而訛。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "人", "grade": "確證", "confidence": 0.98, "argument": "本書同卷「氣稟所拘，人欲所蔽」屢見，皆作「人欲」。「入欲」不辭，蓋涉上文「拘」字旁「扌」而誤「入」為「人」，或寫刻偶訛。理校改作「人」，與全書文例合。"}]}, {"id": "D0029", "type": "脫文缺字", "left": "之以復其初也新者", "right": "革其舊之謂也言旣", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "改動正文。若誤斷則篇題混入注文，影響句讀及全書體例。", "note": "底本「初也新者」間脫去篇題。劉向據行款，解縉據他書，戴震據本書文例，三家校同，今從補「大學」二字。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 0.9, "argument": "底本「初也新者」間當有二字。據行款版式，此處正當接鈔《大學》篇題。今本據篇第補「大學」二字，合於中秘舊第。底本脫去篇題，當從今本補正。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "「之以復其初也」乃《大學》「在新民」句之朱注。〔〇〕處當據今本補「大學」二字，以明此章屬《大學》，文理方通。今本所補不誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "此《大學章句》釋「在新民」之文，上下文義昭然。底本脫二字，今本校補是也。今存「大學」二字。"}]}, {"id": "D0030", "type": "實質異文", "left": "者革其舊之謂也言", "right": "自明其明德又當推", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9781, "suspended": false, "risk": "誤判則妄改正文，失古本舊貌，然不影響句讀", "note": "「旣」乃「既」隸古定字，漢魏舊貌。今本作「既」係後人正字臆改。三家皆認非實質異文，今從底本，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.95, "argument": "底本作「旣」，乃隸古定字形，存漢魏以來舊貌。今本作「既」，乃後人據正字臆改，反失真。當從底本，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "既", "grade": "旁證", "confidence": 0.85, "argument": "旣乃既之隸變俗體，見《干祿字書》。宋以前寫本刻本多作旣，後人識作異文耳。二字實同，今當從正體作既。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "確證", "confidence": 0.95, "argument": "「旣」為「既」之異體古文，二字同字異形，非實質異文。底本作「旣」不礙文義，當存借字不改。"}]}, {"id": "D0032", "type": "衍文重出", "left": "后能慮慮而后能得", "right": "後放此止者所當止", "base": "后與後同", "ref": "", "choices": ["后與後同", ""], "chosen": "后與後同、後放此止者所當止", "confidence": 0.95, "ocr_conf": 0.9617, "suspended": false, "risk": "判錯則誤刪古注，失宋刊舊貌，僅涉校記不改正文。", "note": "「后與後同」乃釋正文借字之古注，三家並以為非衍文，今本刪之不足據。底本文義可通，存其舊貌，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "后與後同、後放此", "grade": "旁證", "confidence": 0.9, "argument": "此注語夾正文間，宋刊本慣例也。「后」乃「後」之省形，注以明之，今本以為衍文而盡刪之，蓋後人整齊行款之失，反失古書舊貌。"}, {"name": "解縉", "method": "他校法", "choice": "后與後同、", "grade": "確證", "confidence": 0.95, "argument": "此句乃音義注文，非《大學》經文正文。今本唯存〇符刪之，是今本脫落，非底本衍文。底本宋刊注文，今見於《四部叢刊》景宋本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "后與後同、", "grade": "確證", "confidence": 0.95, "argument": "底本正文「后能慮」正作借字「后」，故旁注「后與後同」釋之。此注與正文相應，非衍文。今本削注，未可據以為衍。當存底本原貌。"}]}, {"id": "D0036", "type": "脫文缺字", "left": "身脩身脩而后家齊", "right": "國治國治而后天下", "base": "", "ref": "家齊而后", "choices": ["", "家齊而后"], "chosen": "家齊而后", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "補足缺文，不改句讀；若誤判則贅增正文四字。", "note": "底本脫「家齊而后」四字。劉向對校、解縉他校《禮記·大學》、戴震本校理校，三家結論一致，今據補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "家齊而后", "grade": "確證", "confidence": 0.92, "argument": "底本連屬作「身脩身脩而后家齊」，顯存重文號未刻。宋槧用墨釘或重文符，「家齊而后」適當缺位，今本補足合於行款。機判未識墨跡耳。"}, {"name": "解縉", "method": "他校法", "choice": "家齊而后", "grade": "確證", "confidence": 1.0, "argument": "底本重文符〇代「而后」二字，今本「而后」正確。又《禮記·大學》本作「家齊而后國治」，文理通順，今本不誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "家齊而后", "grade": "確證", "confidence": 0.98, "argument": "本文正記八目平列之式，句句相承，作「脩而后家齊國治」則文理斷絕。今本作「家齊而后」正合上下句法，當據以補正。"}]}, {"id": "D0038", "type": "實質異文", "left": "之所知無不盡也知", "right": "盡則意可得而實矣", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9836, "suspended": false, "risk": "非實質異文，誤判回改將亡宋刻古字之真，故僅存異體不改。", "note": "底本作「旣」，乃篆隸古體存古之訛。劉、解、戴三家皆主旣，今從底本不改正文，僅出校記以存宋刻之舊。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.9, "argument": "底本南宋遞修本作「旣」，存古文小篆隸定之體；今本作「既」，乃後人據楷正之法整齊文字，反失宋刻之舊。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "旣", "grade": "確證", "confidence": 0.9, "argument": "旣為既之篆隸正體，宋本多存古字。據《說文》小篆从皀㒫聲，唐石經及日本舊鈔卷子本亦作旣。今本改既，乃後世通行俗字，非實質異文，當從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "旣", "grade": "確證", "confidence": 0.98, "argument": "「旣」為「既」之古文奇字，本一字之異體。宋刻多存古體，故作「旣」；今本改作通行之「既」耳。既非通假，亦無關文義之窒礙。據底本存「旣」字，不當回改。"}]}, {"id": "D0039", "type": "實質異文", "left": "則意可得而實矣意", "right": "實則心可得而正矣", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9552, "suspended": false, "risk": "誤判則妄改正文，失古本原貌，雖文義無損，違存舊之例。", "note": "旣為既之古文，義訓無別，底本可通。劉解均證古本作旣，今本作既乃後人臆改。依例底本可通不改，僅出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.95, "argument": "南宋本作「旣」，存古字之舊。今本作「既」，乃後人據通行隸楷臆改。漢魏古書多作「旣」，晚出之本往往易為今字，失真矣。"}, {"name": "解縉", "method": "他校法", "choice": "旣", "grade": "旁證", "confidence": 0.85, "argument": "旣為既之古文正字，唐以前寫本及古注多用之，宋刊承古，當塗本作旣不誤。今本改作既，蓋出後人以通行隸定改之，非有他書確證也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "確證", "confidence": 0.99, "argument": "「旣」「既」實異體字，非通假。古書多作「旣」，今通行作「既」，義訓無別，當存原貌。然既為正字，機判誤指為實質異文，理校當從正字。"}]}, {"id": "D0045", "type": "脫文缺字", "left": "矣帝典曰克明峻德", "right": "峻書作俊帝典堯典", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "據三家確證補正，無懸置；若誤判則失校記，正文缺脫。", "note": "底本空圍，劉向據別本，解縉考《禮記》原文，戴震證本書體例，三法互證，的係脫「大學」二字，今據補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "底本「矣」上脫「大學」二字，蓋涉上下文皆引篇名而蒙省。觀此句乃舉篇名以證，文例整齊，今本據別本補之，符合版本文例，當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "此引《禮記·大學》文，《十三經注疏》本《禮記》卷六十《大學》「帝典曰克明峻德」可證。底本空圍係脫「大學」二字，今本補之是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "引《康誥》曰至此引《堯典》，《禮記·大學》文也。書例先舉篇名後引文，此脫「大學」二字，文理遂不通。據本書體例及《大學》原文補。"}]}, {"id": "D0054", "type": "實質異文", "left": "止於至善也右傳之", "right": "章釋新民詩云邦畿", "base": "二", "ref": "一", "choices": ["二", "一"], "chosen": "二", "confidence": 0.95, "ocr_conf": 0.9726, "suspended": false, "risk": "若判「一」則紊亂朱子章次，影響句讀及分章。", "note": "底本作「二」，今本作「一」。劉、解、戴三家均主「二」，合朱子《章句》傳次第。底本不誤，今本臆改，今從底本，僅出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "二", "grade": "確證", "confidence": 0.95, "argument": "底本刻作「二」字，今本作「一」，屬不誤而改。當塗郡齋本行款存古，今本臆改失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "二", "grade": "確證", "confidence": 0.9, "argument": "按朱子《章句》次第，傳二章釋新民、傳三章釋止至善。底本「止於至善也右傳之二章釋新民」文義相貫，作「一」則混亂章次。宋本可證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "二", "grade": "確證", "confidence": 0.95, "argument": "朱子《章句》分《大學》十章：首章經，一釋明明德，二釋新民，三釋止至善。作「二」合傳次第。"}]}, {"id": "D0060", "type": "實質異文", "left": "其滑澤也治骨角者", "right": "切而復磋之治玉石", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9712, "suspended": false, "risk": "判錯亦僅涉字形，不改正文則無礙句讀文義。", "note": "底本「旣」乃「既」古字，二字音義全同，文義本通，不當輒改。今本作「既」並存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.98, "argument": "底本作「旣」，从皀旡聲，乃漢魏六朝以來相承之古形；今本作「既」，乃後世通行字。晚出之本往往以時字易古字，反失真。今本屬不誤而改，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "既", "grade": "確證", "confidence": 0.95, "argument": "「旣」「既」本為正俗、異體之別，非實質異文。《說文》正篆作「旣」，然古籍傳鈔刊刻多通行「既」字，二字音義全同，當以「既」為正。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "確證", "confidence": 0.85, "argument": "「旣」「既」本一字之變，說見《說文》。《詩·衛風·淇奧》正作「既切復磋」，此述《大學》本義，當從今本作「既」。"}]}, {"id": "D0066", "type": "實質異文", "left": "一物不得其所所以", "right": "没丗而人思慕之愈", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9749, "suspended": false, "risk": "不改底本正文，僅出校記。若誤改，則滅古體之跡，失版本源流。", "note": "「旣」乃「既」古文，見《說文》。劉、解二家校宋本及唐前寫本皆作「旣」，今本臆改從今字，失古體。底本可通，不改，今並存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.95, "argument": "「旣」乃漢碑及北宋刊本屢見之隸變古體，南宋當塗郡齋本實存舊式。今本臆改作「既」，乃據通行楷化正字剗剔古體，反失真。今本之失顯然。"}, {"name": "解縉", "method": "他校法", "choice": "旣", "grade": "確證", "confidence": 0.95, "argument": "旣為既之本字，漢碑及唐以前寫本古注皆作旣，不作既。宋本猶存古體，今本改作既，乃後人從今字。當從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.98, "argument": "旣為既之古文，見《說文》。二字古今字異，義訓實同，非實質異文。既不改底本，亦無煩作校記。"}]}, {"id": "D0070", "type": "實質異文", "left": "不忘也此兩節詠歎", "right": "泆其味深長當熟玩", "base": "滛", "ref": "淫", "choices": ["滛", "淫"], "chosen": "淫", "confidence": 0.95, "ocr_conf": 0.9584, "suspended": false, "risk": "不改正文僅出校，無句讀影響；若強改反涉妄動。", "note": "底本「滛」即「淫」之俗體，劉、戴二家定為異體，非別字。義本可通，今本存正體，出校不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "淫", "grade": "確證", "confidence": 0.95, "argument": "「滛」乃「淫」之省變俗體，宋代民間刻本及遞修本多用之，非別為一字。今本作「淫」正存正體。底本俗體可據形以復其真，今本不誤，無庸臆改。"}, {"name": "解縉", "method": "他校法", "choice": "淫", "grade": "旁證", "confidence": 0.7, "argument": "二字本同，後起分化。此謂詠歎淫泆，淫當訓溢。今本淫字合正。然未得類書古注確證比對，未可徑斷底本滛必誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "淫", "grade": "確證", "confidence": 0.95, "argument": "「滛」為「淫」之異體俗字，非借字。淫泆連文，古書恆語。依體例當回正作「淫」。"}]}, {"id": "D0071", "type": "脫文缺字", "left": "人也必也使無訟乎", "right": "無情者不得盡其辭", "base": "", "ref": "①錫原作錫據仿元本及韻會改②泆仿元本作液", "choices": ["", "①錫原作錫據仿元本及韻會改②泆仿元本作液"], "chosen": "底本不誤，無脫文", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "誤補校記入正文則妄增衍文，亂經文之舊。", "note": "底本自「使無訟乎」直接接「無情者」，文從字順。今本「錫」「泆」乃後人校記誤植，劉氏謂重文號亦通。今從戴議，不補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本為南宋刊本，行款古質，末有重文號〔〇〕示重文，今本輒改作雙行夾注，失版刻之舊。然今本注文亦當有所承。二本形態迥異，當兩存其真。"}, {"name": "解縉", "method": "他校法", "choice": "底本不誤", "grade": "旁證", "confidence": 0.9, "argument": "所引乃《大學》「必也使無訟乎，無情者不得盡其辭」。底本經文無誤。今本所增校記「錫」「泆」等字，似為他處錯入之校語，與本條無涉，不當據補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "無（今本校記實乃後人辨正錫、泆二字，非原文脫文）", "grade": "確證", "confidence": 1.0, "argument": "底本正文自「必也使無訟乎」直接「無情者不得盡其辭」，文從字順，毫無脫文。今本「錫原作錫」「泆作液」乃後人校記，誤植入正文，機器誤判耳。"}]}, {"id": "D0072", "type": "實質異文", "left": "誕之辭蓋我之明德", "right": "明自然有以畏服民", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9848, "suspended": false, "risk": "妄改正文則亂古書原貌，存異體出校為善", "note": "「旣」乃「既」古文隸定，實為異體非異文。劉氏存古貌，戴氏謂出校即可。今從底本，不改正文，附記今本作「既」。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.95, "argument": "底本作「旣」，乃古文隸定之本形。今本作「既」，乃後人據通行楷法臆改。宋槧存古，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "既", "grade": "無證", "confidence": 0.6, "argument": "旣為既之古文，本同字異體，非實質異文。今本作既合乎通行字法。然未檢得唐以前古注或類書引及此句之確證，不敢遽定。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "確證", "confidence": 0.95, "argument": "「旣」為「既」之異體，二字本同，非通假。今本作「既明」合文例。古書異體當存原貌，出校記即可，不必回改。"}]}, {"id": "D0098", "type": "脫文缺字", "left": "而后嫁者也中去聲", "right": "此引書而釋之又明", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判脫文而補字，則妄增正文，且影響句讀之斷。", "note": "劉、戴皆主○，謂底本實有此符，惟句讀未斷。解縉謂脫頓號，今本別之。底本既可通，不改正文，出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本實有○符，特前後緊密相屬，句讀未斷，致機器誤判脫漏。今本別之，符合版刻行款之常。"}, {"name": "解縉", "method": "他校法", "choice": "、○", "grade": "確證", "confidence": 0.98, "argument": "底本「中去聲」與「〔〇〕」之間脫一小頓號。按「中去聲」為釋音之語，下接「〔〇〕」為複舉所釋之字。今本有「、○」者，正補此脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "底本明云「中去聲」，乃音注，必加○以別於正文。此為注語格式之定例。底本偶奪○，致音注混入正文，今據體例補之，非以意改也。"}]}, {"id": "D0101", "type": "脫文缺字", "left": "事一人定國償音奮", "right": "一人謂君也機發動", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "判錯則誤描符號為正文，亂句讀", "note": "底本「奮」下實有圈符，戴氏據宋槧體例定為訓釋分隔，今本同。存舊式，不改正文，出校明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本奮下有釋語而闕其目，今本以○補之，合乎中秘舊式重文釋訓之例。當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "推測", "confidence": 0.85, "argument": "底本「音奮」與「一人」間當有缺字。以文理推之，當作○。然未檢得古注類書確證，未敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "底本原刻實有此圈，非脫文。據宋槧體例，正文訓釋以○分隔，奮字下正當接圈。今本作○是，當據以描足。"}]}, {"id": "D0110", "type": "實質異文", "left": "推以度物使彼我之", "right": "各得分願則上下四", "base": "閒", "ref": "間", "choices": ["閒", "間"], "chosen": "閒", "confidence": 0.95, "ocr_conf": 0.9609, "suspended": false, "risk": "判錯亦僅涉異體字形，不影響句讀文義。", "note": "底本作「閒」，今本作「間」。《釋文》、古本皆作「閒」，乃正字，間為後起俗字。三家同辭，底本可通不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "閒", "grade": "確證", "confidence": 0.95, "argument": "底本作「閒」，今本作「間」，乃後人據通行隸楷改古，失其真。當塗郡齋本存古文舊形，未經臆改，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "閒", "grade": "確證", "confidence": 0.95, "argument": "「閒」乃「間」之本字，宋本作「閒」最得其正。觀陸德明《經典釋文》及《史記》古本，皆作「閒」。今本作「間」乃後人據通行字改易，當還作「閒」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "閒", "grade": "確證", "confidence": 0.95, "argument": "閒乃正字，從門內月，會意為隙；間乃後起俗字，加形符以別之。古書皆作閒，當存底本舊貌，不當從後世通行本回改。"}]}, {"id": "D0117", "type": "脫文缺字", "left": "矩之道惡先並去聲", "right": "此覆解上文絜矩二", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "誤刪圈號則失刻本符號原貌", "note": "底本作〔〇〕，即重文圈號，非脫文。劉、解二家所辨甚確。今本改作「、○」，不足取。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本注語「〔〇〕此覆解」明證此處有重文圈號，非脫文。今本臆改作「、」，失刻本行款之真。當從底本作「○」。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.95, "argument": "此乃版刻圈點符號，非正文脫文。今本有○，底本亦有〔〇〕，文脈完整，未嘗脫漏。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本作〔〇〕，與上下文例不合，顯為版刻鈔胥脫一圍圈。今本據他本或文例補「、○」以足其辭，當從今本補。"}]}, {"id": "D0118", "type": "實質異文", "left": "天下之要道也故章", "right": "之意皆自此而推之", "base": "內", "ref": "内", "choices": ["內", "内"], "chosen": "內", "confidence": 0.95, "ocr_conf": 0.9715, "suspended": false, "risk": "底本不動，僅存異體之別，不涉句讀文義，無誤改之虞。", "note": "「內」「内」乃正俗異體，非實質異文。三家俱主存古，劉向據當塗本確證，戴震以本校理校實之，今從底本作「內」，今本統改不取。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "內", "grade": "確證", "confidence": 0.97, "argument": "「內」「内」實乃正俗字之別。南宋當塗郡齋本存古文隸變構形，未經後人規範。今本統改作「内」，失底本舊式，當從底本存真，今本係臆改。"}, {"name": "解縉", "method": "他校法", "choice": "內", "grade": "旁證", "confidence": 0.85, "argument": "「內」「内」本一字異體，然此屬字形之別，非實質異文。唐以前古注及類書引此篇者，解縉未能確指卷次。以字形理校，「內」行用久遠，當存其舊。未得確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "內", "grade": "確證", "confidence": 0.99, "argument": "二字本為異體，非實質異文。底本作「內」乃古體正字，今本作「内」為俗省。字同義同，當從底本存「內」字，無煩改作。"}]}, {"id": "D0120", "type": "脫文缺字", "left": "可以不慎辟則爲天", "right": "節讀爲截辟讀爲僻", "base": "", "ref": "下僇矣", "choices": ["", "下僇矣"], "chosen": "下僇矣", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "若逕改正文，恐掩底本原貌，失闕文之實", "note": "底本「天」下有空圍，三家據今本及《漢書》《荀子》補「下僇矣」三字，音義俱合，但底本闕文，應出校記不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "下僇矣", "grade": "確證", "confidence": 0.95, "argument": "底本「天」下有空圍〇，明為缺字待補。今本「下僇矣」三字適填其位，字數吻合。此乃本校補闕之常法，非臆改也。"}, {"name": "解縉", "method": "他校法", "choice": "下僇矣", "grade": "確證", "confidence": 0.92, "argument": "此語見《漢書·董仲舒傳》，注引臣瓚曰「下僇矣」。底本脫「下僇矣」三字，據補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "下僇矣", "grade": "確證", "confidence": 0.95, "argument": "此引《荀子·修身》「辟則爲天下僇矣」，底本脫「天下」二字。今本據他書補足，義理文例皆合，當從。"}]}, {"id": "D0123", "type": "脫文缺字", "left": "克配上帝儀監于殷", "right": "命不易道得衆則得", "base": "", "ref": "峻", "choices": ["", "峻"], "chosen": "峻", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "不改底本正文，僅出校記補字，不誤句讀，風險極低。", "note": "底本脫字。解縉引《文王》詩、戴震據《毛詩》本校，確證鑿然，當補「峻」字。然底本無字可改，僅出校記，附補字於後。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "峻", "grade": "旁證", "confidence": 0.9, "argument": "底本字數整齊，然此處脫字致文氣不屬。今本「峻」字蓋據他本或石經補入，可備一說，然未見原書，不敢遽定。"}, {"name": "解縉", "method": "他校法", "choice": "峻", "grade": "確證", "confidence": 0.92, "argument": "《詩·大雅·文王》作「儀監于殷，峻命不易」，《朱子語類》卷八十一引同。今本補「峻」字有古本及他書為確證，底本脫文無疑。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "峻", "grade": "確證", "confidence": 1.0, "argument": "此《大學》引《詩·文王》「儀監于殷，峻命不易」。《毛詩》原文本作峻字，底本脫去，今本補正，確有實據，當從補。"}]}, {"id": "D0130", "type": "實質異文", "left": "爭鬪其民而施之以", "right": "奪之教也蓋財者人", "base": "刼", "ref": "劫", "choices": ["刼", "劫"], "chosen": "刼", "confidence": 0.95, "ocr_conf": 0.9845, "suspended": false, "risk": "僅出校記，不改底本正文；縱斷誤亦不影響句讀。", "note": "底本作刼，乃劫之古文別體，从去从刀，唐以前寫本習見。今本作劫乃後世通行字。二本字異實同，底本可通不改，今本作劫出校存備。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "刼", "grade": "確證", "confidence": 0.95, "argument": "底本作刼，从去从刀，乃古字本形；今本作劫，乃後世通行字。今本臆改失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "刼", "grade": "確證", "confidence": 0.82, "argument": "刼乃劫之古文別體，二字古今字。《說文》从力从去，古文作刼，唐以前寫本及石刻習見此體。底本作刼合古體，今本改劫乃後人從今文，非誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "刼、劫本為一字異體，去、力會意，从刀从力義同，非音義有別之異文。二本字異實同，無關通假，當存底本原文，出校記云今本作劫即可，無煩回改。"}]}, {"id": "D0134", "type": "形近疑誤", "left": "有容焉人之有技若", "right": "有之人之彦聖其心", "base": "已", "ref": "己", "choices": ["已", "己"], "chosen": "己", "confidence": 0.95, "ocr_conf": 0.6073, "suspended": false, "risk": "底本顯訛且有確證，改正無誤；否則句讀、文義俱失。", "note": "底本「已」乃形近之訛。解縉引《正義》、《釋文》為他書確證，戴震以文理定之，今從改正作「己」。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "己", "grade": "推測", "confidence": 0.8, "argument": "底本作「已」，今本作「己」。此乃《尚書·秦誓》「若己有之」文。宋本傳刻受重文號連寫影響，「己」字中畫上起誤作「已」，形近致訛。今本校正可從。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "確證", "confidence": 0.95, "argument": "《尚書·秦誓》古文，「如有容焉，人之有技，若己有之」，《正義》、《釋文》諸本皆作「己」。此句漢唐以來屢見稱引，未聞作「已有」者。「已」「己」形近易訛，底本當是刊誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "己", "grade": "確證", "confidence": 0.98, "argument": "此《書·秦誓》文，作「己」是也。「己」訓「身」。「若己有之」與上「有容」相應。作「已」不通，顯為形近之誤，當改正。"}]}, {"id": "D0135", "type": "實質異文", "left": "反書作介斷丁亂反", "right": "音冒○秦誓周書斷", "base": "媢", "ref": "媚", "choices": ["媢", "媚"], "chosen": "媢", "confidence": 0.95, "ocr_conf": 0.9769, "suspended": false, "risk": "底本不誤，若誤改「媚」則音義俱失，且違三家確證。", "note": "底本作「媢」音冒，與《說文》从女冒聲合。《釋文》、鄭注皆作「媢」。「媚」乃後人臆改，今本非也。今本作媚，當存校不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "媢", "grade": "確證", "confidence": 0.9, "argument": "底本作「媢」音冒，與《說文》媢从女冒聲合，音義相應。今本作「媚」，與反切冒音不合，蓋後人臆改失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "媢", "grade": "確證", "confidence": 0.9, "argument": "《經典釋文》引《尚書》此字作「媢」，音冒，與底本合。今本作「媚」非也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "媢", "grade": "確證", "confidence": 0.95, "argument": "《秦誓》本作「媢嫉」，音冒，鄭注同。底本作「媢」與經合。「媚」訓愛，不合嫉義，當是後人臆改。存底本不改。"}]}, {"id": "D0139", "type": "實質異文", "left": "用迸猶逐也言有此", "right": "疾之人妨賢而病國", "base": "媢", "ref": "娼", "choices": ["媢", "娼"], "chosen": "媢", "confidence": 0.95, "ocr_conf": 0.9811, "suspended": false, "risk": "底本可通且三家合議，無誤判風險；若強改今本反失古義。", "note": "底本作「媢」，劉向、解縉、戴震三家皆主之，古訓他書確證俱全，今本作「娼」乃後人臆改。底本不誤，存而不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "媢", "grade": "旁證", "confidence": 0.85, "argument": "底本作「媢」，從女冒聲，與嫉妒之義相合，古訓多有「媢疾」之文。今本作「娼」，屬後人臆改，失古本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "媢", "grade": "旁證", "confidence": 0.95, "argument": "《書·秦誓》古注及孔疏皆作「媢嫉」，《史記·秦本紀》亦作「媢嫉」，唐以前古注所引為確，今本作「娼」殆後人臆改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "媢", "grade": "確證", "confidence": 0.95, "argument": "《說文》「媢，夫妒婦也。」《大學》「媢嫉以惡之」，正妨賢病國之義。作「娼」者，後人不曉古義而臆改。底本不誤，當存之。"}]}, {"id": "D0142", "type": "實質異文", "left": "物無違謂信驕者矜", "right": "泰者侈肆此因上所", "base": "髙", "ref": "高", "choices": ["髙", "高"], "chosen": "髙", "confidence": 0.95, "ocr_conf": 0.9708, "suspended": false, "risk": "誤判為實質異文將妄改底本原字。", "note": "髙為高之異體，非實質異文。三家意見實同。今本作高乃後世正字，底本存舊貌可通，不當改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.85, "argument": "髙、高本一字異體。宋刻多作髙，今本作高乃後世正字。就版本形態，宋刻存舊貌，然二字實同，不當輒改底本。"}, {"name": "解縉", "method": "他校法", "choice": "高", "grade": "旁證", "confidence": 0.85, "argument": "「驕者矜泰者侈肆」句，未得確證他書徵引。然古籍中「高泰」屢見，與「矜」「侈」類並列。髙為高之隸俗，後人迻寫或刊正為高，今本作高是也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "高", "grade": "確證", "confidence": 0.95, "argument": "髙、高同字異體，非實質異文。古書傳刻屢見此類異體。今本作高，底本作髙，文義全同，當存底本原字，不當據今本回改。"}]}, {"id": "D0144", "type": "實質異文", "left": "患也孟獻子曰畜馬", "right": "不察於雞豚伐冰之", "base": "乗", "ref": "乘", "choices": ["乗", "乘"], "chosen": "乘", "confidence": 0.95, "ocr_conf": 0.9822, "suspended": false, "risk": "不改正文，僅出校記，不影響句讀，誤判無實害。", "note": "「乗」乃「乘」俗省，非實質異文。劉、解、戴三家並同。依底本可通之例，不改正文，出校記明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乘", "grade": "旁證", "confidence": 0.85, "argument": "南宋本作「乗」，乃「乘」之俗體，形構可證。今本作「乘」乃後人正字還原。以版本形態論，宋本存俗體，當從底本。然二字實同，今本未失本真。"}, {"name": "解縉", "method": "他校法", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "《經典釋文》卷十二音「乘，繩證反」，明作「乘」字。宋人俗書「乘」省作「乗」，實同一字，非實質異文。今本作「乘」可從。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乘", "grade": "確證", "confidence": 0.99, "argument": "「乘」乃正字，音食證切。「畜馬乘」謂畜馬及乘，即大夫之制。日本古鈔卷子本亦作「乘」，與今本合。底本作「乗」乃俗寫省變，非實質異文，當從今本作「乘」。"}]}, {"id": "D0145", "type": "實質異文", "left": "冰之家不畜牛羊百", "right": "之家不畜聚斂之臣", "base": "乗", "ref": "乘", "choices": ["乗", "乘"], "chosen": "乘", "confidence": 0.95, "ocr_conf": 0.9822, "suspended": false, "risk": "誤判則妄改古俗，失寫本原貌；不改正文僅出校記，無損句讀。", "note": "底本乗乃乘之俗寫，三家皆主乘，今本已正。底本可通，出校存真，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乘", "grade": "旁證", "confidence": 0.8, "argument": "宋本从椉加木，此六朝以來俗體，猶存古形。今本作乘乃後人據楷正改字，失其真矣。據版形當从宋本。"}, {"name": "解縉", "method": "他校法", "choice": "乘", "grade": "確證", "confidence": 0.98, "argument": "底本「乗」乃「乘」之俗寫，日本寫本及唐鈔亦多作此體。非實質異文，校者已正之為「乘」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "此《大學》文本，百乘之家乃古之定制，與冰之家對文。乗為日俗訛字，非古寫，當正作乘。"}]}, {"id": "D0146", "type": "實質異文", "left": "義爲利也畜許六反", "right": "斂並去聲孟獻子魯", "base": "乗", "ref": "乘", "choices": ["乗", "乘"], "chosen": "乘", "confidence": 0.95, "ocr_conf": 0.9779, "suspended": false, "risk": "不改正文，僅出校記，無句讀影響。", "note": "底本「乗」乃「乘」之俗省，非別字。劉氏以爲避諱俗體，解、戴據《禮記》釋文及《孟子》證當作「乘」，今從之，出校不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乗", "grade": "確證", "confidence": 0.95, "argument": "底本作「乗」，乃唐人避諱俗體，宋刻多存其舊；今本作「乘」，係後人據通行字臆改。二本互異，晚出之本經人整理，反失真。今本之失，當明正之。"}, {"name": "解縉", "method": "他校法", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》作「乘馬」，釋文「繩證反」，正合去聲。古注、釋文及諸本皆作「乘」，無作「乗」者。底本「乗」蓋俗省或刊誤，今本校改是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "此釋《孟子》「畜馬乘」。「乗」乃「乘」之俗省，非別字，亦非通假。當還正作「乘」，不改本音。"}]}, {"id": "D0148", "type": "實質異文", "left": "大夫仲孫蔑也畜馬", "right": "士初試爲大夫者也", "base": "乗", "ref": "乘", "choices": ["乗", "乘"], "chosen": "乘", "confidence": 0.95, "ocr_conf": 0.9671, "suspended": false, "risk": "改正文俗體爲正字，不影響句讀，不涉及實質異文爭議。", "note": "「乗」乃「乘」俗省，宋本沿舊卷俗體。劉氏對校、解氏他校引《周禮》、戴氏理校皆以「乘」爲本字，三證合轍，據正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "「乗」乃「乘」之俗省，唐卷、宋槧碑帖習見。南宋當塗郡齋遞修本刻工沿舊卷俗體作「乗」，今本復規範正字作「乘」，非臆改，實存古正。"}, {"name": "解縉", "method": "他校法", "choice": "乘", "grade": "確證", "confidence": 0.85, "argument": "《周禮·夏官》作「畜馬乘」。「乘」爲四匹定名，古注相承皆然。「乗」乃日系異體，此南宋本實作「乘」，辨之自明。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "「乘」乃本字。「乗」爲「乘」之日文簡體，宋本不當有此字。此乃今本據文理正訛，非實質異文，當從「乘」。"}]}, {"id": "D0149", "type": "實質異文", "left": "上喪祭用冰者也百", "right": "之家有采地者也君", "base": "乗", "ref": "乘", "choices": ["乗", "乘"], "chosen": "乗", "confidence": 0.95, "ocr_conf": 0.9563, "suspended": false, "risk": "僅異體之別，不改底本，不影響句讀。", "note": "乗乃乘之省俗，見宋槧，文義無涉。底本可通，存其舊貌，今本作乘者出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "南宋本作「乗」，乃「乘」之省寫俗體，刻本中習見，非實質異文。今本作「乘」乃正字，校者據文理正之，然底本字形未失。今惟存異體之別，當從底本存古。"}, {"name": "解縉", "method": "他校法", "choice": "乘", "grade": "確證", "confidence": 0.95, "argument": "「百乘」乃先秦典籍恒言，見《孟子·萬章上》及《左傳》襄公二十二年杜注。「乗」為「乘」之異體俗字，南宋遞修本偶作「乗」，當從今本正作「乘」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乘", "grade": "確證", "confidence": 0.98, "argument": "「百乘之家」乃古書恆語。《孟子·萬章》「百乘之家」即其本辭。乗為日俗字，宋本無之，此當據今本正作乘。"}]}, {"id": "D0004", "type": "實質異文", "left": "入小學而教之以洒", "right": "應對進退之節禮樂", "base": "埽", "ref": "掃", "choices": ["埽", "掃"], "chosen": "埽", "confidence": 0.96, "ocr_conf": 0.9599, "suspended": false, "risk": "若妄改作「掃」，則泯古本舊貌，失校勘存真之旨。", "note": "「埽」乃古字舊形，文義本通。劉、解、戴三家並主存舊，今本作「掃」係後人臆改。底本既可通，不改正文，出校存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "埽", "grade": "確證", "confidence": 0.95, "argument": "底本南宋刊本作「埽」，從扌從帚，乃古字舊形。今本作「掃」，係後人臆改通行字，反失古本真。據刻本行款字形，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "埽", "grade": "旁證", "confidence": 0.85, "argument": "唐以前古書及石刻多作「埽」，《禮記》各注疏本引文亦多作「埽」。「掃」乃後起通行字，宋本作「埽」存古形，今本改「掃」反失舊貌。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "埽", "grade": "確證", "confidence": 0.95, "argument": "埽乃古本字，从土帚會意，典籍多作埽。掃為後出俗體，今本回改非是。依通假例存借字古字之則，當存底本原字，不當從今本。"}]}, {"id": "D0022", "type": "實質異文", "left": "忘其固陋采而輯之", "right": "亦竊附己意補其闕", "base": "閒", "ref": "間", "choices": ["閒", "間"], "chosen": "閒", "confidence": 0.96, "ocr_conf": 0.9623, "suspended": false, "risk": "不改正文，僅出校記，不影響句讀。", "note": "底本作閒，乃間之本字，古今字之別。劉、戴皆主存古，解氏亦謂通假。文義既通，當存原本，今本作間不從。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "閒", "grade": "確證", "confidence": 0.95, "argument": "閒乃間之本字。宋本作閒，存古字原貌。今本作間，乃後人臆改通行字。宋本避諱、字體尚存漢唐之舊，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "間", "grade": "旁證", "confidence": 0.85, "argument": "閒即間之古文，二字本同源通假。宋刻古籍中閒、間混用實為常例，非實質異文。此處讀作jiàn，今本作間，於文義為長。唯未得確證他書引文，暫定旁證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "閒", "grade": "確證", "confidence": 0.98, "argument": "閒乃間之本字，古籍通用。此非實質異文，乃古今字之別。古書當存本字，不當從後世用字回改。底本作閒，文義本通，當存而不改。"}]}, {"id": "D0053", "type": "實質異文", "left": "而曰曰新之可略有", "right": "斷也康誥曰作新民", "base": "閒", "ref": "間", "choices": ["閒", "間"], "chosen": "閒", "confidence": 0.97, "ocr_conf": 0.9683, "suspended": false, "risk": "底本不誤，僅出校記辨俗本之非；若誤改作「間」，反失古字原貌。", "note": "底本作「閒」，今本作「間」。劉、解、戴三家均主「閒」，謂本字也，「間」乃後起俗體。底本文義本通，今本回改俗體反失古真，不從。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "閒", "grade": "旁證", "confidence": 0.95, "argument": "南宋本作「閒」，今本作「間」。間乃閒之後起分化字，說文本無間字。晚出之本多經整理改從俗體，反失古真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "閒", "grade": "確證", "confidence": 0.9, "argument": "唐石經、宋遞修本皆作「閒」，清《復古編》亦引作「閒」。間乃後世通行字，唐以前古注及石經未嘗作間，當從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "閒", "grade": "確證", "confidence": 0.98, "argument": "閒乃本字，間為俗體。宋代刻本正字尚存，今本回改俗體失古意。二字音義本同，無通假之嫌，當從底本存本字。"}]}, {"id": "D0147", "type": "脫文缺字", "left": "許六反乗斂並去聲", "right": "孟獻子魯之賢大夫", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.97, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判脫文而補，則破壞底本原貌與行款", "note": "底本○為音義與傳文間之標識符，非脫文。劉向、戴震皆有實證，今本反缺，存底本舊貌不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.97, "argument": "底本實有○，乃節末標識。機誤判脫。南宋本行款完整，今本反缺，是今本臆刪。當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "無證", "confidence": 0.6, "argument": "〇為釋文標識符，承上「乗斂並去聲」而啓下傳文。今本有而底本無，然未得他書確證，不敢遽定，謹從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.99, "argument": "「○」乃疏文標記符號，承上音義、啟下傳文。底本實具「〇」字，OCR置信度全滿，初判脫文實屬誤判。今本作「○」，當存底本原文不改。"}]}, {"id": "D0020", "type": "實質異文", "left": "尊信此篇而表章之", "right": "又爲之次其簡編發", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "既", "confidence": 0.98, "ocr_conf": 0.9745, "suspended": false, "risk": "不改正文僅出校記，防濫改古字形而失原本之真。", "note": "「旣」即「既」之隸古俗體，實為一字。三家實質無異辭，判為正俗字別，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.98, "argument": "「旣」乃古字本形，「既」為後世通行隸定。底本南宋刊本存古形，今本概從俗體，失校書存真之旨。"}, {"name": "解縉", "method": "他校法", "choice": "既", "grade": "確證", "confidence": 0.92, "argument": "「旣」「既」實乃正俗字之別，非實質異文。南宋刻本多作「旣」，乃沿襲魏晉以來俗體。考《四部叢刊》影寫本亦作「旣」，今本改「既」，直正其字耳。此非文義之殊，底本不當輒改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "確證", "confidence": 0.99, "argument": "「旣」為「既」之隸古及俗體，實為一字之變，非通假異文。今本作「既」乃正字，當從。"}]}, {"id": "D0021", "type": "實質異文", "left": "傳之指粲然復明於", "right": "雖以熹之不敏亦幸", "base": "丗", "ref": "世", "choices": ["丗", "世"], "chosen": "丗", "confidence": 0.98, "ocr_conf": 0.9815, "suspended": false, "risk": "不改底本正文，僅出校記存辨；若誤改今本，則失古字之真。", "note": "丗乃世之古文，漢碑及古寫本屢見，宋槧猶存舊帙之真。三家並主存舊，今本改作世，失古本之真，當從底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丗", "grade": "確證", "confidence": 0.95, "argument": "丗乃世之古文，漢碑及古寫本屢見。南宋本猶存舊帙形態，今本輒改作世，失古本之真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "丗", "grade": "確證", "confidence": 0.95, "argument": "「丗」乃「世」之古文變體，形以卅增點畫，唐以前寫本碑版習見此體，宋槧猶存古字，今本輒改從通行，當據底本正之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "丗", "grade": "確證", "confidence": 0.99, "argument": "「丗」乃「卅」之隸變，即「世」之古文，非實質異文，乃古今字異。依存舊不改之例，當存底本原字。"}]}, {"id": "D0033", "type": "脫文缺字", "left": "得后與後同後放此", "right": "止者所當止之地即", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.98, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文僅出校記，誤判則傷古書重文舊式。", "note": "劉、戴均主○，謂即重文號，承上後字。今本臆補後字，反失古式。底本〇當即○之異寫，存舊不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "此乃釋文之重文號，承上「後」字作「○」，謂後字重出。底本有重文號，今本臆補作「後」字，反失古書重文之舊式。當存底本之○。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本圍形「〇」即圈發或斷句符，非脫文。今本作「○」，殆因刻工或錄者以字模易之，實同為圈點符。未得確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "底本有「〔〇〕」之校勘記號，此處實脫一符占位。今本補「○」符合體例。脫文有徵，當據補，不涉以意改字。"}]}, {"id": "D0059", "type": "實質異文", "left": "詩作咺諠詩作諼並", "right": "晚反恂鄭氏讀作峻", "base": "况", "ref": "況", "choices": ["况", "況"], "chosen": "况", "confidence": 0.98, "ocr_conf": 0.9696, "suspended": false, "risk": "改不改無損句讀文義，但妄改古字則失版本之真。", "note": "况、況古今字，非實質異文。劉、解據版本存古字，戴氏亦謂義訓無別。底本可通，不當輒改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "况", "grade": "確證", "confidence": 0.95, "argument": "「况」為古字，「況」為後出。南宋本存古作「况」，今本作「況」乃後人據通行字臆改。劉向對校，當從底本不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "况", "grade": "確證", "confidence": 0.9, "argument": "唐石經、敦煌寫本及日傳古鈔卷多用「况」，「況」乃後起別體。此反切讀法唐以前故訓作「况」甚明，當從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "況", "grade": "確證", "confidence": 0.98, "argument": "况、況本古今字，同隸曉紐陽部，非實質異文。今本作況合乎正字，底本作况乃古字省旁，義訓無別，當從今本回改。"}]}, {"id": "D0067", "type": "實質異文", "left": "不得其所所以旣没", "right": "而人思慕之愈乆而", "base": "丗", "ref": "世", "choices": ["丗", "世"], "chosen": "丗", "confidence": 0.98, "ocr_conf": 0.9748, "suspended": false, "risk": "誤判不改，不改正文，僅出校記，不影響句讀。", "note": "丗乃世之古文，二字本同，文義無別。解、戴謂非實質異文，其說是也。底本文義可通，存古形不改，今本作世附識於此。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丗", "grade": "確證", "confidence": 0.95, "argument": "丗乃世之本字，漢簡即作此形。南宋本存古，今本輒改作世。此乃後人臆改失真，當從底本不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "世", "grade": "旁證", "confidence": 0.95, "argument": "「丗」乃「世」之隸古定，六朝寫本及日本古鈔本屢見，為唐以前鈔本舊形，並非實質異文。今本作「世」，乃後人通改今字，文義無別。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "世", "grade": "確證", "confidence": 0.98, "argument": "丗乃世之古文奇字，二字本同。古籍中世多作丗，此非實質異文，乃異體耳。據文義當作世。"}]}, {"id": "D0074", "type": "衍文重出", "left": "教必使學者即凡天", "right": "下之物莫不因其巳", "base": "申方つと", "ref": "", "choices": ["申方つと", ""], "chosen": "今本作〔〇〕", "confidence": 0.98, "ocr_conf": 0.9592, "suspended": false, "risk": "誤刪正文則損古籍原貌，然此確為旁注混入", "note": "「申方つと」乃倭人訓讀旁記片假名，誤羼正文。劉、解、戴三家皆主刪，今據削之，復舊觀。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "申方つと、", "grade": "確證", "confidence": 0.97, "argument": "「申方つと」乃倭邦校讀旁注，混入天字之側。今本刪之，正復中秘舊觀。底本存之，實為後人妄加，非原本所有。"}, {"name": "解縉", "method": "他校法", "choice": "申方つと、", "grade": "確證", "confidence": 0.98, "argument": "日文訓點非典籍正文，今本刪之是也，底本衍文無疑，不煩他校。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "申方つと", "grade": "確證", "confidence": 0.98, "argument": "「申方つと」乃底本之傍記片假名，為日人習讀漢籍之批注，後人誤羼入正文。今本刪之是也，當據今本削之。"}]}, {"id": "D0080", "type": "形近疑誤", "left": "也獨者人所不知而", "right": "所獨知之地也言欲", "base": "巳", "ref": "己", "choices": ["巳", "己"], "chosen": "己", "confidence": 0.98, "ocr_conf": 0.6544, "suspended": false, "risk": "若誤斷，則正文、校記皆失，且「己所獨知」句讀或致歧解。", "note": "「巳」形近致誤。解縉引《章句集注》確證、戴震據本書文例，皆作「己」。底本「巳」文義不通，據正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "己", "grade": "旁證", "confidence": 0.85, "argument": "底本「巳」蓋刻工手誤或字口漫漶致認。此承上文「人所不知」句，作「己」方與「人」對舉，行款相應。今本作「己」，當是存古。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "確證", "confidence": 0.98, "argument": "此《中庸》君子慎獨章朱注。宋本諸經如《四書章句集注》皆作「己所獨知之地」。古籍刻本己、巳形近致訛甚夥，據他書確證當作「己」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "己", "grade": "確證", "confidence": 0.98, "argument": "「人之所不知，而己所獨知」，本書他處及諸本皆作「己」。「巳」「己」形近致誤，於義大窒。此顯為刻工手誤，當據義校正。"}]}, {"id": "D0081", "type": "實質異文", "left": "閉藏之貌此言小人", "right": "爲不善而陽欲揜之", "base": "隂", "ref": "陰", "choices": ["隂", "陰"], "chosen": "隂", "confidence": 0.98, "ocr_conf": 0.9796, "suspended": false, "risk": "誤判則以異體字回改正文，失宋刻原貌，屬無謂改字。", "note": "底本作「隂」，今本作「陰」。三家咸謂二字同字異體，非實質異文。底本文義可通，存舊貌不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "隂", "grade": "確證", "confidence": 0.95, "argument": "底本作「隂」，從𨸏，阜旁在左，乃古文正體。今本作「陰」，从𨸏在左作阝，乃後世通行俗體。底本行款為宋刻原貌，未經臆改，當存古。今本以通行字回改，反失真。"}, {"name": "解縉", "method": "他校法", "choice": "陰", "grade": "推測", "confidence": 0.95, "argument": "隂為陰之隸古異體，宋刻多沿用。此非實質異文，乃異體別擇。今本作陰，用通行正字。未得他書確證，然二實一字。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "隂陰實同字，隓省與阜旁之異耳，音義全同，非通假亦非實質異文。二本各有所承，當存舊貌，毋須回改。"}]}, {"id": "D0089", "type": "實質異文", "left": "身當作心忿弗粉反", "right": "敕值反好樂並去聲", "base": "懥", "ref": "憶", "choices": ["懥", "憶"], "chosen": "懥", "confidence": 0.98, "ocr_conf": 0.9734, "suspended": false, "risk": "底本不誤，僅出校記。若妄改正文，反失古本之真。", "note": "底本作「懥」，敕值反，與《大學》朱子《章句》合。今本作「憶」，音義俱乖，屬臆改，不改正文，附校記辨之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "懥", "grade": "確證", "confidence": 0.95, "argument": "底本作懥，與敕值反之音訓相應。今本作憶，絕無此音，顯屬臆改。音義相合，鐵證不移。"}, {"name": "解縉", "method": "他校法", "choice": "懥", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》原文作「身有所忿懥」。朱子《章句》注「懥，敕值反」，正合底本反切。今本「憶」絕非《大學》文，當為後人臆改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "懥", "grade": "確證", "confidence": 0.98, "argument": "此條實釋《大學》「心有所忿懥則不得其正」。正文前已有「心」字，下承「忿」「好樂」皆《大學》正文。「懥」從心質聲，「憶」從心意聲，形音俱別，非通假亦非形訛，今本作「憶」顯為妄改。"}]}, {"id": "D0091", "type": "實質異文", "left": "以起下章蓋意誠則", "right": "無惡而實有善矣所", "base": "眞", "ref": "真", "choices": ["眞", "真"], "chosen": "眞", "confidence": 0.98, "ocr_conf": 0.9781, "suspended": false, "risk": "判錯無大害，唯誤從今本則失宋刻舊貌", "note": "底本作眞，隸古定形也。今本作真，乃通行俗體。二字正俗之別，義訓無殊，今本臆改失舊。底本文義自通，存舊不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "眞", "grade": "確證", "confidence": 0.95, "argument": "底本南宋刊本作「眞」，乃隸古定形，存古文之舊。今本作「真」乃後世通行俗體，顯係後人整理時臆改，反失其真。"}, {"name": "解縉", "method": "他校法", "choice": "眞", "grade": "確證", "confidence": 0.85, "argument": "眞為正字，真為省俗。宋刻經籍多作眞，此非異文，乃一體之別。他校無涉，當從底本舊刻。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.98, "argument": "「眞」與「真」乃正俗之別，古今字也，非關通假。二字義訓無殊，文義皆通。依存異不改之例，當出校記云某本作某，不當輒改底本。"}]}, {"id": "D0097", "type": "脫文缺字", "left": "於上而教成於下也", "right": "康誥曰如保赤子心", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.98, "ocr_conf": 1.0, "suspended": false, "risk": "改正文補二字，影響句讀斷句，然三家硬證俱全，誤判風險極低。", "note": "三家校法各異而同歸。劉對校、解他校、戴本校皆確證脫「大學」二字，今據補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "底本刻工行密，脫「大學」二字，遂致兩句迫接，今本有之，合於篇第，足正底本脫文之失。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "朱子《大學章句》以「康誥曰如保赤子」釋「如保赤子」義，引古書以發《大學》本旨，此節實屬《大學》，非《中庸》。今本補「大學」二字是也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "此引《大學》文，本書引經例必冠書名。上文「教成於下也」即《大學》文，下接「康誥曰」乃引《書》。據本書體例，此處當脫「大學」二字，當據補。"}]}, {"id": "D0103", "type": "脫文缺字", "left": "有諸己而后求諸人", "right": "所藏乎身不恕而能", "base": "", "ref": "無諸己而后非諸人", "choices": ["", "無諸己而后非諸人"], "chosen": "無諸己而后非諸人", "confidence": 0.98, "ocr_conf": 1.0, "suspended": false, "risk": "此條有版本、他書、文例三重確證，判錯僅屬失校，不影響句讀。", "note": "底本脫此句。劉向據行款，解縉據《荀子·法行》，戴震據本書文例，三證確鑿，當補正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "無諸己而后非諸人", "grade": "確證", "confidence": 0.95, "argument": "底本此句上下文乃釋「有諸己而后求諸人」而連及對文「無諸己而后非諸人」。今以宋槧行款及字數驗之，此十字正當接前句並列成義。底本唯脫此句重文號下一行，今本據古本完整結構補之，正合宋刻原貌。底本顯有脫文，今本存古無疑，當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "無諸己而后非諸人", "grade": "確證", "confidence": 1.0, "argument": "《荀子·法行》引作「無諸己而后非諸人」，與《大學》「有諸己而后求諸人」對舉。底本脫此七字，據古注他書確證補正。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、無諸己而后非諸人", "grade": "確證", "confidence": 1.0, "argument": "此《大學》文，與下句相應。無「無諸己」句，則下「不恕」無所指，文義窒礙。底本脫八字無疑，當據今本補。"}]}, {"id": "D0104", "type": "脫文缺字", "left": "喻諸人者未之有也", "rig const KEY = 'guji:' + DATA.work + ':' + DATA.run_id;
let dec = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'pending', cur = 0;

const save = () => localStorage.setItem(KEY, JSON.stringify(dec));
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function visible(){
  return DATA.cases.filter(c => filter === 'all' ? true
    : filter === 'done' ? (dec[c.id] || !c.suspended)
    : (c.suspended && !dec[c.id]));
}

function render(){
  const list = document.getElementById('list');
  const items = visible();
  document.getElementById('n1').textContent = DATA.cases.filter(c=>c.suspended&&!dec[c.id]).length;
  document.getElementById('n2').textContent = DATA.cases.filter(c=>dec[c.id]||!c.suspended).length;
  document.getElementById('n3').textContent = DATA.cases.length;
  const solved = Object.keys(dec).length;
  const need = DATA.cases.filter(c=>c.suspended).length;
  document.getElementById('prog').textContent =
    `懸置 ${need} 條，已處理 ${solved} 條`;

  if(!items.length){ list.innerHTML = '<div class="empty">此頁無條目。懸置條目已全部處理。</div>'; return; }
  list.innerHTML = items.map((c,i) => {
    const d = dec[c.id];
    const chs = c.choices.map((x,k) =>
      `<button class="ch ${d&&d.choice===x?'sel':''}" data-id="${c.id}" data-v="${esc(x)}">
        <kbd>${k+1}</kbd>${esc(x)||'〇（刪）'}</button>`).join('');
    const ops = c.opinions.map(o =>
      `<div class="op"><span class="who">${esc(o.name)}</span>
       <span class="g">${esc(o.method)}·${esc(o.grade)}·${o.confidence.toFixed(2)}</span>
       主「${esc(o.choice)}」：${esc(o.argument)}</div>`).join('');
    return `<div class="case ${d?'done':''} ${i===cur?'cur':''}" data-id="${c.id}">
      <div class="meta"><span class="badge">${esc(c.id)}</span>
        <span class="badge">${esc(c.type)}</span>
        <span class="badge">合議一致度 ${c.confidence.toFixed(2)}</span>
        <span class="badge">OCR ${c.ocr_conf.toFixed(2)}</span>
        ${c.suspended?'<span class="badge" style="color:#9c3b2e">懸置</span>':''}</div>
      <div class="ctx">…${esc(c.left)}<b>〔${esc(c.base)||'〇'}〕</b>${esc(c.right)}…
        <br><span style="font-size:14px;color:#6f6555">今本此處作：〔${esc(c.ref)||'〇'}〕</span></div>
      <div class="ops">${ops}</div>
      <div class="risk">機器裁斷：${esc(c.chosen)}　｜　${esc(c.risk)}</div>
      <div class="choices">${chs}
        <button class="ch ${d&&d.choice==='兩存'?'sel':''}" data-id="${c.id}" data-v="兩存"><kbd>3</kbd>兩存</button>
      </div>
      <textarea placeholder="人工按語（將寫入校勘記）" data-note="${c.id}">${esc(d?d.note:'')}</textarea>
    </div>`;
  }).join('') + `<div class="hint">鍵盤：J／K 移動　1‑9 選讀法　3 兩存　E 導出<br>
   決策存於本機 localStorage，導出 decisions.json 後回灌流水線即可重出定本。</div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('.ch');
  if(t){ const id = t.dataset.id;
    dec[id] = {choice: t.dataset.v, note: (dec[id]||{}).note || '', at: new Date().toISOString()};
    save(); render(); return; }
  const tab = e.target.closest('.tab');
  if(tab){ filter = tab.dataset.f; cur = 0;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===tab));
    render(); }
});
document.addEventListener('input', e => {
  const id = e.target.dataset.note;
  if(id){ dec[id] = Object.assign({choice:'', note:''}, dec[id], {note:e.target.value}); save(); }
});
document.getElementById('exp').onclick = () => {
  const out = {work: DATA.work, run_id: DATA.run_id,
    exported_at: new Date().toISOString(), decisions: dec};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download = 'decisions.json'; a.click();
};
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA') return;
  const items = visible();
  if(e.key === 'j'){ cur = Math.min(cur+1, items.length-1); render(); }
  if(e.key === 'k'){ cur = Math.max(cur-1, 0); render(); }
  if(e.key === 'e'){ document.getElementById('exp').click(); }
  if(/^[1-9]$/.test(e.key) && items[cur]){
    const c = items[cur]; const opts = c.choices.concat(['兩存']);
    const v = opts[+e.key-1]; if(v===undefined) return;
    dec[c.id] = {choice:v, note:(dec[c.id]||{}).note||'', at:new Date().toISOString()};
    save(); render();
  }
});
render();
</script></html>
