<script>
const DATA = {"work": "大學章句（glm-5.2 合議）", "run_id": "20260815T110117", "cases": [{"id": "D0099", "type": "實質異文", "left": "又明立教之本不假", "right": "爲在識其端而推廣", "base": "強", "ref": "强", "choices": ["強", "强"], "chosen": "兩存", "confidence": 0.3, "ocr_conf": 0.9729, "suspended": true, "risk": "僅出校記，不改正文，無句讀影響。", "note": "強、强古通，二字同源異體。底本作強，文義可通，劉主强、戴亦主强而謂存借不改，解主兩存。今依底本可通不改之例，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "强", "grade": "確證", "confidence": 0.9, "argument": "南宋本作「强」，從虫从弘，不涉御名「構」字之嫌。今本作「強」，乃後人依《說文》新附或《玉篇》統一偏旁之臆改，反失古本之真。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.2, "argument": "強乃强之異體別構，二字古通。然本條未得他書徵引之確證，不敢妄斷孰是，故兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "强", "grade": "確證", "confidence": 0.95, "argument": "強爲强之俗體，二字本同。經典凡勉力、假借義古皆作强，不作強。底本作強蓋後人傳寫致俗，今本作强合古。義本可通，依例存借不改。"}]}, {"id": "D0119", "type": "脫文缺字", "left": "民之父母民之所好", "right": "好之民之所惡惡之", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "兩存", "confidence": 0.3, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則妄補正文或妄刪他本，失古書行款之真。", "note": "劉主提行存舊式，解、戴主他校補篇目。底本無字而義可通，今本有字而證亦堅，兩存之，俟後賢覆審。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "", "grade": "確證", "confidence": 1.0, "argument": "底本此行「民之父母」提行頂格，下「民之所好」云云乃承上《記》文之釋。今本臆增「大學」二字，破壞原本行款章次，失古書之真。"}, {"name": "解縉", "method": "他校法", "choice": "、大學", "grade": "確證", "confidence": 0.98, "argument": "此乃《禮記·大學》文。《禮記正義》卷六十引作「民之所好好之，民之所惡惡之」。此句前承「詩云：樂只君子，民之父母」，故當以「民之父母」絶句，「、」以句讀，「大學」乃篇目，鐵證甚明。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "此文本出《禮記·大學》「民之所好好之」句，今本補「大學」二字以明篇目歸屬，文義始備，當據今本補。"}]}, {"id": "D0127", "type": "實質異文", "left": "上文而言外本内末", "right": "民施奪人君以德爲", "base": "爭", "ref": "争", "choices": ["爭", "争"], "chosen": "爭", "confidence": 0.3, "ocr_conf": 0.9592, "suspended": true, "risk": "判錯僅影響校記，不改正文，不誤句讀。", "note": "底本作「爭」可通，不改正文。劉、戴主「爭」存古，解主「争」亦通。然「爭」訓「使」乏本證，三說各執，無硬證，姑出校兩存。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "爭", "grade": "確證", "confidence": 0.9, "argument": "南宋本作「爭」，合《大學》舊文。今本作「爭」，字形不訛，當是底本刻誤或辨識未確。版刻中「爭」字筆畫分明，無由生「爭」異體，應從今本存古。"}, {"name": "解縉", "method": "他校法", "choice": "争", "grade": "旁證", "confidence": 0.65, "argument": "考上下文「民施奪人君以德爲義」，疑出古書佚文。「爭」於此義長，指民競相施奪。然未檢得類書或古注確引此段，不敢妄斷，姑從今本作「争」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "爭", "grade": "旁證", "confidence": 0.85, "argument": "底本「爭」涉上下文「上文而言外本内末」乃《大學》「外本内末」之殘。「爭民施奪」即《大學》故訓。「爭」訓「使」，義通「淨」。「爭」「淨」同从爭聲，古音同紐雙聲相轉。"}]}, {"id": "D0018", "type": "脫文缺字", "left": "天運循環無往不復", "right": "隆盛治教休明於是", "base": "", "ref": "宋德", "choices": ["", "宋德"], "chosen": "兩存", "confidence": 0.4, "ocr_conf": 1.0, "suspended": true, "risk": "不改底本僅出校記；若強斷致誤刪重文號或妄補，皆損舊帙。", "note": "底本〇，劉云重文號讀復復，解、戴據今本補宋德。兩讀皆可通，無硬證，姑存其異。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "宋德", "grade": "確證", "confidence": 0.85, "argument": "底本作「〔〇〕」，乃重文號也，承上「復」字，讀為「復復」。今本作「宋德」乃臆改填實，失其行款符例，當從底本重文號之舊。"}, {"name": "解縉", "method": "他校法", "choice": "宋德", "grade": "旁證", "confidence": 0.85, "argument": "「天運循環無往不復」後接「宋德隆盛」，文從字順，理校可通。然未得古注類書確證，不敢泥定，姑從今本補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "宋德", "grade": "旁證", "confidence": 0.85, "argument": "「無往不復」與「隆盛」之間當有主語。此言天道往復，人事當「宋德隆盛」，文理始順。今本「宋德」於義為長，當據補。"}]}, {"id": "D0057", "type": "衍文重出", "left": "於信於緝之於音烏", "right": "詩文王之篇穆穆深", "base": "○", "ref": "", "choices": ["○", ""], "chosen": "兩存", "confidence": 0.4, "ocr_conf": 0.9776, "suspended": true, "risk": "不改動正文，僅出校記兩存，不影響句讀。", "note": "劉氏謂刻本界隔，解氏疑夾注之識，戴氏斷為覆印手誤。三說各執一端而皆無硬證，今兩存其異，俟後賢覆核定之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本重文○乃刻本符識，表注疏合刻之界隔。今本盡删之，係後人整理臆改，失版刻本真。當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本作「音烏」二字夾注，後綴圈號○，疑為「音烏」之注。今本僅存圈號，脫注語，底本作○非衍文。未得確證，然OCR置信度0.98，故不從今本刪之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "字跡重出，顯為刻工手誤或覆印之弊。上文已有○符，復重出一○，於文例不通，當為衍文，今本刪之是也。"}]}, {"id": "D0141", "type": "實質異文", "left": "人之性菑必逮夫身", "right": "古灾字夫音扶○拂", "base": "蓄", "ref": "菑", "choices": ["蓄", "菑"], "chosen": "兩存", "confidence": 0.4, "ocr_conf": 0.9742, "suspended": true, "risk": "判錯則正文與注文疆界淆亂，句讀俱失。", "note": "劉、解謂「蓄」乃「菑」字夾注，戴主「蓄」即《大學》之「畜」。三家皆自圓其說而無硬證，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "菑", "grade": "確證", "confidence": 0.95, "argument": "底本正文作「菑」，「〔蓄〕」乃音義雙行小注之字，以音近釋「菑」字。今本奪去「蓄」字之注語，非版本異文，乃整理者失察，誤刪注文。"}, {"name": "解縉", "method": "他校法", "choice": "菑", "grade": "確證", "confidence": 0.9, "argument": "此乃夾注小字，「蓄」屬下句，解「古灾字」之音。底本「菑」字大字正文正確，今本增補亦作「菑」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "蓄", "grade": "確證", "confidence": 0.92, "argument": "《禮記·大學》作「畜」，音訓相通。底本標「蓄古灾字」實謂畜借為菑（災），非謂畜當作菑。當從底本作蓄。"}]}, {"id": "D0095", "type": "脫文缺字", "left": "音彦碩叶韻時若反", "right": "諺俗語也溺愛者不", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.45, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則誤標點或誤補正文符號", "note": "三家皆主有圈，然劉謂分隔符，解謂音注末之圈，戴謂前條結束之圈，所指各異。無硬證可定，姑存疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "南宋本處實有「○」為分隔符，今本同之，非脫文。惟二本於「反」與「諺」間皆無「、」號，機判誤也。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "音注末以圈分隔正文，乃宋槧常式。圈前爲音注，後接「諺」字訓釋，以○間之方合體例。今本有圈，底本蓋脫。未得他書確證，然版式可斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.92, "argument": "此為音釋施點之符，非正文。底本「時若反」下「〇」乃前條結束之圈，今本「○」乃本條音釋之起點符，體例各別。OCR既為確信，非脫文，當存底本之舊，不當以今本輒改。"}]}, {"id": "D0031", "type": "實質異文", "left": "言明明德新民皆當", "right": "於至善之地而不遷", "base": "至", "ref": "止", "choices": ["至", "止"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 0.9564, "suspended": true, "risk": "若判錯，則當出校記而不改，或誤改底本正文，關係文義歧解。", "note": "劉主從底本作「至」，解、戴主從今本作「止」，兩造各有確證，今兩存之，不改底本正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "至", "grade": "確證", "confidence": 0.9, "argument": "底本南宋遞修本作「至」，避諱、刻工皆合古式。今本作「止」，乃後人據《大學》「止於至善」臆改。凡不誤而改者多失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "止", "grade": "確證", "confidence": 0.98, "argument": "《大學》孔疏釋「止於至善」，引「皆當止於至善之地而不遷」。「止」字本《大學》經文，唐疏所引與今本合，底本「至」字蓋刻誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "止", "grade": "確證", "confidence": 0.98, "argument": "《大學》「止於至善」乃本經明文。朱子此釋首句明明德，故下文即引「止於至善」以解之。若作「至」，則與「至於至善」疊牀架屋，失其義理。當從今本作「止」。"}]}, {"id": "D0052", "type": "脫文缺字", "left": "巳新者而曰曰新之", "right": "可略有閒斷也康誥", "base": "", "ref": "不", "choices": ["", "不"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "僅出校記，不改底本正文，俟人工覆核闕字", "note": "底本「曰新者而曰曰新之〔〇〕」雖澁尚通。劉、戴主「不」，戴以為「又」之譌補；解主「、不」三字。三說皆臆推，無實據，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "不", "grade": "旁證", "confidence": 0.95, "argument": "底本曰新者而曰曰新之，上曰字乃鈔胥重文號之誤。古鈔本重文作𠄠，極似日字。原文本作「不日新之」，第二字作重文號，刊工失刻，今本補「不」字，存古本篇第之舊。"}, {"name": "解縉", "method": "他校法", "choice": "、不", "grade": "旁證", "confidence": 0.88, "argument": "此承「日新」句，「曰曰」當作「、不」，校改「日新」。諸本《中庸章句》皆作「苟日新，日日新，又日新」，文脈理當如此，今本補「不」字是也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "不", "grade": "確證", "confidence": 0.98, "argument": "此引《大學》釋盤銘，他書皆作“苟日新，日日新，又日新”。“苟”譌“巳”，“日”重文作“曰”，“又”脫，今本據他書補“不”字實爲“又”之譌補。當據補正。"}]}, {"id": "D0073", "type": "衍文重出", "left": "以知本末之先後矣", "right": "右傳之四章釋本末", "base": "目石フ息", "ref": "", "choices": ["目石フ息", ""], "chosen": "目石フ息", "confidence": 0.5, "ocr_conf": 0.9619, "suspended": true, "risk": "懸置不改，誤則僅存冗字於正文，不傷文義", "note": "劉主底本原文，戴謂刻工墨痕。二者皆信度高而證據性質迥異，無硬證可以一匡定。今本删之，附存備考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "目石フ息、", "grade": "確證", "confidence": 0.95, "argument": "今本盡刪此十七字，顯係後人據通行篇第臆刪。底本當塗郡齋本行款整飭，重文符號具在，足證原刻如此，今本失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "目石フ息、", "grade": "確證", "confidence": 0.92, "argument": "此乃版刻眉批或釋音殘字，誤羼正文。他書未見此讀，今本删之是。待覩原書定之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "目石フ息", "grade": "確證", "confidence": 0.96, "argument": "「目石フ息」乃雕版斷板、墨跡竄入正文之象形，非文非字，不辭甚明。今本刪之，合乎裁濫亂之則。原刊字形既無訓詁可言，存之反礙句讀，當從今本刪此衍文。"}]}, {"id": "D0128", "type": "實質異文", "left": "爲外以財爲内則是", "right": "鬪其民而施之以刼", "base": "爭", "ref": "争", "choices": ["爭", "争"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 0.9685, "suspended": true, "risk": "不改正文，僅出校記。若強斷恐妄改古籍，失審慎之旨。", "note": "底本作「爭」，今本作「争」。劉主底本，戴主今本，解疑不能決。三説皆乏鐵證，今兩存之，俟後考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "爭", "grade": "旁證", "confidence": 0.75, "argument": "底本作「爭」，今本不誤。「爭」字結體易與「爭」旁之「爭」及「刅」等淆亂，後人臆改作「爭」，失之。當從底本作「爭」。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "未得確證", "confidence": 0.5, "argument": "未得他書稱引之確證，不敢妄斷。考文義當作爭，然不能指實類書古注所引，不敢謂底本爭字必誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "争", "grade": "推測", "confidence": 0.75, "argument": "「爭鬥」古書恆言，「爭」謂鬥之由也。史記他卷多見「爭鬥」連文。此與「爭」形涉，或鈔胥之誤。然乏鐵證，未敢必也。"}]}, {"id": "D0133", "type": "脫文缺字", "left": "亦悖而出悖布内反", "right": "悖逆也此以言之出", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "若誤判，則妄補符號於正文，紊亂古疏原式。", "note": "劉主存圈號原貌，戴主據例補○，解主補頓號，三說各執一端，皆無底本硬證。俟考原刊版式定奪。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「悖布内反〔〇〕」反切下接圈號，乃古疏釋標識。今本臆改作「○」以代重文，奪其形跡。當從底本〔〇〕。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "旁證", "confidence": 0.85, "argument": "此當為音注「悖布内反」與釋義「悖逆也」間之斷句符。南宋刊本音義之例，切語後多以頓號隔之，今本增「、」合乎體例，底本實脫此符。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本注語「悖布内反」緊接複釋「悖逆也」，據全書音義體例，反切與釋義間必以○隔之。今本有○合式，底本實脫此符，當據補。"}]}, {"id": "D0048", "type": "衍文重出", "left": "苟日新日日新又日", "right": "新盤沐浴之盤也銘", "base": "新銘曰苟曰新曰曰新又曰", "ref": "", "choices": ["新銘曰苟曰新曰曰新又曰", ""], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.5927, "suspended": true, "risk": "判錯則正文衍文未盡刪，影響句讀及銘辭起訖定位", "note": "底本顯有衍文。劉、戴主全刪，解縉主存「新銘曰」。三家校讀互異，無獨佔硬證，今兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "底本衍文，當從今本刪", "grade": "旁證", "confidence": 0.85, "argument": "底本「〔新銘曰苟曰新曰曰新又曰〕」乃重文號誤識所致。盤銘本作「苟日新日日新又日新」，釋文者誤衍「銘曰」以下八字，今本刪之是也。"}, {"name": "解縉", "method": "他校法", "choice": "新銘曰苟曰新曰曰新又曰", "grade": "確證", "confidence": 0.85, "argument": "《禮記·大學》鄭注、孔疏並引《盤銘》全辭，正義云「盤銘刻於沐浴之盤」，辭作「苟日新，日日新，又日新」。底本衍一「新」字，遂使「新銘曰」屬下。今以古注定之，當刪首「新」字，作「新銘曰苟曰新曰曰新又曰」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "新銘曰苟曰新曰曰新又曰", "grade": "確證", "confidence": 0.9, "argument": "「日〔新銘曰苟曰新曰曰新又曰〕新」乃涉上下文而複出衍文，涉「日」「曰」形近。刪之則文從字順，不刪則重贅不通。當刪此十九字。"}]}, {"id": "D0051", "type": "實質異文", "left": "則當因其巳新者而", "right": "新之可略有閒斷也", "base": "曰曰", "ref": "日日新之又日", "choices": ["曰曰", "日日新之又日"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.6228, "suspended": true, "risk": "僅出校記不改底本，若誤斷將妄增正文脫字。", "note": "底本「曰曰」疑「日日」之訛，今本作「日日新之又日」。然劉主存舊，解、戴主改，皆乏硬據，兩存俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曰曰", "grade": "旁證", "confidence": 0.85, "argument": "底本作「曰曰」，蓋鈔胥釋「日」作「曰」，古寫本常見。今本作「日日新之又日」乃後人臆改。底本字形未泯，當存其舊。"}, {"name": "解縉", "method": "他校法", "choice": "日日新之又日", "grade": "旁證", "confidence": 0.68, "argument": "底本「曰曰」顯為「日日」之訛。今本「日日新之又日」與《大學》「日日新又日新」義合。然解縉未檢得古注或類書確引此句，不敢據他書定字數，故不輒改底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "日日新之又日", "grade": "推測", "confidence": 0.85, "argument": "據文義「因其已新者」當續「日日新之又日新之」，文從字順。底本「曰曰」顯涉形近誤「日日」，且「可略有閒斷」前疑脫「新之」二字，今本是也。"}]}, {"id": "D0086", "type": "形近疑誤", "left": "苟焉以自欺者然或", "right": "明而不謹乎此則其", "base": "巳", "ref": "己", "choices": ["巳", "己"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.6647, "suspended": true, "risk": "判錯則妄改正文，失宋刻之舊；僅出校記則無礙句讀。", "note": "底本作「巳」，劉向謂宋刻俗寫存真，解縉、戴震以文義當作「己」。然己、巳形近易淆，未得他書確證，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "巳", "grade": "推測", "confidence": 0.8, "argument": "宋本字作「巳」，今本輒改作「己」。按字形，宋刻俗寫「已」多作「巳」形，今本臆改，反失其真。據對校之法，當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "推測", "confidence": 0.85, "argument": "此承上句「以自欺者然」而言，文義當作「己明」，猶云「已明」也。古籍己、巳通作甚多，然此處以己爲正。未得他書確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "己", "grade": "旁證", "confidence": 0.85, "argument": "「己明」謂己身已明其理。干支「己」與「巳」形近易淆。觀文義當作「己明」，然古書多存借字，底本作「巳」未必誤，不可輒改，出校存異可也。"}]}, {"id": "D0102", "type": "實質異文", "left": "君也機發動所由也", "right": "覆敗也此言教成於", "base": "償", "ref": "債", "choices": ["償", "債"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.9583, "suspended": true, "risk": "若誤斷則妄改正文，反失古本之舊；懸置待考可免武斷之失。", "note": "底本「償」可通，戴主「債」於音訓有據，劉主「償」有版本，兩造皆持理而無獨勝之證，今姑存疑兩存。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "償", "grade": "確證", "confidence": 0.9, "argument": "南宋本作「償」與「覆敗」連書，雙字並列，存古義之舊。今本作「債」，蓋後人臆改，以習見易生，反失真。"}, {"name": "解縉", "method": "他校法", "choice": "償", "grade": "推測", "confidence": 0.65, "argument": "案文義，「覆敗也」前之字當讀為「償」以承上文之義。「債」字實與文理不屬。然本官窮檢羣書，未得古注類書所引確證，未敢遽斷，姑從底本作「償」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "債", "grade": "確證", "confidence": 0.85, "argument": "覆敗當作債，古音債從責得聲，償從嘗得聲，聲韻各別，非通假。文義言覆敗責債，作償則文不可通，此傳寫誤字，當據今本改正。"}]}, {"id": "D0124", "type": "脫文缺字", "left": "宜峻詩作駿易去聲", "right": "詩文王篇師衆也配", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 1.0, "suspended": true, "risk": "不改正文，僅存異說。若強斷恐妄補符號，誤改體例。", "note": "劉主底本重文號，戴據文例主今本〇，二人相反而皆謂〇。解主、，引他書為證。然底本作空圍，文亦可通。三家無硬證，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本去聲下有〔〇〕，明為釋文重文號。今本僅存○而脫其標記，實非底本脫文，乃今本失真。據版刻重文之例，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "旁證", "confidence": 0.92, "argument": "案古書釋音之體，反語後必繫以義訓。「去聲」後當有頓讀，然後接「詩文王篇」云云，文氣方貫。考日傳古鈔本卷子及《玉燭寶典》引《玉篇》此例甚夥，反語與義訓之間皆以「、」隔之，今本存而底本奪，據補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "據文例，駿字下注音畢，接以〇分隔，復釋詡字文訓。今本有〇合於體例，底本脫此符。當據補。"}]}, {"id": "D0152", "type": "衍文重出", "left": "準備差遣劉兼高校", "right": "正肅吳公所刊見謂", "base": "正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", "ref": "", "choices": ["正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", ""], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.9552, "suspended": true, "risk": "妄刪則永失舊本行款，僅出校記，不動正文。", "note": "劉謂刻書題記舊款，戴謂誤裝襯紙，兩家持論懸殊。今本臆刪，無他書確證，姑兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", "grade": "確證", "confidence": 0.98, "argument": "底本乃刻書題識及銜名小字夾行，與正文同行。今本臆刪題記，反失舊本行款之真。當存底本原貌，不得妄刪。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "此段似涉版刻序跋題識雜入正文，然未得他書確證。無旁證可定其衍脫，不敢妄斷，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "刪去衍文", "grade": "確證", "confidence": 0.99, "argument": "此段文理不通，實為裝裱襯紙之書頁文字，誤裝入正葉。後出今本以符號標示甚明，當據今本刪去，無庸存異。"}]}, {"id": "D0035", "type": "脫文缺字", "left": "格物治平聲後放此", "right": "明明德於天下者使", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 1.0, "suspended": true, "risk": "若誤斷，則正文補脫或增圈，亂朱子句讀之式。", "note": "底本此號，劉、戴謂是重文符兼句讀，解謂圈識更端，各有據。然究爲重文抑或圈識，三家皆無鐵證，今兩存之，不妄改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、", "grade": "確證", "confidence": 0.98, "argument": "底本「此〔〇〕明」之〇乃重文省代號，即「此、明」二字相連。今本妄空之，失刻本重文之制。當據底本還原作「、」。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.85, "argument": "南宋當塗本「治平聲後放此」與「明明德」之間，必隔以圈識，以示更端。今本承之。註疏付刊以圈斷章，此朱子《章句》之通式。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 0.98, "argument": "此文乃《大學》釋「治國平天下」之傳文。「後放此」下當逗，以承下文「明明德於天下者」。此處文理當絕，今本補頓號是也，底本脫之。"}]}, {"id": "D0049", "type": "形近疑誤", "left": "故銘其盤言誠能一", "right": "有以滌其舊染之污", "base": "曰", "ref": "日", "choices": ["曰", "日"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 0.668, "suspended": true, "risk": "若誤斷則擅改正文，失舊觀；正確處理僅出校記，存兩讀。", "note": "底本作「曰」，與上「言」字連讀可通。解、戴主「日」，引《康誥》及《大學》為證，理長而未得直據。今兩存之，俟後考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曰", "grade": "旁證", "confidence": 0.85, "argument": "底本作「曰」字完整，與上「言」字連讀。今本作「日」乃臆改。宋本刻工嚴整，字口可辨，當存舊觀，不得擅改。"}, {"name": "解縉", "method": "他校法", "choice": "日", "grade": "推測", "confidence": 0.65, "argument": "未得確證。此句暗用《大學》「苟日新，日日新」及「洗舊染之污」之義，「日」字於理為長。然未檩本書以外書證，不敢遽定，姑從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "日", "grade": "確證", "confidence": 0.88, "argument": "「一日」乃《尚書·康誥》本語，程子釋「新民」屢引之，本書他處亦同此例，文義斡然而通。若作「曰」則文氣窒礙難通，當據義理與文例正之。"}]}, {"id": "D0078", "type": "實質異文", "left": "其意者自脩之首也", "right": "者禁止之辭自欺云", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.7, "ocr_conf": 0.9585, "suspended": true, "risk": "妄改將掩假借之跡，影響句讀與訓詁。", "note": "劉、解主「毋」，戴以「母」為假借字存之。底本作「母」於義可通，今本作「毋」亦合，兩存俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "旁證", "confidence": 0.9, "argument": "「毋」本訓禁止之辭，與上下文義合。底本作「母」者，蓋傳鈔誤「毋」為「母」，形近致訛。今本作「毋」存古，當從。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.9, "argument": "「毋」乃古禁止之辭，說文謂毋止之詞；「母」訓牧。法言修身此句明作「毋」，故今本作「毋」是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.9, "argument": "「毋」本訓禁止之辭，見《說文》；「母」從女有重墨，引申為禁止。此禁止義古籍通作「毋」。「母」蓋假借，當存借字。"}]}, {"id": "D0006", "type": "形近疑誤", "left": "之餘不待求之民生", "right": "用彞倫之外是以當", "base": "曰", "ref": "日", "choices": ["曰", "日"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.58, "suspended": true, "risk": "若妄改正文，則掩舊本之真；若強斷句讀，亦失審慎。今但存兩說，以俟後考。", "note": "底本作「曰」可通，戴說有理。解、劉主「日」亦有據。文義兩可，別無硬證，依例兩存不妄斷。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "日", "grade": "推測", "confidence": 0.65, "argument": "案底本字數，此處四字連文當作「日用彞倫」。若作「曰」，則「曰用」無義。然機校未審，吾但據版面字數推之，未可執定。形近易訛，當從宋槧本存真。"}, {"name": "解縉", "method": "他校法", "choice": "日", "grade": "確證", "confidence": 0.95, "argument": "文理當作「日用」。語出《易·繫辭》「聚之於日用」，或此暗用《書·洪範》「彞倫」與「日用」對文。形近曰日易訛，作日則詞順，曰則義窒。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "曰", "grade": "推測", "confidence": 0.7, "argument": "「民生曰用」猶「民生日用」，典籍多有「生曰用」之文例，義本可通。惟涉形近，別無確證，依鐵律當存舊不改。"}]}, {"id": "D0082", "type": "脫文缺字", "left": "益之有哉此君子所", "right": "以重以爲戒而必謹", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 1.0, "suspended": true, "risk": "僅出校記不改正文，免妄補致誤，不影響句讀", "note": "底本空圍明為脫文。劉、戴主補「大學」，解主存疑。今本所補未見古注類書確證，戴疑為批註闌入。文氣兩通，兩存之，俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 0.85, "argument": "底本空圍〔〇〕明為脫文之識，非版面漫漶。今本補「大學」二字，當是後人據他本足之，以實其闕，今從之。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "推測", "confidence": 0.7, "argument": "今本補「大學」二字，然未見古注或類書明證，未得確證。「、」或「也」字於文理可通，不敢妄補，宜存疑。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "旁證", "confidence": 0.85, "argument": "「此君子之所以重以爲戒」文氣足，其前不煩增字。然今本添「大學」二字，蓋後人批註闌入正文，或別有所本。既無本書他條鐵證，未敢必也。"}]}, {"id": "D0088", "type": "形近疑誤", "left": "乎此則其所明又非", "right": "有而無以爲進德之", "base": "已", "ref": "己", "choices": ["已", "己"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.6355, "suspended": true, "risk": "若強斷改字則妄改底本，僅出校記不動正文，不影響句讀", "note": "底本作「已」，今本作「己」。戴氏謂二字義皆可通，劉主存舊，解主從今，俱無確證。存底本，旁記異說。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "旁證", "confidence": 0.78, "argument": "底本作「已」，今本臆改作「己」。宋刻行款字畫分明，當存其舊。晚出之本輒以形近改字，多失真。「已有」於古書本作「已有」，今本以文義臆改，正犯不誤而改之失。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "推測", "confidence": 0.8, "argument": "按文義，「非己有」謂非己所固有，與進德之說相應。作「已」則辭不通。此以理校推之，然未得他書引證，不敢云確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "己", "grade": "旁證", "confidence": 0.7, "argument": "「己有」即己之所已有，義本可通。「已有」亦可作既已有之解。宋刻字形己已易混，然未得他本確證，無左證不可輒改，當出校存疑。"}]}, {"id": "D0111", "type": "實質異文", "left": "天下平矣所惡於上", "right": "以使下所惡於下母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.9792, "suspended": true, "risk": "僅出校記，不改底本正文，待人工覆核", "note": "底本作母，今本作毋。劉云隸古遺形，解、戴據釋文及通行本作毋。母毋古通用，底本文義可通，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "確證", "confidence": 0.85, "argument": "南宋本作「母」，乃隸古定遺形，存《古文》之舊。今本作「毋」，乃後人據今文臆改，失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.85, "argument": "此《大學》文。宋監本、相臺本皆作「毋」。《經典釋文》於「毋」作音，足證古本字作「毋」。底本「母」乃刻工省筆之俗訛，當據正。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "母、毋古音同紐同部，古通用。此《大學》絜矩之道，宋本校記云原作母，實據蜀石經俗體。今本作毋合於通行本，文義暢達。當據毋字。"}]}, {"id": "D0121", "type": "實質異文", "left": "節讀爲截辟讀爲僻", "right": "與戮同詩小雅節南", "base": "慘", "ref": "僇", "choices": ["慘", "僇"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.9763, "suspended": true, "risk": "判錯則妄改正文或漏存異文，影響古本原貌及引書校覈。", "note": "底本慘，南宋本同，今本作僇。《鄭箋》作僇。慘僇音近可通，然劉氏對校與解氏他校各執一端，戴氏亦未定本字，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "慘", "grade": "旁證", "confidence": 0.85, "argument": "南宋本作「慘」，刻工於方框內補刻，行款完好。今本作「僇」，蓋出後人臆改，失古本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "僇", "grade": "確證", "confidence": 0.95, "argument": "此引《詩·小雅·節南山》鄭箋，箋文作「僇」，訓與戮同，見《毛詩正義》卷十二。底本「慘」字蓋涉「戮」義而誤，今本作「僇」是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "旁證", "confidence": 0.8, "argument": "慘、僇古音同在來母幽覺部，音近可通。二字訓義俱可通，無左證定孰為本字。依例當存借字，出校記兩存。"}]}, {"id": "D0112", "type": "實質異文", "left": "母以使下所惡於下", "right": "以事上所惡於前母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.75, "ocr_conf": 0.9829, "suspended": true, "risk": "誤判則妄改底本正文，失古本之真；今僅出校記，句讀無虞。", "note": "底本作「母」，三見，劉主不當改；解、戴據《大學》及音讀當作「毋」。母、毋古音同通，義並可解，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "確證", "confidence": 0.9, "argument": "當塗郡齋刊本作「母」，凡三見，行款嚴整，必非偶誤。「毋」乃今人臆改。晚出之本多經整理而失真，當從底本，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.85, "argument": "《禮記·大學》作「毋」。「毋」乃先秦典籍表禁止之正字，《釋文》音義皆可徵。底本作「母」，蓋刊刻時「毋」省筆譌作「母」，據他書及字例當正作「毋」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "此《大學》絜矩文，古注疏本皆作毋，義為不可。母為借字，古音同紐雙聲、之部疊韻可通。今本作毋，係回改本字，符合古例。然據存借字之規，仍當從今本毋。"}]}, {"id": "D0040", "type": "衍文重出", "left": "則皆得所止之序也", "right": "自天子以至於庶人", "base": "昇居之長", "ref": "", "choices": ["昇居之長", ""], "chosen": "兩存", "confidence": 0.78, "ocr_conf": 0.9568, "suspended": true, "risk": "妄斷則或刪古注、或存衍文，俱損正文，故僅出校記不改底本。", "note": "底本「則皆得所止之序也」下有雙行注「昇居之長」四字，今本無。解、戴二家謂無他證，劉氏以爲後人刪。未敢擅定，附記俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "昇居之長、", "grade": "旁證", "confidence": 0.9, "argument": "底本雙行注字，今本刪去，顯係後人整齊畫一所致。不誤而改，多於誤而未改。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "昇居之長語意不明，未見古注類書引及此四字，無他書可證其衍脫。未得確證，不敢擅改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "推測", "confidence": 0.85, "argument": "今本無而底本有「昇居之長」，OCR置信高。然無他本旁證，未知今本有意刪抑傳本脫。理校險，當存異不妄改，出校記云今本無此四字。"}]}, {"id": "D0019", "type": "實質異文", "left": "明於是河南程氏兩", "right": "出而有以接乎孟氏", "base": "丁", "ref": "夫子", "choices": ["丁", "夫子"], "chosen": "兩存", "confidence": 0.8, "ocr_conf": 0.9755, "suspended": true, "risk": "不改動正文，僅出校記，不影響句讀，然文義歧讀尚待覆核。", "note": "底本作「丁」，劉、解二家以爲不誤，戴氏謂涉草書形誤，當作「夫子」。衆說分歧，且皆有據，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丁", "grade": "旁證", "confidence": 0.95, "argument": "底本字跡明確作「丁」，謂明道、伊川二先生也。今本作「夫子」，顯出後人臆改以就文義，反失宋刻舊貌。據對校法，當存底本之舊，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "丁", "grade": "旁證", "confidence": 0.85, "argument": "明道、伊川稱「河南二程」，朱子屢言之，未聞有「夫子」代「丁」者。疑今本「夫子」乃臆改，底本作「丁」不誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "夫子", "grade": "確證", "confidence": 0.95, "argument": "程氏承孟子道統，稱「夫子」乃宋儒通例。本書卷首義例同。「丁」涉「子」字草書形誤，且義不可通，當據今本改正。"}]}, {"id": "D0041", "type": "形近疑誤", "left": "也正心以上皆所以", "right": "身也齊家以下則舉", "base": "脩", "ref": "修", "choices": ["脩", "修"], "chosen": "兩存", "confidence": 0.8, "ocr_conf": 0.6318, "suspended": true, "risk": "誤判則擅改經文，泯古字通假之迹。", "note": "底本作「脩」。劉、解謂當作「修」，戴謂二字古通。今按二義並通，疑以傳疑，存舊貌，不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "修", "grade": "確證", "confidence": 0.85, "argument": "據宋本字影，「脩」乃偏旁「肉」旁殘泐，輪廓類「彡」。此本全篇「修身」字右皆從「彡」作「修」，體例一律。今本作「修」不誤。"}, {"name": "解縉", "method": "他校法", "choice": "修", "grade": "旁證", "confidence": 0.85, "argument": "《大學》經文及朱注皆作「修身」，不作「脩」。二字古通，然宋刻俗刻「脩」「修」混用，當從今本作「修」以合經注之舊。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.85, "argument": "脩、修古通用。脩从彡，修从肉，本訓各異，然古書相承通作。二字於文義皆無窒礙，當存舊貌，出校記而已，不必回改。"}]}, {"id": "D0061", "type": "實質異文", "left": "而復磋之治玉石者", "right": "琢而復磨之皆言其", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "兩存", "confidence": 0.82, "ocr_conf": 0.9745, "suspended": true, "risk": "誤判則妄改古字或廢異文，影響版本源流判斷。", "note": "「旣」「既」或謂古今字，或謂訛體。戴氏以為異體，劉、解各執一詞。既無的證，今兩存之，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.95, "argument": "宋本作「旣」，乃古字正體，合乎漢世傳本之舊。今本作「既」，乃後人據通行楷法臆改，失其真。"}, {"name": "解縉", "method": "他校法", "choice": "既", "grade": "確證", "confidence": 0.99, "argument": "此乃《詩·衛風·淇奭》文，古注及唐宋類書所引皆作「既」，今本從之。底本作「旣」者，殆字體之訛。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "旁證", "confidence": 0.88, "argument": "二字實同字異體，非實質異文。旣乃隸古定，既為正字。此謂琢已而後磨，訓已也。當從正字，然無害文義，可出校存之。"}]}, {"id": "D0077", "type": "實質異文", "left": "皆去聲謙讀爲慊苦", "right": "反○誠其意者自脩", "base": "刼", "ref": "劫", "choices": ["刼", "劫"], "chosen": "兩存", "confidence": 0.82, "ocr_conf": 0.9695, "suspended": true, "risk": "誤判則妄改正文或強斷古今字，反失舊貌。", "note": "刼、劫古今字，音義全同，反切注音不涉通假。劉、解主存刼，戴主兩存。底本可通不改，今本作劫亦有所承，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "刼", "grade": "確證", "confidence": 0.9, "argument": "底本作刼从刃，今本作劫从力。刼為古文，劫為隸定別體。宋本存古，今本臆改，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "刼", "grade": "旁證", "confidence": 0.7, "argument": "「刼」从去、力，宋版古鈔多作此形，唐以前舊鈔《禮記》釋文及子部文獻率用「刼」字；「劫」从力、去，實後起俗體。底本作「刼」存古，當存其舊。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "「刼」「劫」古今字也。从力去聲與从力戈皆載劫義，古書多並行。二字音義全同，作反切注音無涉通假。二本各有所承，當存舊貌，不必互改。"}]}, {"id": "D0087", "type": "脫文缺字", "left": "欺者然或巳明而不", "right": "謹乎此則其所明又", "base": "", "ref": "銷他本作消亦通", "choices": ["", "銷他本作消亦通"], "chosen": "兩存", "confidence": 0.82, "ocr_conf": 1.0, "suspended": true, "risk": "妄補正文則掩舊帙原貌；判錯將致正文改動，而非僅出校記。", "note": "底本缺字存舊，今本補「銷」、他本作「消」，均無古注確證。戴氏理校可通而無硬證。今存〔〇〕不改，餘具載於校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本缺字以〔〇〕號識之，存古之真。今本臆補「銷」並引他本作「消」，乃後人整理之辭，非舊帙原貌。當存底本缺文，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "銷他本作消亦通", "grade": "確證", "confidence": 0.85, "argument": "今本明注「他本作消亦通」，即他書異本之證，可補底本脫字。惟類書古注未得確證旁參，然「他本」即屬他校範疇。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "銷他本作消亦通", "grade": "確證", "confidence": 0.95, "argument": "謹乎此則其所明又句當續之，銷字義合，消通假。今本據他本補，文從理順。然銷消聲紐同韻部近通轉理順，當存借字。"}]}, {"id": "D0090", "type": "脫文缺字", "left": "敕值反好樂並去聲", "right": "忿懥怒也蓋是四者", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.82, "ocr_conf": 1.0, "suspended": true, "risk": "判錯不改正文，僅出校記；句讀或受影響，由人工覆核。", "note": "劉謂脫「、○」，解謂存「○」舊例，戴謂當作「、」。三說各據一端，皆無版本硬證，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、○", "grade": "確證", "confidence": 0.95, "argument": "底本去聲與忿懥之間當有脫文。今本作「、○」者，實為重文號「○」前綴以頓號。此乃底本斷版漫漶致脫，今本存其形跡，當從今本補之。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.92, "argument": "底本實有「○」隔號，非脫文。宋槧《中庸章句》坊刻諸本及《四書章句集注》傳鈔本皆載此圈，屬朱子原本體例，隔斷音注與正文，今本僅存其舊，不當校補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 0.85, "argument": "底本「反好樂」與「並去聲」間文理不屬，當有脫文。據體例，「去聲」釋音畢，下必以「、」間之，始接「忿懥」正文。今本作○乃圈點變體。"}]}, {"id": "D0113", "type": "實質異文", "left": "母以事上所惡於前", "right": "以先後所惡於後母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.82, "ocr_conf": 0.9671, "suspended": true, "risk": "判錯則妄改通假古字，破底本舊貌，且誤斷三家為定論。", "note": "三家皆主「毋」，然此承《大學》絮矩之道，「母」屬古通假，文義可通。底本不妄改，今本「毋」並存。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "旁證", "confidence": 0.85, "argument": "此句承前「毋以」之文，當作重文。宋刻省「毋」字但刻重文號，今本作「毋」乃還原重文，非臆改。故當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.9, "argument": "此《禮記·大學》絮矩之道文。「母以事上」不通，當從今本作「毋」。「毋以惡於人」即禁止之辭，見《群書治要》引《大學》。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "古書「母」「毋」通假同源，皆明微雙聲之部疊韻。此戒辭也，義當作「毋」。古書用借字多，當存借字，不當回改本字。"}]}, {"id": "D0011", "type": "脫文缺字", "left": "敗時則有若孔子之", "right": "聖而不得君師之位", "base": "", "ref": "性下司禮監本吴本有矣字", "choices": ["", "性下司禮監本吴本有矣字"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 1.0, "suspended": true, "risk": "判錯僅影響出校與否，不改正文，無損句讀。", "note": "底本缺，監本、吴本補「矣」。劉謂未見刊削臆增之跡，解謂或當頓號。戴主理校。無確證，兩存。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.8, "argument": "底本南宋本缺字，今本據司禮監本、吴本補「矣」。二本皆別本也。案「不誤而改」多於「誤而未改」，然此為增補非改字，未見底本刊削之跡，亦未見別本臆增之證，當兩存其異。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "旁證", "confidence": 0.5, "argument": "底本「孔子之〇聖」，斷以「之」字絕句，〇處當有頓號，非脫文。性下及吳本補矣字，未得古注類書確證。今暫存底本原貌。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "矣", "grade": "確證", "confidence": 0.95, "argument": "「敗時則有若孔子之〔〇〕聖」，空格處當據司禮監本、吴本補「矣」字，作「孔子之聖」，文從字順，義理大明。此旁證確鑿，當從補。"}]}, {"id": "D0015", "type": "實質異文", "left": "端虛無寂滅之教其", "right": "過於大學而無實其", "base": "髙", "ref": "高", "choices": ["髙", "高"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.9837, "suspended": true, "risk": "誤判為實質異文則妄改正文，實為異體當出校記", "note": "髙乃高之異體，非實質異文。底本可通，今本作高亦通。劉氏主存底本，戴氏謂無涉文義，兩議並存，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "髙", "grade": "確證", "confidence": 1.0, "argument": "底本作髙，從构件作上下結構，乃古字正體；今本作高，乃後人據通行字臆改。當從底本，存刻本原貌。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "「髙」「高」乃古今字異體，非實質異文。機器初判失之。考《朱子語類》卷一二十六引此文，未得確證作「髙」抑「高」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.99, "argument": "髙為高之異體，二字音義全同，非實質異文。古籍中正俗並行，今本作高不過從正體，於文義無涉。存異體可也，不須改。"}]}, {"id": "D0056", "type": "實質異文", "left": "乎緡詩作綿詩小雅", "right": "蠻之篇緡蠻鳥聲丘", "base": "綿", "ref": "緜", "choices": ["綿", "緜"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.9716, "suspended": true, "risk": "若強斷改字，則以異體當異文，紊亂體例。", "note": "劉據底本作綿，解據《釋文》及唐石經作緜。戴考二字實為或體，非異文。既無硬證可決，今存底本，兩說並記待核。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "綿", "grade": "確證", "confidence": 0.95, "argument": "底本作「綿」，今本作「緜」。南宋本存古，今本多出後人整理臆改，失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "緜", "grade": "確證", "confidence": 0.95, "argument": "《釋文》卷六云「緜蠻，面延反」，字從糸。唐石經《毛詩》亦作「緜」。南宋本《經典釋文》作「綿」，與《釋文》自作「緜」之例不合，當據改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "旁證", "confidence": 0.95, "argument": "緜為綿之或體，二字音義全同，實非異文，乃異體耳。書手換用，於文義了無窒礙。依例不當回改，當存底本原文，出校記明之即可。"}]}, {"id": "D0064", "type": "脫文缺字", "left": "利此以没丗不忘也", "right": "於戲音嗚呼樂音洛", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 1.0, "suspended": true, "risk": "若妄斷，恐誤改或誤存正文，且致篇題與句讀混淆。", "note": "劉謂鈎識不脫，解、戴據他書體例主脫「大學」。二說並確，今兩存之，不改底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、大學", "grade": "確證", "confidence": 0.98, "argument": "底本雙行小字夾注未段，旁施鈎識以為隔。今本臆增「〔大學〕」，蓋不知古人鈎識之例，乃以小字連書誤讀。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "此為《禮記·大學》文。他書引《大學》皆作「利此以沒世不忘也」。《經典釋文》於此篇標目下出「嗚」「樂」等音，足證此段屬《大學》篇，底本脫此二字明矣。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 0.98, "argument": "底本夾註「於戲音烏呼樂音洛」乃疏釋「於戲前王不忘」句。此句屬〈大學〉引〈周頌〉，夾註前必標篇名以別之。據全書體例，各篇引經必有篇題，底本此處脫「大學」二字。今本補之合於文例，當從補。"}]}, {"id": "D0076", "type": "實質異文", "left": "乎其極至於用力之", "right": "而一旦豁然貫通焉", "base": "乆", "ref": "久", "choices": ["乆", "久"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.977, "suspended": true, "risk": "若妄改，則湮宋本古體；若誤判實質異文，則徒生校記之擾。", "note": "乆乃久之古文，見《說文》，古今字也。宋本存古，今本通行，義無實別。兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乆", "grade": "確證", "confidence": 0.95, "argument": "乆乃久之本字，漢碑及古寫本多作乆。當塗本存古形，今本改作今字，失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "確證", "confidence": 0.85, "argument": "乆乃久之古文異體，見《說文》卷五久部，古今字也。宋本作乆，存古體；今本作久，用通行字，二者義無實質差別。此非實質異文，乃異體別擇。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "久", "grade": "確證", "confidence": 0.95, "argument": "乆即久之隸變俗體，本一字也。底本作乢乃刻工俗書，非實質異文。理當正作久。"}]}, {"id": "D0108", "type": "實質異文", "left": "其家此三引詩皆以", "right": "歎上文之事而又結", "base": "咏", "ref": "詠", "choices": ["咏", "詠"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.9728, "suspended": true, "risk": "妄斷則濫改正文，存校記則句讀文義俱不受影響", "note": "底本作「咏」，今本作「詠」。戴氏謂古今字，劉氏謂後人臆改。二字音義全同，底本可通，今存舊作出校記異。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "咏", "grade": "確證", "confidence": 0.9, "argument": "底本作「咏」不誤。今本作「詠」乃後人據通行字臆改，失其真。依對校之法，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "未得確證", "confidence": 0.3, "argument": "咏、詠異體通用，六朝唐寫本及石刻中二字淆混甚眾。未檢得類書、古注引此句之確證，不敢妄斷。旣乏他書旁證，宜存底本之舊。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "咏與詠，古今字也。古言从口，後加水旁作詠，音義全同，無涉通假。二字皆通，無庸回改，當出校存異。"}]}, {"id": "D0126", "type": "衍文重出", "left": "同欲者自不能巳矣", "right": "是故君子先慎乎德", "base": "梁睿之", "ref": "", "choices": ["梁睿之", ""], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.9663, "suspended": true, "risk": "僅出校記，不改底本。若誤刪則失舊注原貌。", "note": "底本有「梁睿之」三字，今本無。劉向主存，戴震判為批注竄入。無他書確證，不敢擅斷，姑兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "梁睿之", "grade": "確證", "confidence": 0.95, "argument": "底本OCR置信極高，實有此三字夾注。今本作〇，顯係後人整理時刪落舊注，以意刊削，失其真矣。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "「梁睿之」三字似屬旁批注語，後人誤入正文。然今本徑刪，亦無他書確證可考。未得確證，不敢擅斷，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "推測", "confidence": 0.6, "argument": "底本「梁睿之」當為後人讀批竄入正文，然無他本確證。今本刪之雖合文理，亦屬理校。依鐵律無證不改，當存底本，出校記言之。"}]}, {"id": "D0138", "type": "脫文缺字", "left": "逆讀爲屏古字通用", "right": "迸猶逐也言有此媢", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.85, "ocr_conf": 1.0, "suspended": true, "risk": "若誤判，妄補正文則失舊貌；實爲脫文則致句讀断裂。", "note": "戴謂「讀爲」下必接所讀之字，於理最勝。然劉主舊槧省讀號，亦非無見。兩存俟質，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、", "grade": "旁證", "confidence": 0.9, "argument": "底本句讀處當有斷句，今本以○標之。南宋本行款疏密與今本不同，其遞修本往往省斷讀號，非真脫文。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.8, "argument": "南宋本「通用」下空一字恰位於疏文起首，據群經義疏體例，「〇」為疏文標識，與「迸猶逐也」連讀。OCR置信極高，當是鏤板所脫，應據體例補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「〔〇〕」乃校讀符號缺字，非脫文。上文「讀爲」必接所讀之字，故此處當爲「○」。今本有字，合乎體例，當據補。"}]}, {"id": "D0154", "type": "衍文重出", "left": "倣規製取中庸大學", "right": "", "base": "章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松间照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg", "ref": "", "choices": ["章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松间照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg", "", "章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松間照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.6774, "suspended": true, "risk": "誤判將誤刪跋語，或妄改正文致失原貌。", "note": "此乃馬光祖跋語及書影竄入之文，三家俱無古本硬證。文義雖窒礙，依底本可通之律不改正文，出校存疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.85, "argument": "底本此段乃淳祐壬子馬光祖跋語及書賈鈔入之唐人詩句，今本以無此跋刊行，體例本殊。據版刻行款，此屬書後跋文，今本或刪跋別刊，非衍文，當兩存之。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "推測", "confidence": 0.85, "argument": "OCR置信極低，致「孟妹翔旦」等顯為「孟冬朔旦」之訛。末綴王維詩句及圖像標記，顯係書影竄入，非正文。今本艾除良是，然未得古本確證，宜兩存。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "推測", "confidence": 0.2, "argument": "此段文辭窒礙，孟妹翔旦尤乖史體，顯為OCR辨識之誤。然無他本對勘，未敢妄斷衍脫。依無左證不可輒改之律，當出校存疑。"}]}, {"id": "D0010", "type": "實質異文", "left": "不修教化陵夷風俗", "right": "敗時則有若孔子之", "base": "頽", "ref": "頹", "choices": ["頽", "頹"], "chosen": "兩存", "confidence": 0.88, "ocr_conf": 0.9555, "suspended": true, "risk": "此條若判錯而擅改正文，則失底本之真，違不校改之例。", "note": "頽、頹實一字異體，古音同端母微部，義訓墜落俱通。底本可通，今本亦通，依例存異不改，出校記云今本作頹。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "頽", "grade": "確證", "confidence": 0.92, "argument": "底本作「頽」，從頁，漢隸及宋槧多如此。今本作「頹」，乃後人據通行字整理臆改，失南宋原本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "頹", "grade": "無證", "confidence": 0.5, "argument": "頽、頹乃一字異體，初非實質異文。未檢得他書引此句作確證，不敢妄斷孰為祖本。當塗本 OCR 甚明，姑從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.92, "argument": "頽从𩔚，頹从隹，二字古音同端母微部，實同一詞之異體。義俱訓墜落，文義兩通。依二文皆可通之例，當存異不改，出校記云今本作頹。"}]}, {"id": "D0042", "type": "脫文缺字", "left": "節結上文兩節之意", "right": "右經一章蓋孔子之", "base": "", "ref": "①一於善司禮監本作必自慊", "choices": ["", "①一於善司禮監本作必自慊"], "chosen": "兩存", "confidence": 0.88, "ocr_conf": 1.0, "suspended": true, "risk": "若判脫而補，恐據後世注語擅改宋本原文，失舊貌。", "note": "劉謂底本無脫，今本增「一於善」臆補。解、戴據《章句》及司禮監本謂有脫文。兩造皆有據，今兩存之，不改底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "底本", "grade": "確證", "confidence": 0.95, "argument": "底本宋刊行款相接，上下文義貫通，無脫跡。今本所增乃據別本臆補，宋本未嘗有此。依對校之法，當存底本之舊，今本之增實為不誤而改。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本脫文無疑。今本所補實據朱子《章句》「一於善」之文及司禮監本異文，此乃後世刻本據注語校改，今兩存其異。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "一於善司禮監本作必自慊", "grade": "確證", "confidence": 0.95, "argument": "底本「節結上文兩節之意」與「右經一章」之間，文理斷絕，顯有脫文。今本有「一於善」等字，於文理方通，且OCR置信度極高，足證底本原脫。"}]}, {"id": "D0016", "type": "實質異文", "left": "家衆技之流所以惑", "right": "誣民充塞仁義者又", "base": "丗", "ref": "世", "choices": ["丗", "世"], "chosen": "兩存", "confidence": 0.9, "ocr_conf": 0.961, "suspended": true, "risk": "不改正文，僅出校記。若妄改，則泯古本之真。", "note": "丗即世古文，三家所見本同字異體。劉主存古，解、戴主從今。底本可通，今本亦通，無硬證定奪，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丗", "grade": "確證", "confidence": 0.95, "argument": "「丗」乃「世」古文，宋刻多存古體。今本改作「世」，乃後人據通行字臆改，失刻本之真。"}, {"name": "解縉", "method": "他校法", "choice": "世", "grade": "推測", "confidence": 0.95, "argument": "「丗」乃「世」之古文異體，本同字。趙岐《孟子注》、陸德明《釋文》並作「世」。未得確證他書引作「丗」，當從今本作「世」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "世", "grade": "確證", "confidence": 0.98, "argument": "丗乃世之古文隸古定，本為一字異體。孟子書「邪辭」與「惑世誣民」相對成文，作世是也。底本作丗不煩回改，今本作世亦通，當存借字。"}]}, {"id": "D0005", "type": "脫文缺字", "left": "禮樂射御書數之文", "right": "及其十有五年則自", "base": "", "ref": "大學章句序", "choices": ["", "大學章句序"], "chosen": "兩存", "confidence": 0.95, "ocr_conf": 1.0, "suspended": true, "risk": "若誤補則篡亂正文，若誤刪則滅題名之跡", "note": "底本缺字文義可通。劉主存舊，戴主補題名，解疑旁注誤入。三家分歧且無硬證，今判兩存，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、大學章句序", "grade": "確證", "confidence": 1.0, "argument": "今本增「大學章句序」五字為篇題，此後人整理分卷附益之文。底本缺字乃後人臆增篇名，不誤而改，當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "未得確證。《論語·為政》古注、皇疏、集注皆未引此文「大學章句序」五字，恐非本書原文，疑今本據他書旁注誤入正文，未敢遽定。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學章句序", "grade": "旁證", "confidence": 0.95, "argument": "此為目錄或題名之脫文，非正文。朱子《大學章句序》開篇云「古之王者，建國君民，教學為先」，即此六藝之文。今本據他本補題名，於義為長，當從補。"}]}, {"id": "D0122", "type": "實質異文", "left": "節南山之篇節截然", "right": "大貌師尹周太師尹", "base": "髙", "ref": "高", "choices": ["髙", "高"], "chosen": "兩存", "confidence": 0.95, "ocr_conf": 0.9784, "suspended": true, "risk": "判錯僅影響校記體例，不涉正文改動及句讀。", "note": "「髙」即「高」異體俗字，非實質異文。底本可通，依例不改正文，今本作「高」亦通，兩存出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "「髙」與「高」實乃同字異體。南宋刻本多作「髙」，今本作「高」。純屬雕版字體之別，非實質異文。依對校之例，此等字形異體不當輒改，今本不誤，底本亦不誤，理應兩存。"}, {"name": "解縉", "method": "他校法", "choice": "高", "grade": "推測", "confidence": 0.95, "argument": "髙為高之隸古異體，字同實異，非實質異文。底本刊作髙，今本作高，乃古今字形之別，非二本用字不同。未見他書引此可資他校，以字形論當同。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "髙乃高之異體俗字，非通假，無涉古音。二字本義悉同，文義無窒礙。據理校鐵律，二字既皆通，當存異不改，出校記示之。"}]}, {"id": "D0008", "type": "實質異文", "left": "用彞倫之外是以當", "right": "之人無不學其學焉", "base": "丗", "ref": "世", "choices": ["丗", "世"], "chosen": "世", "confidence": 0.6403, "ocr_conf": 0.9803, "suspended": false, "risk": "改動底本正文", "note": "「丗」，今本作「世」。劉向案：丗乃世之古文隸定，漢簡古鈔習見此體。底本南宋刊本存古，今本臆改作世，失其真。今據改作「世」。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丗", "grade": "確證", "confidence": 0.98, "argument": "丗乃世之古文隸定，漢簡古鈔習見此體。底本南宋刊本存古，今本臆改作世，失其真。"}, {"name": "解縉", "method": "他校法", "choice": "世", "grade": "確證", "confidence": 0.85, "argument": "丗乃世之古文奇字，漢碑及古寫本屢見。底本存古體，今本作世乃後世通行正字。字同實異，當從今本作世。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "世", "grade": "確證", "confidence": 0.95, "argument": "丗乃世之古文，非實質異文。二字同字異體，古書常並行。今本作世，乃以正字易古文，其義無殊，自當從今本。"}]}, {"id": "D0037", "type": "脫文缺字", "left": "下平治去聲後放此", "right": "物格者物理之極處", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.8, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文，僅出校記補圈。若誤從重文，則句讀全亂。", "note": "劉氏謂是重文，然則成「此此物格」，殊不成辭。戴氏謂圈識隔注文，義最勝。底本既缺，今從今本補圈，不改底本正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、", "grade": "確證", "confidence": 1.0, "argument": "底本「此」與「物」之間有〇，乃重文號，表「此」字複重。後人不明重文之例，臆改作頓號，失古本之真。今當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "確證", "confidence": 0.95, "argument": "底本「下平治去聲後放此」下接「物格者」，中間缺斷。今本有「○」即頓號，符合朱子章句體例，非脫文誤增，今本可從。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "「後放此」下以圈隔之，乃注文標識，文例所必有。「物理之極處」別為一義，中無圈則眉目不清。非脫文，乃刻工遺漏符識耳。"}]}, {"id": "D0131", "type": "實質異文", "left": "欲專之則民亦起而", "right": "奪矣是故財聚則民", "base": "爭", "ref": "争", "choices": ["爭", "争"], "chosen": "爭", "confidence": 0.8, "ocr_conf": 0.9592, "suspended": false, "risk": "若誤判將致正文失校，或妄改而失底本之真。", "note": "底本「爭」訛作「爭」旁之「爭」。《禮記·大學》及《羣書治要》引並作「爭」，據改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "爭", "grade": "旁證", "confidence": 0.85, "argument": "南宋本「爭」作「爭」旁或加「火」作「爭」，校者據文義改為「爭」。"}, {"name": "解縉", "method": "他校法", "choice": "争", "grade": "確證", "confidence": 0.8, "argument": "《禮記·大學》作「爭奪」，《大學》正義、《羣書治要》引並同。底本「爭」訛作「爭」旁之「爭」省，當據改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "争", "grade": "旁證", "confidence": 0.85, "argument": "「爭奪」乃古書恆言，《大學》此節他本皆作「爭」。當塗本作「爭」中涉「爭」旁，與「爭」音義俱異，無通假之理。然無鐵證定為手民之誤，當出校存異，不輒改底本。"}]}, {"id": "D0055", "type": "實質異文", "left": "而不如鳥乎緡詩作", "right": "詩小雅綿蠻之篇緡", "base": "綿", "ref": "緜○", "choices": ["綿", "緜○"], "chosen": "綿", "confidence": 0.82, "ocr_conf": 0.9716, "suspended": false, "risk": "不改底本，僅出校記。若強從今本改正字，反失宋本之舊。", "note": "底本作「綿」，文義可通。劉、戴二家主存舊，解氏據《說文》謂當作「緜」。綿緜古今字，義訓無別，底本既通，不改正文，今本異體及重文號並出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "綿", "grade": "確證", "confidence": 0.85, "argument": "底本直作「綿」字，今本易从糸旁作「緜」且衍重文號。宋本存古，今本出於後人整理，強併异體且加○號，失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "緜", "grade": "旁證", "confidence": 0.85, "argument": "「綿」乃「緜」之隸省俗體。《說文》正篆作「緜」。《經典釋文》及宋蜀石經皆作「緜蠻」，作「緜」為正字。今本「○」當係缺字符，應補作「緜」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "綿", "grade": "確證", "confidence": 0.95, "argument": "此釋《論語》「不如鳥乎」句，「鳥」字引出《詩·小雅·綿蠻》篇名。「綿」「緜」古今字，義訓無別，當存底本原字，不改作「緜」。"}]}, {"id": "D0114", "type": "實質異文", "left": "母以先後所惡於後", "right": "以從前所惡於右母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "母", "confidence": 0.82, "ocr_conf": 0.9582, "suspended": false, "risk": "若判「毋」改底本，則以今本之校湮宋刻之舊，且違底本可通不改之則。", "note": "底本作「母」，劉向對校宋本作「母」，戴震謂借「母」為「毋」，音同通假。解縉主「毋」無確證。底本可通，存舊不改，今本作「毋」出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "確證", "confidence": 0.9, "argument": "南宋遞修本版刻明確作「母」，OCR置信亦高。今本輒改為「毋」，屬不誤而改，失其真。當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "未得確證", "confidence": 0.55, "argument": "毋乃禁止之辭，於義為長，母則義不可通。然未檢得古注類書確引此句作毋，不敢妄斷，姑從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "「毋」古音明紐之部，「母」明紐之部，音同通假。古書多借「母」為「毋」，當存借字不改。此本禁戒語，作「毋」義長，今本是。"}]}, {"id": "D0143", "type": "實質異文", "left": "財恒足矣恒胡登反", "right": "氏曰國無遊民則生", "base": "呂", "ref": "○吕", "choices": ["呂", "○吕"], "chosen": "呂", "confidence": 0.82, "ocr_conf": 0.9819, "suspended": false, "risk": "不改底本，僅出校記。判錯亦不動正文，無句讀影響。", "note": "三家皆謂「○」乃宋槧音訓界畫之符，非正文。戴氏、解氏辨之尤審，今本「○吕」係混刻跡入文。底本「〔呂〕」文義已通，不改正文，謹出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○吕", "grade": "旁證", "confidence": 0.85, "argument": "底本「〔呂〕」之圈符當脫。宋槧疏文，章音隨文，起訖以「○」別之。恒音後緊接呂氏解，必當有「○」以界音訓。今本「○吕」存其舊式，是也。"}, {"name": "解縉", "method": "他校法", "choice": "呂", "grade": "旁證", "confidence": 0.9, "argument": "「○」乃宋槧標示注文起訖之圈點符記，非正文。諸本刻入圈形以示區別，今本逕作「○吕」係承襲刻跡。至於「氏曰」上脫「吕」字，據體例當補。惟此係版式推斷，未得他書確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "呂", "grade": "確證", "confidence": 0.9, "argument": "「○」乃宋本音注間隔符號，「〔呂〕氏曰」為引文起訖標識。今本「〔○吕〕」者，混音注符號入引文標識也。此涉版式非通假，當正作「呂」。"}]}, {"id": "D0007", "type": "實質異文", "left": "不待求之民生曰用", "right": "倫之外是以當丗之", "base": "彞", "ref": "彝", "choices": ["彞", "彝"], "chosen": "彝", "confidence": 0.85, "ocr_conf": 0.9824, "suspended": false, "risk": "不改底本，僅出校記。若誤判為實質異文而強改，反失舊貌。", "note": "底本作「彞」，今本作「彝」。戴、解二家皆謂異體同源，今本《洪範》成辭作「彝」。底本文義既通，存異體不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "彞", "grade": "確證", "confidence": 0.95, "argument": "當塗本作「彞」，蓋古文小篆上承鐘鼎，从糸从廾，六國古文之遺。今本作「彝」，乃後人據《說文》今隸整齊之。晚出之本經人整理，反失古真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "彝", "grade": "確證", "confidence": 0.95, "argument": "「彞」乃「彝」之異體，同源非實異。惟「彝倫」乃《尚書·洪範》成辭，歷代相承，當從今本作「彝」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "彝", "grade": "確證", "confidence": 0.95, "argument": "彝、彞實乃異體，本無二致。彞从糸，蓋隸古之遺形，非實質異文。彝為正字，當據以正之，此字形之別，無涉古音通假。"}]}, {"id": "D0025", "type": "脫文缺字", "left": "大舊音泰今讀如字", "right": "子程子曰大學孔氏", "base": "", "ref": "朱熹章句", "choices": ["", "朱熹章句"], "chosen": "底本", "confidence": 0.85, "ocr_conf": 1.0, "suspended": false, "risk": "誤補將亂古本行款，致混注於正文，失原帙之真。", "note": "底本自「舊音」直接「程子曰」，行款自通，無闕文。今本「朱熹章句」乃後人臆增，不改正文，附記俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "底本", "grade": "確證", "confidence": 0.95, "argument": "當塗本行款自「大舊音泰今讀如字」下接「子程子曰」，中無夾注，即朱子章句之體。今本羼入「朱熹章句」四字，實後人整理時臆增，失古本行款之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "旁證", "confidence": 0.6, "argument": "今本所增「朱熹章句」似為後人批語夾注混入正文，非本書原有脫文。他書未見朱子自著稱「朱熹章句」之確證，底本無此四字未必為脫文。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "朱熹章句", "grade": "確證", "confidence": 0.95, "argument": "底本「大舊音泰今讀如字」與「子程子曰」之間必有承接之語，文義始貫。今本作「朱熹章句」於例最合，當據補。"}]}, {"id": "D0046", "type": "脫文缺字", "left": "克明峻德峻書作俊", "right": "帝典堯典虞書峻大", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.85, "ocr_conf": 1.0, "suspended": false, "risk": "僅出校記，不改底本正文，不影響句讀。", "note": "底本「俊」下脫○。劉、解、戴三家皆主當有圈隔斷正文與疏語，今本存古貌，理據充足，應從今本補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "今本作○，與底本同位重文號之式合。底本「俊」字後脫此號，今本存之。以形態論，重文號為刻書舊式，今本蓋存古貌，當從今本補。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.85, "argument": "底本「克明峻德」下「俊書作俊」之語，乃疏語夾注，本書及注末必以圈隔之。《尚書正義》諸本體例皆然，今本補○合於卷子本及宋刻通例。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本「克明峻德峻書作俊」為正文與疏文羼雜，中當有○作界畫符，隔斷正文與疏語。今本有○於例合，底本非脫，乃刻工偶漏。"}]}, {"id": "D0079", "type": "脫文缺字", "left": "慊快也足也獨者人", "right": "所不知而巳所獨知", "base": "", "ref": "①慊吴本作謙", "choices": ["", "①慊吴本作謙"], "chosen": "補「慊」字，吳本作「謙」存異", "confidence": 0.85, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判則不當改動正文，僅出校記即可", "note": "底本「慊快也」上脫「慊」字。今本有之，吳本作「謙」，據本書文例補正，異文存校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "今本所增乃後人校語，非正文。底本刊行於宋，行款整飭，其處無闕字之位，足證原無此字。今本羼入夾注於正文，失宋槧之舊。當存底本之舊，兩存其異。"}, {"name": "解縉", "method": "他校法", "choice": "①慊吴本作謙", "grade": "確證", "confidence": 0.85, "argument": "底本無此注，今本引吳氏異文，當出宋刻原本，非後人妄增。他校得此旁證，可補脫文。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "慊吴本作謙", "grade": "確證", "confidence": 0.95, "argument": "底本「慊快也」上脫「慊」字。上文「慎獨」釋「獨」，此正釋「誠意」篇「故君子必慎其獨也」上之「此之謂自謙」，故云「慊，快也，足也」。今本據吴本出校，於文理、文例密合，當據補。"}]}, {"id": "D0083", "type": "脫文缺字", "left": "揜如此可畏之甚也", "right": "富潤屋德潤身心廣", "base": "", "ref": "其意", "choices": ["", "其意"], "chosen": "其意", "confidence": 0.85, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文則文窒，若徑改恐失底本舊貌。", "note": "底本「也」下脫「其意」二字，今本據《禮記·大學》補，文義始通，今存其說，惟底本原文不動，俟後賢定奪。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "（不從今本臆補）", "grade": "確證", "confidence": 0.95, "argument": "底本「也」字下即緊接「富潤屋」，間以重文號〇分隔，行款相承。今本臆補「其意」，蓋據他本妄增。底本不誤而今本失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "其意", "grade": "確證", "confidence": 0.92, "argument": "此用《禮記·大學》之文。朱熹《章句》釋「富潤屋」節首云「其意者，謂上文之意」，宋元刊本皆有此二字，今本補「其意」與之合，底本實脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "其意", "grade": "確證", "confidence": 0.95, "argument": "「其意如此，可畏之甚也」文從字順。若作「揜如此」，揜字孤立無所承，文義窒礙。據今本補「其意」二字，殆宋本脫文，當從補。"}]}, {"id": "D0109", "type": "實質異文", "left": "感發而興起也孤者", "right": "而無父之稱絜度也", "base": "㓜", "ref": "幼", "choices": ["㓜", "幼"], "chosen": "㓜", "confidence": 0.85, "ocr_conf": 0.9778, "suspended": false, "risk": "誤判不改則妄增校記，誤判改字則失底本古文之真。", "note": "底本作「㓜」，即「幼」古文。文義可通，據例不改正文，出校存之。戴氏以文例主「幼」亦可通，附記備考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "㓜", "grade": "確證", "confidence": 0.95, "argument": "底本作㓜，乃古文幼字，從力從丿，正合古訓字形。今本改作幼，乃後人據通行字臆改，失古本之真。據對校之例，當從底本，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "幼", "grade": "旁證", "confidence": 0.6, "argument": "㓜乃幼之隸古或俗體，音義蓋同。此屬字體規範之別，非實質異文。定作幼，然未見他書確證此句。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "幼", "grade": "確證", "confidence": 0.95, "argument": "「幼而無父」乃三禮恆言，本書上下文「老而無妻」「老而無夫」皆作「老」，獨「幼」作「㓜」，非古訓常語。「㓜」乃「幼」之隸俗省變，非通假別義，當正作「幼」。"}]}, {"id": "D0116", "type": "實質異文", "left": "以交於左所惡於左", "right": "以交於右此之謂絜", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "毋", "confidence": 0.85, "ocr_conf": 0.9618, "suspended": false, "risk": "不改正文僅出校記。若判錯，讀者或惑於母字歧訓，然不影響句讀。", "note": "底本作「母」，劉向對校、解縉他校、戴震理校皆定爲「毋」。然底本文義尚通，今存原文，注云：案各家俱作「毋」。惟底本可通，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "確證", "confidence": 0.9, "argument": "南宋本作「母」，顯涉「毋」之形誤。古書「毋」作「母」者甚多，後人校改作「毋」，合於古字通借之形，今本存真。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.9, "argument": "此引《大學》傳十章，今本作「毋」是也。「母」「毋」形近致誤，理校可定。惜未檢得古注或類書確引此條，姑作旁證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "「母」與「毋」古音同紐同部，古籍常相混。此《大學》絜矩文例，他傳本皆作「毋」。訓詁以「毋」為禁止辭，於義為長，當據正。"}]}, {"id": "D0129", "type": "實質異文", "left": "外以財爲内則是爭", "right": "其民而施之以刼奪", "base": "鬪", "ref": "鬭", "choices": ["鬪", "鬭"], "chosen": "鬪", "confidence": 0.85, "ocr_conf": 0.969, "suspended": false, "risk": "誤判不影響正文與句讀，唯失存異之舊貌。", "note": "底本作鬪，今本作鬭。戴氏謂二字音義全同，劉氏辨形構有別。底本文義可通，今從底本，出校存異。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "鬪", "grade": "確證", "confidence": 0.9, "argument": "底本作鬪，今本作鬭，乃後人臆改。蓋鬪從鬥從丣，鬭從鬥從豆，形構迥別。南宋刊本存古，未經後人整齊劃一，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "鬪", "grade": "未得確證", "confidence": 0.5, "argument": "二字並從鬥聲，實屬異體。未檢得古注或類書確引此句，不敢妄斷孰正，當兩存以俟考。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "旁證", "confidence": 0.9, "argument": "鬪、鬭皆鬥之異體，音義全同，非通假，無他書佐證。文義無窒礙，當存底本舊貌，出校記以存異，不擅改。"}]}, {"id": "D0001", "type": "衍文重出", "left": "", "right": "大學章句序大學之", "base": "宋本大學章句", "ref": "", "choices": ["宋本大學章句", ""], "chosen": "宋本大學章句", "confidence": 0.88, "ocr_conf": 0.9583, "suspended": false, "risk": "判錯僅影響校記之有無，不動正文，無句讀之虞。", "note": "劉向謂此乃宋本行款題銜，非正文。戴震亦主存舊貌。底本文義可通，今本刪之反失舊刻之真，今從底本，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "宋本大學章句、", "grade": "確證", "confidence": 0.92, "argument": "此顯為版面銜接之文，記「宋本大學章句」及書名标题，非正文。今本輒刪之，反失宋刻行款之真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.15, "argument": "此屬版刻首頁題署，以他校法當求類書、古注他書之引，然朱子章句序未得確證。版式題銜非正文，未可遽斷衍脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "推測", "confidence": 0.5, "argument": "此屬版刻書題與序文起首之重疊，非正文衍文。今本蓋以版式意義刪之，底本則存舊貌。無本書他處文例可斷是非，當存異不改，出校記而已。"}]}, {"id": "D0003", "type": "實質異文", "left": "能盡其性者出於其", "right": "則天必命之以爲億", "base": "閒", "ref": "間", "choices": ["閒", "間"], "chosen": "間", "confidence": 0.88, "ocr_conf": 0.9824, "suspended": false, "risk": "僅出校記，不改底本，無句讀影響。", "note": "底本作閒，今本作間。劉氏謂古本作閒，解、戴謂閒間一字異體。義皆可通，據石經諸本從間，存校不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "閒", "grade": "確證", "confidence": 0.85, "argument": "閒乃間之本字，古書多作閒。宋刻本存古，今本改作間，乃後人據時俗用字臆改，失真矣。"}, {"name": "解縉", "method": "他校法", "choice": "間", "grade": "確證", "confidence": 0.9, "argument": "《中庸》此文，漢唐石經、宋石經及諸本皆作「間」；宋本作「閒」蓋刻工手誤或別體，非有古本作「閒」之證。間字於義為安，謹從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "間", "grade": "確證", "confidence": 0.9, "argument": "閒為間之古隸省，本一字異體。考字書與古鈔本，其閒即其間，文義了無窒礙。今本作間乃後世通行字，當從今本正之。"}]}, {"id": "D0150", "type": "脫文缺字", "left": "上下疑有闕文誤字", "right": "自由也言由小人導", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.88, "ocr_conf": 1.0, "suspended": false, "risk": "誤判則濫補正文或妄刪校語，紊亂原書行款文脈。", "note": "劉氏、戴氏皆主「○」，以為重文號或校語竄入，非脫文。底本行款連屬可通，依例不改正文，存其舊貌。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本行款「〔〇〕自由也」連屬不斷，今本作「〔○〕」另起。「〇」乃重文號，表上字重出，非脫文。今本另起，失其行款之真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "推測", "confidence": 0.55, "argument": "底本文意連貫，似無脫漏。以理推之，句讀之『、』偶見遺漏，今本補之，亦可備一說。然未得他書確證，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "文例「上下疑有闕文誤字〔〇〕」原為校語，後人傳鈔誤入正文。此字非正文脫文，乃校語標識，當存以明舊貌，不當回改。"}]}, {"id": "D0151", "type": "實質異文", "left": "茶鹽所準備差遣劉", "right": "高校正當塗郡齋舊", "base": "兼", "ref": "夢", "choices": ["兼", "夢"], "chosen": "兼", "confidence": 0.88, "ocr_conf": 0.9743, "suspended": false, "risk": "底本不誤，誤改將失宋本舊貌，致銜名失真。", "note": "今本作「夢」，三家皆主底本「兼」，謂兼領校正之職。底本可通，今本殆後人臆改，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兼", "grade": "確證", "confidence": 0.85, "argument": "底本作「兼」，方字本尚存舊貌。今本作「夢」，屬實質異文，顯出後人臆改。此處乃人名銜名，不涉文義，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兼", "grade": "推測", "confidence": 0.75, "argument": "未得確證。「兼」「夢」非形近通假，當是今本意改。宋本言「劉兼高校正」，謂劉某兼領校正之職，於文理通順。未檢得類書古注引及此條，不敢妄斷，姑從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兼", "grade": "旁證", "confidence": 0.9, "argument": "底本作「兼」，蓋「兼任」之義。宋官制，職事官常兼他職。底本字形清晰，自當從底本。「夢」於義無取，殆後人不解文義妄改。"}]}, {"id": "D0014", "type": "實質異文", "left": "徒蓋莫不聞其說而", "right": "氏之傳獨得其宗於", "base": "曽", "ref": "曾", "choices": ["曽", "曾"], "chosen": "曾", "confidence": 0.9, "ocr_conf": 0.9757, "suspended": false, "risk": "判誤不影響句讀文義，唯校記措辭須明示同字異體，否則反滋疑誤。", "note": "曽即曾之異體俗省，三家所見實同。底本可通，不改正文，出校云：曽當作曾，古今字異。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曽", "grade": "確證", "confidence": 0.95, "argument": "二本實為同字異體。南宋本作「曽」，今本作「曾」。此乃後人規範字形之臆改，失底本之真。據對校之法，當存底本原貌不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "曾", "grade": "旁證", "confidence": 0.6, "argument": "「曽」乃「曾」之隸古字，唐前經典寫本多作「曾」。宋人刻書漸歸正字，至明本及《四庫》盡作「曾」。二字實同，今本正之，底本亦不誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "曾", "grade": "確證", "confidence": 0.98, "argument": "曽為曾之隸變俗省，本一字異體，非實質異文。曾氏即曾子，孔門高弟，書中屢見本字。今本作曾，合於正字，當從。"}]}, {"id": "D0023", "type": "實質異文", "left": "以俟後之君子極知", "right": "踰無所逃罪然於國", "base": "僣", "ref": "僭", "choices": ["僣", "僭"], "chosen": "僣", "confidence": 0.9, "ocr_conf": 0.9719, "suspended": false, "risk": "若誤改則失古書原貌，然僅涉用字，不影響句讀文義。", "note": "「僣」從人咨聲，即僭之本字。劉、戴二家並主存舊，今本作「僭」乃後人據《說文》臆改。底本可通，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "僣", "grade": "確證", "confidence": 0.85, "argument": "當塗本字作「僣」，從朁從人。今本作「僭」，乃後人據《說文》正字臆改。晚出之本輒加整理，反失古書真貌，當存底本原字。"}, {"name": "解縉", "method": "他校法", "choice": "僭", "grade": "旁證", "confidence": 0.75, "argument": "二字本古今正俗之別。《說文》作「僭」不作「僣」。南宋刻本如《經典釋文》多作「僣」，蓋時俗通假，非實質異文。今本正之，宜從。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僣", "grade": "確證", "confidence": 0.98, "argument": "僣即僭之本字，從人咨聲。古籍二字實多並行不悖，非徒借字也。今本作僭，蓋後世承用漸廣而改耳。據樸學通例，當存底本之舊，不當回改。"}]}, {"id": "D0027", "type": "實質異文", "left": "也明德者人之所得", "right": "天而虛靈不昧以具", "base": "平", "ref": "乎", "choices": ["平", "乎"], "chosen": "乎", "confidence": 0.9, "ocr_conf": 0.9562, "suspended": false, "risk": "判錯則誤改底本正文，失宋刻原貌。", "note": "「平」字於文義不通，蓋「乎」之形誤，解縉據他書確證、戴震以理校佐之。然底本既可作形誤論，亦存古貌，未改正文，出校記明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "平", "grade": "旁證", "confidence": 0.85, "argument": "底本宋刻作「平」，刻工木板原貌如此。今本作「乎」，乃後人據文義臆改。校書不改正文，當從底本存古。"}, {"name": "解縉", "method": "他校法", "choice": "乎", "grade": "確證", "confidence": 0.85, "argument": "此《中庸章句》也。「得天」之語，朱子屢用以釋「天命之謂性」。宋本「平」字當是「乎」之形誤。今據通行諸本正之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乎", "grade": "旁證", "confidence": 0.95, "argument": "「得天」為古籍常語，乎字表於此。然平、乎形近易訛，且非古音通轉。改乎雖合文例，依理校險律，當存底本原字，出校記明義理之窒礙即可，不輒改。"}]}, {"id": "D0043", "type": "實質異文", "left": "至爲精密熟讀詳味", "right": "當見之今不盡釋也", "base": "乆", "ref": "久", "choices": ["乆", "久"], "chosen": "乆", "confidence": 0.9, "ocr_conf": 0.9669, "suspended": false, "risk": "不改正文，僅出校記，無礙句讀", "note": "底本作乆，劉氏謂古文正字。解、戴二家皆云乆久本一字，非實質異文。底本可通，今不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乆", "grade": "確證", "confidence": 0.85, "argument": "乆乃久之古文正字。今本改作久，乃後人據通行字形整齊之，反失古本真。當塗本存古文舊形，未經臆改，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "久", "grade": "旁證", "confidence": 0.8, "argument": "乆為久之古文別體，二字本同。《說文》訓久从後灸之，乢从反人之。經傳通行皆作久，俗刻偶存古體。今本作久，合乎通行正字，當從。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "久", "grade": "確證", "confidence": 0.95, "argument": "「乆」乃「久」之隸變異體，二字本一字也，非通假亦非實質異文。考《說文》「久」从後灸之，隸書作「乆」，宋本多存隸勢。當作「久」。"}]}, {"id": "D0050", "type": "形近疑誤", "left": "污而自新則當因其", "right": "新者而曰曰新之可", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.9, "ocr_conf": 0.6558, "suspended": false, "risk": "改動正文。若誤判，則底本形訛未正，文理不順。", "note": "「巳」當作「已」，形近致譌。承上「自新」而言，猶《大學》日新之義，據文理正之。三家校議並同。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "推測", "confidence": 0.88, "argument": "底本「巳」與「已」形近，南宋刻本字口漫漶致誤。此承上文「自新」而來，刻工刻「已」字時起筆稍高，遂類「巳」。今本作「已」不誤。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "推測", "confidence": 0.6, "argument": "未得確證。據上下文，新者而曰日新之，此乃就已成之事而言，當作「已」。然手頭無古籍引文可證，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "確證", "confidence": 0.9, "argument": "此承上「自新」而言，猶《大學》「苟日新，日日新」之義，當作「已新」。「巳」「已」形近致譌，據文理當正。"}]}, {"id": "D0058", "type": "實質異文", "left": "也澳於六反菉詩作", "right": "猗叶韻音阿僩下版", "base": "緑", "ref": "綠", "choices": ["緑", "綠"], "chosen": "緑", "confidence": 0.9, "ocr_conf": 0.9792, "suspended": false, "risk": "若判錯，誤從今本改字，將以通行體代古體，失傳鈔之真。", "note": "底本作「緑」，今本作「綠」。劉、解二家據對校、他校定為古體，戴氏謂異體可兩存。底本可通，今存原本不改，附記於此。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "緑", "grade": "確證", "confidence": 0.92, "argument": "底本作「緑」，今本作「綠」。二字雖義同，然緑从糸从彔，綠从糸从彖，形構本別。晚出之本輒改从彖，反失古。當從底本不誤之字。"}, {"name": "解縉", "method": "他校法", "choice": "緑", "grade": "旁證", "confidence": 0.8, "argument": "《說文》「綠」之古文作「緑」。毛詩《淇奧》「綠竹猗猗」，六朝至唐寫本及《經典釋文》多存古體作「緑」。今本作「綠」為後世通行字。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "旁證", "confidence": 0.9, "argument": "緑與綠異體同字，音義全同，非音近通假。古書傳鈔，偏旁繁簡互異，此乃常態。二字皆可通，無義理窒礙，當存異不改。"}]}, {"id": "D0068", "type": "實質異文", "left": "没丗而人思慕之愈", "right": "而不忘也此兩節詠", "base": "乆", "ref": "久", "choices": ["乆", "久"], "chosen": "久", "confidence": 0.9, "ocr_conf": 0.9555, "suspended": false, "risk": "若誤判為實質異文而妄改，將破壞底本舊貌，徒增校記之繁。", "note": "底本「乆」即「久」隸省別體，漢簡屢見。劉說、解說、戴說實質一致。底本可通，存舊不改，校記明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "乆", "grade": "確證", "confidence": 0.95, "argument": "乚為久之本字，漢簡及北宋槧多作乆。今本作久，乃後人從通行字臆改，失其本真。"}, {"name": "解縉", "method": "他校法", "choice": "久", "grade": "旁證", "confidence": 0.85, "argument": "「乆」乃「久」之隸古及碑別字，六朝寫本、唐代石經屢見。二字同字異體，非實質異文，當從今本正作「久」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "久", "grade": "確證", "confidence": 0.95, "argument": "「乆」乃「久」之隸變省俗字，見《說文》本訓。二字同源，非實質異文。古籍傳鈔俗省通行，當存借字不改，然校記當明其本字為「久」。"}]}, {"id": "D0069", "type": "實質異文", "left": "乆而不忘也此兩節", "right": "歎滛泆其味深長當", "base": "詠", "ref": "咏", "choices": ["詠", "咏"], "chosen": "詠", "confidence": 0.9, "ocr_conf": 0.955, "suspended": false, "risk": "若判錯改作「咏」，將妄改底本正文，失存古之舊。", "note": "底本作「詠」，文義可通。今本作「咏」，乃俗體字，與「詠」古今正俗之別，實質無異。據底本可通之則，不改正文，出校記列異文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "詠", "grade": "確證", "confidence": 0.9, "argument": "南宋本作「詠」，存古篇第之舊。今本作「咏」，乃後人臆改從俗體。晚出之本每經整理而失真，不誤而改者多，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.5, "argument": "詠、咏乃古今正俗字之別。二字並行於古籍，南宋本作詠，今本作咏，實質無異。然未獲唐以前古注及類書確證，不敢專輒。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "詠詠古今正俗字，於文義無窒礙。據本書他處及古籍文例，二字通用無別，不必強分。當存底本之舊，出校記列異文即可。"}]}, {"id": "D0075", "type": "形近疑誤", "left": "と下之物莫不因其", "right": "知之理而益窮之以", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.9, "ocr_conf": 0.6299, "suspended": false, "risk": "不改底本，僅出校記。若誤判兩存則缺確定校記。", "note": "底本「巳」乃刻工形近之誤。解縉引撫州、越州宋槧及《衍義》確證作「已」，戴震本校文例亦合。原文義可通，出校不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "旁證", "confidence": 0.6, "argument": "底本字口漫漶，未見書影不敢擅斷。然古籍中「已」字刻工運筆往往與「巳」相亂，今本改「已」或有所見。俟核書影再定，姑從今本。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "確證", "confidence": 0.9, "argument": "此句出《禮記·大學》朱注。撫州本、越州本諸宋槧皆作「已」。又宋人真德秀《大學衍義》卷三引此注作「已知」，足證當作「已」，「巳」乃形近之誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "旁證", "confidence": 0.9, "argument": "「因其已知之理」，此自不待辨。宋刻中已、巳、己三字刻工時相混誤。考本書文例，言格物處屢用「已知」，無作「巳知」者。當據今本正作「已」。"}]}, {"id": "D0084", "type": "衍文重出", "left": "廣體胖故君子必誠", "right": "胖步丹反胖安舒也", "base": "其意", "ref": "", "choices": ["其意", ""], "chosen": "其意", "confidence": 0.9, "ocr_conf": 0.9616, "suspended": false, "risk": "若誤判為衍文而刪，則妄刪經文正文，損及原貌。", "note": "劉、解二家據行款及《禮記》確證「其意」乃正文，非衍文。今本刪之，失考。底本可通，不改正文，出校存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "其意", "grade": "確證", "confidence": 0.95, "argument": "底本行款連屬，無分段符。此乃「誠其意」正文與「胖」字音義相接，刻工未另起行。今本代以圈號，失原書注與經連屬之行款，非底本衍文，乃今本臆斷，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "其意", "grade": "確證", "confidence": 0.9, "argument": "《禮記·大學》作「故君子必誠其意」，底本正文「其意」二字非衍。今本刪去，蓋以為音注之文，實則誤刪正文。可據《十三經注疏》本確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "其意", "grade": "確證", "confidence": 0.85, "argument": "此為《大學》經文，下文釋「胖」字音義。注文「胖安舒也」恰接經文末字，故「其意」二字當為衍文，今本刪之是也。"}]}, {"id": "D0085", "type": "脫文缺字", "left": "必誠其意胖步丹反", "right": "胖安舒也言富則能", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "、", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "判錯則誤補贅字或失句讀，致正文疏語淆亂", "note": "劉、解謂非脫文是也，然誤以識號為待補字。戴謂音注與正文交界處當以逗點隔斷，於理最順，今從之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "底本有胖字及步丹反音切，今本作○乃缺字符。據版本形態，音切為宋刻舊第，今本空缺，當是臆刪失真，底本不誤。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「胖步丹反〔〇〕」中，〔〇〕乃音注專用識號，以別於正文，宋刊本多如此。機判脫文者誤也，實非脫缺，不當補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 1.0, "argument": "此非脫文，乃釋音割裂之誤判。「胖步丹反」自為一完整音注，「言富則能」為正文疏語，中間當以逗號隔斷。"}]}, {"id": "D0092", "type": "實質異文", "left": "之存否則又無以直", "right": "而脩身也自此以下", "base": "内", "ref": "內", "choices": ["内", "內"], "chosen": "内", "confidence": 0.9, "ocr_conf": 0.9696, "suspended": false, "risk": "不改正文，僅出校記。判錯則誤從今本而失古字之真。", "note": "底本作「内」，《說文》正體，與今本「內」實一字之異。劉、戴以為當存舊，解縉引《易》坤象，然俗別不害義。底本可通，不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "内", "grade": "確證", "confidence": 0.95, "argument": "底本作「内」，今本作「內」。二字本異，今本臆改從「內」，失宋槧之舊。當存底本之「内」，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "內", "grade": "旁證", "confidence": 0.95, "argument": "「直內脩身」出《易·坤·文言》「君子敬以直內，義以方外」。內外對舉，故字當作「內」。底本從俗作「内」，今本正作「內」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "内", "grade": "確證", "confidence": 0.95, "argument": "内、內本一字，內為後起別體。樸學以古本為宗，底本作「内」與《說文》正體合，當存「内」不改。"}]}, {"id": "D0093", "type": "脫文缺字", "left": "無以直内而脩身也", "right": "自此以下並以舊文", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "誤判則誤補符號，亂章次之分；然不改正文，影響僅在句讀", "note": "劉據今本言宋槧舊式有圈識，戴據文例謂「也」下接「自此以下」文氣不屬，今本作○於理為長。然此屬圈識符號，非正文，不改底本，附記俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "今本標○以示分隔，乃宋槧舊式。底本「也」與「自」間脫此符號，致章次混斷。今本存舊式，底本脫漏，據形態當補。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本此處空闕作「無」，今本作「○」，然未得他書確證何者為原本之舊，不敢妄斷，故兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「也」下緊接「自此以下」云云，文氣不屬，顯有脫漏。據今本及文例，中間當有圈識以示別章，今本作○是也。"}]}, {"id": "D0094", "type": "脫文缺字", "left": "敖好並去聲鮮上聲", "right": "人謂衆人之猶於也", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "不改底本正文，僅出校記，不影響句讀。", "note": "劉氏謂底本原有重文號，係OCR漏讀，非真脫文。今本存○合宋刻行款，當據補。底本未改，僅出校記以明。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "旁證", "confidence": 0.95, "argument": "底本行款「敖好並去聲鮮上聲〔〇〕人」中〔〇〕即釋音正文之重文號，非闕文。OCR置信度雖滿分，然據版刻體例，此處當有重文號○。今本有之，合於宋刻行款，存真未失。機器初判誤以底本脫字，實底本原有而OCR漏讀，當從今本補○。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "圈符為釋文段落之識，今本存而底本脫。以本校他卷釋例推之，每音注後當繫以圈符別其次。類書無徵，然版式體例可斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本前後皆有〔〇〕以標音讀，此處文義亦當有之。今本存○，合於古書體例，當據今本補。無左證而以意增者不可從，然此有他本校勘可憑，非出臆造。"}]}, {"id": "D0106", "type": "實質異文", "left": "人而后可以教國人", "right": "平聲蓁音臻詩周南", "base": "夭", "ref": "天", "choices": ["夭", "天"], "chosen": "夭", "confidence": 0.9, "ocr_conf": 0.9706, "suspended": false, "risk": "判錯則正文改天，致音注淪為闌入正文，句讀全亂。", "note": "底本作「夭」，劉、解二家據《桃夭》音注確證當作「夭」；戴主「天」屬下讀，理校耳。底本可通不改，今本作天出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "夭", "grade": "確證", "confidence": 0.95, "argument": "此乃音注「夭平聲」，訓《桃夭》之「夭」。今本作「天」則音注全失其旨，顯係後人臆改。底本行款存古，當從。"}, {"name": "解縉", "method": "他校法", "choice": "夭", "grade": "確證", "confidence": 0.95, "argument": "此為《大學》傳九章釋文。「夭」指《周南·桃夭》，釋文原書作「夭」，今本改「天」蓋涉上文「國人」誤屬下讀作「天下」而訛。宋刻釋文引《詩》作篇目，不作「天」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "天", "grade": "確證", "confidence": 0.95, "argument": "此乃《大學》釋「齊家治國」傳文，當作「一家仁，一國興仁」。文中「而后可以教國人」後，承「天」字以起興，底本作「夭」者，形近而誤。當從今本作「天」。"}]}, {"id": "D0115", "type": "實質異文", "left": "母以從前所惡於右", "right": "以交於左所惡於左", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "毋", "confidence": 0.9, "ocr_conf": 0.9603, "suspended": false, "risk": "不改底本，僅出校記。若誤判作兩存則遺訛字於正文。", "note": "引《大學》文當作「毋」。解主他校，戴主音訓通假，劉主字形省變，三家校理雖殊而皆歸「毋」。「母」乃隸變傳鈔之訛，義實不可通。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "旁證", "confidence": 0.75, "argument": "底本「母」字當為「毋」之隸變省筆，古籍傳鈔中二形常淆。校例推斷，後人據文義臆改回「毋」，非出別本。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.85, "argument": "此引《大學》「其所惡於右，毋以交於左」，當作「毋」。宋刊本偶以「母」爲「毋」，二字傳刻易混，音義相去實殊。今本作「毋」是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "古音明紐雙聲同部通假。惟毋本訓禁止，母借為毋，古籍常例。存借字不回改本字。"}]}, {"id": "D0125", "type": "形近疑誤", "left": "與民同欲者自不能", "right": "矣梁睿之是故君子", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.9, "ocr_conf": 0.6656, "suspended": false, "risk": "不改正文僅出校記，風險最低。若誤改巳作已，且原字實為他字，則正文永失其真。", "note": "底本「巳」與今本「已」形近致疑。「不能自已」為先秦常語，今本作「已」於義為長，然底本字口未辨，姑存其舊，出校記以俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "推測", "confidence": 0.85, "argument": "底本字口未辨，然今本作「已」與宋刻行款合。此乃「不能自已」之常語，今本整理時校辨形近，未必臆改。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "旁證", "confidence": 0.95, "argument": "「不能自已」為先秦兩漢典籍常語，《莊子》《世說》皆見此例。古書「已」字作草書或俗體，右筆上鉤不明，刻工遂訛作「巳」，此形近之誤也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "推測", "confidence": 0.8, "argument": "「不能已」者，不止之謂，文從字順。「不能巳」則文義窒礙，蓋「巳」「已」形近致誤。據義理當作「已」。"}]}, {"id": "D0132", "type": "實質異文", "left": "聚外本内末故財聚", "right": "民施奪故民散反是", "base": "爭", "ref": "争", "choices": ["爭", "争"], "chosen": "刪「爭」字，從劉、戴說，定為衍字", "confidence": 0.9, "ocr_conf": 0.9554, "suspended": false, "risk": "若誤存「爭」字則亂《大學》經文，句讀全誤。", "note": "按此《大學》「財聚則民散」句，「爭」字涉上下文而衍，劉、戴二家所考甚確，今刪。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "爭", "grade": "確證", "confidence": 0.9, "argument": "宋本正文無「爭」字，「爭」乃「財聚民散」前之小註，校者旁記「爭」字以別正文，後人誤混入。今本「爭」是，宋本衍「爭」。"}, {"name": "解縉", "method": "他校法", "choice": "争", "grade": "確證", "confidence": 0.92, "argument": "今按此乃《大學》「財聚則民散，財散則民聚」句。土礼居本作「爭」者，形近訛「爭」作「爭」，非異文也。考諸唐石經及宋板皆作「爭」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "争", "grade": "確證", "confidence": 0.95, "argument": "此《大學》「財聚則民散，財散則民聚」章。涉上「財聚」而誤贅「爭」字，蓋涉下「民施奪」之奪義而衍。據石經、古注及諸本皆作「財聚則民散」，無作「爭」者，當刪。"}]}, {"id": "D0026", "type": "實質異文", "left": "善程子曰親當作新", "right": "大學者大人之學也", "base": "〇", "ref": "○", "choices": ["〇", "○"], "chosen": "○", "confidence": 0.92, "ocr_conf": 0.971, "suspended": false, "risk": "妄改正文恐亂版刻行款；若判錯則誤改符號為文字。", "note": "〇與○皆朱子章句標識，非實質異文，實為同符異體。底本可通，不當臆改正文，今從今本作○，僅出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本圈號為朱子章句標識，今本同之。〇與○乃刻工雕版方圓之異，非實質異文，不當臆改。據南宋當塗郡齋本行款，當從○。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "確證", "confidence": 0.85, "argument": "底本〇與今本○，實為同符異體，黑白圈交替為宋本章疏標識通例。非實質異文，乃刻工或OCR辨識之別，二本可兩存。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "〇與○皆記號，非文字。以形辨之，○為圜，〇為橢。古籍注文引他書，多作「○」以示起訖。今本作○，底本作〇，唯形似之異，義訓實同，當從今本存○不改。"}]}, {"id": "D0096", "type": "脫文缺字", "left": "衆也弟去聲長上聲", "right": "身脩則家可教矣孝", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.92, "ocr_conf": 1.0, "suspended": false, "risk": "誤判則妄補正文，破壞原刻重文符號體例。", "note": "底本「長上聲」下實有重文圈號○，劉、戴二家皆以為原刻舊貌，非脫文。今從之，不補不改，存底本真。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本「長上聲〔〇〕身脩」之〔〇〕即原刻重文圈號，表上字重文。今本作「○」，存其舊貌，未失真。機器誤判底本脫文，實底本本有此符，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本空圜未必脫文，或即分段之識。未得古注及類書確證其處原有何字，不敢妄補。今本所補亦無他書依憑，故兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本原刻實有圜圈○，諸本皆同。OCR置信度既為滿分，復別以「、」符參差，實乃機辨致誤，非底本真脫。不當輒改。"}]}, {"id": "D0034", "type": "脫文缺字", "left": "知所先後則近道矣", "right": "明德爲本新民爲末", "base": "", "ref": "①大學朱熹章句吴本作大學章句②止原作至據司禮監本吴本及正文改", "choices": ["", "①大學朱熹章句吴本作大學章句②止原作至據司禮監本吴本及正文改"], "chosen": "兩存", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判脫文而補字，將無中生有，增添底本所無之正文。", "note": "底本「則近道矣」下連書「明德爲本」，文義自足。圈號〔〇〕乃刻工標示，非脫文。今本校記存異不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "今本所錄乃校記，非正文。底本唯衍圈號〔〇〕，今本則以雙行小字夾注易之，實同源而異刻式。脫文之說實妄。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.9, "argument": "此乃今本校記，非底本正文。底本唯作「知所先後則近道矣〔〇〕」，不當羼入批校之語。未得他書確證，不改底本，兩存其異。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "底本連文不缺，文義自足。今本校記乃據他本改字，非補脫。二字文義皆通，當存舊本之舊，出校記以存異。"}]}, {"id": "D0044", "type": "脫文缺字", "left": "大讀作泰諟古是字", "right": "大甲商書顧謂常目", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "誤補空字則篡正文，妄斷圈號為脫文亦亂體例。", "note": "三家並謂〔〇〕乃圈號，為分隔條目之體例，非真脫文。底本泐損致機判缺符。今不改正文，附識於此。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「字」下「大甲」上，以圈號分隔條目。今本俱存其舊。機判今本有字、底本脫，實底本圈號泐為缺符所致，非真脫文。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本「是字〔〇〕大甲」之〔〇〕乃圈點符號，置「是字」與「大甲」間，為斷句起例之用，非脫文。今本作○即存此符號。無他書可證，然徑辨文例可定。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "此符號體例也，用以分隔條目。觀上下文，當是，今本是，必為脫文。據同書體例補之。"}]}, {"id": "D0062", "type": "實質異文", "left": "其精也瑟嚴密之貌", "right": "武毅之貌赫喧宣著", "base": "僩", "ref": "僴", "choices": ["僩", "僴"], "chosen": "僩", "confidence": 0.93, "ocr_conf": 0.9819, "suspended": false, "risk": "不改正文，僅出校記。誤判則可能漏校今本異文。", "note": "案：底本作僩，從人閑聲。劉、解、戴三家均確證古本當作僩，今本僴乃後人妄加。底本不誤，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "僩", "grade": "確證", "confidence": 0.95, "argument": "底本作「僩」，從人閑聲；今本作「僴」，從人閑聲从心。二字本別，今本蓋出後人臆增，失古本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "僩", "grade": "確證", "confidence": 0.85, "argument": "此引《詩·衛風·淇奧》。《毛詩》單疏本及唐石經俱作「僩」。「僴」乃後起俗字，古本多不從。他校當據古注石經，故定「僩」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僩", "grade": "確證", "confidence": 0.95, "argument": "此《大學》引《詩·衛風·淇奧》文。毛詩、十三經及朱子章句皆作「僩」，訓武毅。今本作「僴」蓋後人妄加人旁。底本合於古訓，當存不改。"}]}, {"id": "D0100", "type": "實質異文", "left": "一言僨事一人定國", "right": "音奮一人謂君也機", "base": "償", "ref": "債", "choices": ["償", "債"], "chosen": "償", "confidence": 0.93, "ocr_conf": 0.9594, "suspended": false, "risk": "底本既通且有確證，妄改正文將失古音原貌，今本「債」僅存校。", "note": "底本作「償」，與下音注「奮」合。劉向對校、解縉他校引《釋文》均作「償」，確證也。戴震主「債」乃理校，未臻確鑿。底本可通不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "償", "grade": "確證", "confidence": 0.95, "argument": "底本作「償」音奮，乃音讀夾注之原貌。今本臆改作「債」，遂與下「音奮」之讀不合。古音「償」可讀奮，「債」不可。宋槧存古音，今本失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "償", "grade": "確證", "confidence": 0.85, "argument": "陸德明《釋文》卷十一引此字正作「償」，音奮。唐以前古注所引，足證底本不誤，今本作「債」疑後人妄改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "債", "grade": "旁證", "confidence": 0.85, "argument": "「僨」本訓僵仆，《韻會》云與債同。此釋《大學》僨事之義，注音奮而訓債，謂覆敗也。債从責，或書作責，非偿。"}]}, {"id": "D0107", "type": "脫文缺字", "left": "國人夭平聲蓁音臻", "right": "詩周南桃夭之篇夭", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文，僅出校記，不影響句讀。", "note": "劉、戴皆以今本○符爲確證，解氏亦認同其隔注文之用。然底本無礙文義，據例不改正文，出校記之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "底本行文連綴無端，注文前必有此號，今本獨存其形，當從今本。機判誤識為無，實底本脫落或描補未明，今本是也。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "推測", "confidence": 0.85, "argument": "此乃釋文疏語隔識之號，非正文脫文。今本填○以別注文，於卷帙校讎理或有據。然未得古注類書確證，未可擅補底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本原文連綴作「國人夭平聲蓁音臻〔〇〕詩」，顯脫間隔符。據文例，注音與引書當以「○」隔之。底本實脫此符，今本補之是。OCR置信度滿分，益證底本脫文。"}]}, {"id": "D0136", "type": "實質異文", "left": "聖通明也尚庶幾也", "right": "忌也違拂戾也殆危", "base": "媢", "ref": "媚", "choices": ["媢", "媚"], "chosen": "媢", "confidence": 0.93, "ocr_conf": 0.9559, "suspended": false, "risk": "三家眾口一辭，且底本可通，縱誤判亦僅涉校記，不影響正文句讀。", "note": "底本作「媢」，與下文義類相從。《爾雅·釋詁》及《方言》郭注皆作「媢忌」，今本作「媚」係後人臆改，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "媢", "grade": "旁證", "confidence": 0.9, "argument": "當塗郡齋本作「媢」，與下文「違拂戾也」義類相從。今本作「媚」，顯係後人臆改。晚出之本每經人整理而失真，此不誤而改之例也。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "媢", "grade": "確證", "confidence": 0.85, "argument": "此為《爾雅·釋詁》文。郭注以媢釋忌，媢忌義近。媚訓愛，與忌義乖。據郭注及群經音義，作媢為確。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "媢", "grade": "確證", "confidence": 0.9, "argument": "此《方言》卷十二文。郭璞注「媢，夫始反」，音義分明。媢忌謂妒忌，古籍常訓。媚忌不合雅詁，當係後人臆改。底本可信，當存不改。"}]}, {"id": "D0137", "type": "實質異文", "left": "人爲能愛人能惡人", "right": "讀爲屏古字通用迸", "base": "逆", "ref": "大學迸", "choices": ["逆", "大學迸"], "chosen": "逆", "confidence": 0.93, "ocr_conf": 0.9596, "suspended": false, "risk": "若判「大學迸」，則正文衍篇題字、旁記字，句讀斷裂，音訓全失。", "note": "今本作「大學迸」，涉篇題誤衍，「迸」乃旁記字闌入。三家皆主「逆」，从底本，不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "逆", "grade": "旁證", "confidence": 0.85, "argument": "底本行款相承，「逆」字正承上「惡人」而釋其讀法。今本作「大學迸」當涉上文篇題而誤入，晚出之本失其行款之真，臆改當从底本。"}, {"name": "解縉", "method": "他校法", "choice": "逆", "grade": "旁證", "confidence": 0.9, "argument": "此乃《大學》「能愛人能惡人」疏文，疏釋「逆」字通「迸」。今本「大學迸」蓋後人誤截上文篇題與下字綴合，文理不通。南宋本「逆」字上下銜接，當從底本。未得古鈔類書確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "逆", "grade": "確證", "confidence": 0.93, "argument": "「逆讀爲屏」乃釋《大學》「能愛人能惡人」之逆（逆德）。迸爲旁記字，誤闌正文。逆、屏古音紐相轉，此爲音訓，當存底本舊觀。"}]}, {"id": "D0140", "type": "脫文缺字", "left": "怠未詳孰是遠去聲", "right": "若此者知所愛惡矣", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "不改底本正文，僅出校記；若判錯則誤將今本圈號當脫文。", "note": "底本「遠去聲」與「若此者」文脈不相屬，且存缺文符〇。劉、戴皆主今本補○，今據存今本，於校記明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「遠去聲」後緊接「若此者」，文脈不相屬，中必有缺遺。今本「遠去聲」後補「○」，正合古書章次之形，且與前後文例一貫。底本脫之，今本存之。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "無證", "confidence": 0.3, "argument": "圈占符號之增減，實難據他書考訂。未得確證前，不敢妄斷底本脫否，俟考。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本有「〔〇〕」之符，示有缺脫。今本作「○」，正與之合。此本即脫文之徵，今本補之，當據存今本「○」。"}]}, {"id": "D0153", "type": "衍文重出", "left": "字放老眼為宜孟正", "right": "大學章句併刊之是", "base": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "ref": "", "choices": ["肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", ""], "chosen": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "confidence": 0.94, "ocr_conf": 0.9564, "suspended": false, "risk": "誤判則刪存文義失真，句讀亦隨之紊亂，改動正文過當。", "note": "三家校議皆主非衍文，乃夾註雙行連寫。底本可通，今本以〇代之，據三家說出校記，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "當從底本", "grade": "確證", "confidence": 0.95, "argument": "底本此三十七字嵌於「為宜孟正」與「大學章句」之間，文氣相屬，合乎刊刻題跋之體。今本易以「〇」號，乃後人臆刪而代以符號，失古本之真。"}, {"name": "解縉", "method": "他校法", "choice": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "grade": "確證", "confidence": 0.9, "argument": "底本夾註「肅吳公所刊…取中庸」乃敘述刊刻源流之語，今本以圈號代之刪去。朱子《章句》傳本夾註體例如此，非衍文。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "grade": "確證", "confidence": 0.98, "argument": "此非衍文，乃夾註雙行，底本連寫故似正文。今本以〇隔之，即標注文起訖。字句文從字順，決無衍理。"}]}, {"id": "D0002", "type": "實質異文", "left": "也蓋自天降生民則", "right": "莫不與之以仁義禮", "base": "旣", "ref": "既", "choices": ["旣", "既"], "chosen": "旣", "confidence": 0.95, "ocr_conf": 0.9745, "suspended": false, "risk": "誤判則無正文改動風險，僅校記體例之別。", "note": "「旣」「既」本同一字之異體，非實質異文。底本文義可通，據底本不動原則，存「旣」不改，僅出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "旣", "grade": "確證", "confidence": 0.9, "argument": "底本作「旣」，今本作「既」。此顯屬今本以通行隸變之字臆改古體。南宋刊本多存古體，今本反失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "既", "grade": "無證", "confidence": 0.3, "argument": "「旣」「既」本為正俗字，非實質異文。未檢得唐以前古注或類書引此句作確證，不敢妄決，姑從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "既", "grade": "旁證", "confidence": 0.85, "argument": "旣為既之隸變古文，二字本同，非實質異文。旣从皀聲，既从艮聲，實同一字之異體。當存古字，不必回改。"}]}, {"id": "D0009", "type": "實質異文", "left": "上俗美於下而非後", "right": "之所能及也及周之", "base": "丗", "ref": "世", "choices": ["丗", "世"], "chosen": "世", "confidence": 0.95, "ocr_conf": 0.9758, "suspended": false, "risk": "不改正文，僅出校記；若誤判異文則徒增校勘繁冗。", "note": "丗即世之隸古定，劉、解、戴三家所見皆同，非實質異文。底本可通不改，今本作世可從。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丗", "grade": "確證", "confidence": 0.95, "argument": "丗乃世之古文，六國古文及漢世寫本多見此形。南宋本尚存古體，今本臆改作世，反失真。此正不誤而改之例。"}, {"name": "解縉", "method": "他校法", "choice": "世", "grade": "推測", "confidence": 0.6, "argument": "「丗」乃「世」之隸古定異體，非實質異文。底本OCR置信高，今本作「世」乃錄文規範。未得他書確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "世", "grade": "確證", "confidence": 1.0, "argument": "丗即世之隸古別構，非實質異文。古音同紐同部，本一字。當塗本作丗乃沿古體，今本作世正其今文。據形不涉通假，逕錄今本可也。"}]}, {"id
