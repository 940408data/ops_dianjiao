const DATA = {"work": "大學章句（glm-5.2 合議）", "run_id": "20260815T152723", "cases": [{"id": "D0015", "type": "脫文缺字", "left": "之以復其初也新者", "right": "革其舊之謂也言旣", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "若誤斷重文號，則妄增正文二字，破壞舊本行款。", "note": "劉謂〇爲重文號，今本臆補；解、戴謂當作「大學」。各有據，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "", "grade": "確證", "confidence": 1.0, "argument": "底本缺字處有〔〇〕，乃重文號也，表前文「新」字當重讀。今本臆補「大學」二字，蓋後人不明符例而誤增，實破壞舊本行款，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "、大學", "grade": "確證", "confidence": 0.95, "argument": "此段乃朱子《大學章句》釋「在新民」之文。宋本「新者」上脫「、大學」三字，今本據文義補之，是也。文理本自通貫，非後人妄增。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "本書他卷及《朱子語類》論此章皆作「大學」二字。今文云「大學之以復其初也」，文從字順，與下「新者革其舊之謂也」相偶。底本脫此二字，今本據他本校補，確然無疑。"}]}, {"id": "D0053", "type": "脫文缺字", "left": "揜如此可畏之甚也", "right": "富潤屋德潤身心廣", "base": "", "ref": "其意", "choices": ["", "其意"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "不改正文，僅出校記；若妄斷則或脫古本之舊。", "note": "劉主底本無缺，解、戴主據他書本校補。兩造各有確證而相執不下，今兩存之，俟後賢定奪。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "揜如此可畏之甚也", "grade": "確證", "confidence": 1.0, "argument": "底本據形驗字，提點符〇前後文理相屬，實無「其意」二字。今本臆增，失其舊矣。當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "其意", "grade": "確證", "confidence": 0.95, "argument": "《潛夫論》此文見引於唐宋類書及古注，均作「其意揜如此，可畏之甚也」。「其意」二字銜接上下文理，底本顯脫。今本據他書補之，當是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "其意", "grade": "確證", "confidence": 0.95, "argument": "此引《大學》「富潤屋」章。朱子注曰「其意謂善惡之驗如此」，此其上下文同書之確證。底本脫二字，今本是，當補。"}]}, {"id": "D0055", "type": "脫文缺字", "left": "必誠其意胖步丹反", "right": "胖安舒也言富則能", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "不影響句讀。若強判為字或圈，皆改動正文，恐失古例。", "note": "劉、解主脫字，戴主圈標目。二說皆通而例證互異，不敢強斷。今存底本之〇，附錄二說以俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "底本「反」與「胖」間實有墨團重文號〇，OCR未識。據行款，「反〇」即「反反」，上為反切之反，下為訓詁之反，今本妄刪〇，致脫一字，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "「胖步丹反」乃《釋文》音切。按音理，「步丹反」所得正是「○」字，故「胖」下脫「○」字無疑。今本補「○」是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "此非脫文。古書音注例以圜圈〇標目別之，下乃音切與訓。今本標〇，正復古例。當存。"}]}, {"id": "D0075", "type": "脫文缺字", "left": "國人夭平聲蓁音臻", "right": "詩周南桃夭之篇夭", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則脫文未補或妄補符號，影響音注句讀。", "note": "劉謂重文號，解謂省字符，戴謂釋音標目符。三說互歧而皆無確鑿硬證，未可偏從，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "底本音注「國人夭平聲蓁音臻〔〇〕詩周南桃夭之篇夭」中，〔〇〕實為重文號「=」，表「夭」字重文。今本奪此重文號，致脫一字。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「夭」字前空一格，顯係重文省字符號「○」之位，今本補「○」是也。考宋刻凡重字多用「〇」代，此校非他書之證，乃版刻體例之內證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "此釋音體例也。上文「平聲」「音臻」乃釋「夭」「蓁」二字之音，其前必有符號以標目。同卷釋音之例皆先列○或、以示某字，後繫音訓。此處闕一符號，據全書體例當補，非以意改也。"}]}, {"id": "D0091", "type": "脫文缺字", "left": "亦悖而出悖布内反", "right": "悖逆也此以言之出", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "判錯將誤改正文符號，並影響此處句讀。", "note": "劉氏以為重文號，解氏以為圈符隔正文，戴氏以為句讀。三說並峙，皆無硬證，今兩存之，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、○", "grade": "確證", "confidence": 0.95, "argument": "底本「亦悖而出悖布内反〔〇〕」後衍一〔〇〕，乃重文號，指前「悖」字。今本僅作○，奪其重文。底本存古，今本脫漏。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "據文例，此處夾註「悖布内反」後當以圈隔正文，與前後諸注同。底本缺此圈符，今本有之，當據補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 0.95, "argument": "此處音義在「悖而出」與「悖逆也」之間，斷以句讀則文理始通。今本補「、」正合古書音義附訓之例，當從。"}]}, {"id": "D0101", "type": "脫文缺字", "left": "許六反乗斂並去聲", "right": "孟獻子魯之賢大夫", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "判誤則妄增符號或字於正文，破壞底本原貌，影響句讀與注疏行款。", "note": "劉主脫、解主未脫、戴主闕文，三說並行，皆無版本硬證。底本可通，姑存舊貌。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本注疏行款相承，釋文末每以陰文〇為界隔。底本乘斂並去聲下當有〇，接孟獻子，今本存其形跡，底本實脫此符，當據今本補。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本此處實作「〇」，非脫文。今本作「○」乃同義符號替換。古籍評點圈點，方圓之別因版本而異，然此處底本未脫，機器初判誤也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「乗斂並去聲〔〇〕」中〔〇〕即闕文符號，據上下文例當補注音字。今本作○即存其闕，不改字以意補。"}]}, {"id": "D0013", "type": "實質異文", "left": "也明德者人之所得", "right": "天而虛靈不昧以具", "base": "平", "ref": "乎", "choices": ["平", "乎"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.9562, "suspended": true, "risk": "若強斷改作「乎」，恐失宋刻舊貌，反成臆改。", "note": "底本作「平」，今本作「乎」。劉主存舊，解、戴以文理疑當作「乎」。各執一端，且無鐵證，今兩存之，不改底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "平", "grade": "旁證", "confidence": 0.85, "argument": "底本宋刻作「平」，今本作「乎」，顯屬後人臆改。宋槧行款避諱存古，後出之本每經人整理改易失真。不改一字，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "乎", "grade": "推測", "confidence": 0.75, "argument": "「得天乎」設問辭順，文理可通。「平」於義未安，疑刊刻訛字。然未檢得古注類書他引確證，不敢妄斷，姑從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "乎", "grade": "旁證", "confidence": 0.9, "argument": "「得天乎」與「天乎」古書恆言。作「平」則義贅不通。然無鐵證，姑存異文，不徑改底本。"}]}, {"id": "D0033", "type": "實質異文", "left": "則當因其巳新者而", "right": "新之可略有閒斷也", "base": "曰曰", "ref": "日日新之又日", "choices": ["曰曰", "日日新之又日"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.6228, "suspended": true, "risk": "僅出校記不改正文，免臆補五字致妄改古刊之失", "note": "底本「曰曰」存舊貌。劉主重文號之殘，解、戴主「日日」形譌。今本增五字無確據。義可兩通，未敢強斷，俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曰曰", "grade": "推測", "confidence": 0.85, "argument": "底本二字重文作疊字符號，本校 OCR 識作「曰曰」，蓋原刊重文號之殘泐也。今本臆補「日日新之又日」五字，顯係後人據《大學》文理妄增，失古刊舊貌，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "日日", "grade": "推測", "confidence": 0.75, "argument": "底本「曰曰」當為「日日」之形訛，蓋涉上下文「新」字而誤。古書「日日新」為恒語，源出《大學》。然未檢得本書以外古注或類書確引此句，未得確證，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "日日", "grade": "旁證", "confidence": 0.85, "argument": "「日日新之」與「又日新」本《大學》典。底本「曰曰」與「日日」形近易譌，文義窒礙。今本「又日」屬後人臆增，當刪。存借字「日日」。"}]}, {"id": "D0067", "type": "脫文缺字", "left": "而后嫁者也中去聲", "right": "此引書而釋之又明", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則妄補正文「、○」或誤刪圈號，致改動原刊行款。", "note": "底本「〇」字與今本同否，抑當補「、」，劉主對校補之，戴主即舊圈號，解無他本確證。無硬據，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、○", "grade": "確證", "confidence": 0.95, "argument": "底本「者也」下接「中」字，行款文氣俱不相屬，顯有脫漏。今本補「、○」，適可釋底本之礙，與下文「〇」隔斷之例亦合。當從今本補之。"}, {"name": "解縉", "method": "他校法", "choice": "、○", "grade": "旁證", "confidence": 0.85, "argument": "底本「中去聲」下「〇」前當脫「、」字。依疏體例，既云「此引書而釋之」，音注與釋文間當以「、」隔之，未得確證別本他校，然體例可斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本「中去聲」後原有圈號，今本有「〇」字。據文例，圈號為分隔標記，底本有圈，今本有「〇」，二者相合。今本「〇」即底本之圈號。"}]}, {"id": "D0103", "type": "實質異文", "left": "茶鹽所準備差遣劉", "right": "高校正當塗郡齋舊", "base": "兼", "ref": "夢", "choices": ["兼", "夢"], "chosen": "兩存", "confidence": 0.55, "ocr_conf": 0.9743, "suspended": true, "risk": "妄斷則改動正文；兩存僅出校記，不影響句讀，待新證覆核。", "note": "底本作「兼」，今本作「夢」。二字形音絕遠，非形訛通假。劉主兼屬校官銜，然無他本確證。存異俟考，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兼", "grade": "確證", "confidence": 0.9, "argument": "底本作「兼」，與「高校正」銜接，乃宋人校勘官銜。今本作「夢」非形近通假，顯為後人臆改，違校書不改字之鐵律。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本作「兼」，今本作「夢」，二字無形音通假之理，疑涉校記符號或後人增字。遍檢類書古注，未得他書確證。不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.5, "argument": "兼、夢二字形音皆絕遠，非形訛，非通假。底本OCR置信頗高，然「高校正」上所綴人名，無他本或他卷左證可資決斷。既無確證，理當存異，出校記而已，未可妄改。"}]}, {"id": "D0096", "type": "脫文缺字", "left": "逆讀爲屏古字通用", "right": "迸猶逐也言有此媢", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則或漏補脫字，或誤增衍文，影響訓詁釋讀。", "note": "劉謂重文號、解謂脫文圈、戴謂脫「迸」字，三說並存。底本墨釋文義兩可，姑存闕。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本作「〔○〕」乃以重文號代「逆」字，今本作「〔○〕」亦然。蓋「通用」下接「迸」字，文氣直貫，不煩重字，此符實為衍入之墨釘。今本從之，失於省察，反失古本原貌。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.7, "argument": "「古字通用」後當有闕文圈以示脫。南宋刻本「迸」字前標○示脫文，合於體例。未得確切他書引證比對。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "文曰「古字通用」，其下必有一字，明所通之字。「〔○〕迸」連文，猶云「通作迸」。此脫文標記也，當據補，以足辭氣。"}]}, {"id": "D0098", "type": "脫文缺字", "left": "怠未詳孰是遠去聲", "right": "若此者知所愛惡矣", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.6, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則誤改底本或漏出校記，致正文與音注句讀混淆。", "note": "三家皆主○，然劉謂底本未脫，解、戴謂底本實缺、當據今本補。存者缺者兩歧，無硬證，兩存。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本未脫文，乃今本釋文符號重排致誤。底本正文與音注連書，○為注文間隔符；今本析離排印，遂奪此符。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.8, "argument": "底本「〔〇〕」實為空圈占位，今本作「、」亦未得其正。據書例，經文止處當作「○」以隔篇章，此本書體例，非脫文也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本前後皆以○隔注文，文例鑿然。〔〇〕示原刊墨釘或缺字，今本補○符其例，於文義方通，當從今本補。"}]}, {"id": "D0079", "type": "實質異文", "left": "母以事上所惡於前", "right": "以先後所惡於後母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.62, "ocr_conf": 0.9671, "suspended": true, "risk": "僅出校記，不改底本，無句讀影響。", "note": "底本作「母」，解、戴據《禮記·大學》及孔《疏》作「毋」，謂涉上下文而訛。劉主重文當劃一。母、毋古通，義亦兩通，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "確證", "confidence": 0.9, "argument": "此乃「母以事上」三句連文重疊之式，底本三「母」字劃一。今本臆改末字為「毋」，破壞重文形態。晚出之本往往經人整理改字，反失其真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "此出《禮記·大學》「毋以事上」。唐孔穎達《正義》、宋撫州本皆作「毋」。「母」乃涉上下文「母」字而訛。今本從「毋」是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "此《大學》絜矩之道文本。毋，禁止詞，義作勿。毋、母古音同紐雙聲、之部疊韻，古多通借，傳寫易混。當存借字毋。"}]}, {"id": "D0078", "type": "實質異文", "left": "母以使下所惡於下", "right": "以事上所惡於前母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.65, "ocr_conf": 0.9829, "suspended": true, "risk": "判錯則妄改底本正文，泯古通假之跡，失存舊之旨。", "note": "劉、解主「毋」，戴主「母」通「毋」存舊。母毋古通，底本文義可通，今出校存疑不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "確證", "confidence": 0.85, "argument": "漢世寫本「母」「毋」二字形近極易淆混，傳鈔者釋讀古文「毋」作「母」屢見。此句重言「毋以」，上句既作「毋」，下句同一結構不當獨作「母」，當是鈔胥淆誤。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.85, "argument": "此當為《大學》「所惡於下，毋以事上」之文。古本《大記》引作「母」，乃「毋」之省借，實為一字之變。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "母、毋古通，漢隸形近相亂。此用借字，當存不改。"}]}, {"id": "D0035", "type": "實質異文", "left": "止於至善也右傳之", "right": "章釋新民詩云邦畿", "base": "二", "ref": "一", "choices": ["二", "一"], "chosen": "兩存", "confidence": 0.7, "ocr_conf": 0.9726, "suspended": true, "risk": "僅出校記，不改底本；妄斷則亂傳文章次，影響句讀。", "note": "劉據章次主「二」，解據朱子《章句》主「一」，戴主「三」而候選無之。三家各執一說，皆乏版本硬證，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "二", "grade": "確證", "confidence": 0.95, "argument": "底本作「二」，合於章次實況：傳首章釋經，二章釋新民，三章釋止至善。今本作「一」，乃後人不明章第而臆改。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "一", "grade": "確證", "confidence": 0.95, "argument": "按朱子《大學章句》，傳十章分釋「明明德」「新民」「止於至善」等。此處釋「新民」乃傳之第三章，釋「止於至善」方為第二章。底本「二」實為「一」之誤倒，蓋「至善」章在前，「新民」章在後，據朱子書例可定。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "二", "grade": "確證", "confidence": 0.98, "argument": "按本書文例，傳首章釋明明德，次章釋新民，三章釋止於至善。「止於至善」乃釋止至善，非釋新民，不當居二章。底本「二」實「三」之誤。然候選無「三」，作「一」則益謬。"}]}, {"id": "D0056", "type": "形近疑誤", "left": "苟焉以自欺者然或", "right": "明而不謹乎此則其", "base": "巳", "ref": "己", "choices": ["巳", "己"], "chosen": "兩存", "confidence": 0.7, "ocr_conf": 0.6647, "suspended": true, "risk": "若強斷一端，恐妄改古本；今存疑不改，僅影響句讀之辨。", "note": "底本作「巳」，今本作「己」。二字形近，文義皆通，別無確證，未敢妄斷，今存底本原文，附校記以俟考定。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "巳", "grade": "旁證", "confidence": 0.75, "argument": "底本南宋刊本作「巳」。刻工本字如此，今本輒改「己」，顯係後人臆改。依對校之法，存古當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "推測", "confidence": 0.85, "argument": "「自欺」與「己」義相屬，承上「苟焉」句，疑原文作「以自欺者己」。宋刻俗寫「己」作「巳」形近，恐刊手之誤。然未得他書確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.7, "argument": "底本漫漶，巳己形近難辨。二字此處文義皆通，無內證可決。理校最險，當存借字不回改，出校記存疑。"}]}, {"id": "D0086", "type": "實質異文", "left": "節讀爲截辟讀爲僻", "right": "與戮同詩小雅節南", "base": "慘", "ref": "僇", "choices": ["慘", "僇"], "chosen": "僇", "confidence": 0.7, "ocr_conf": 0.9763, "suspended": true, "risk": "若妄斷將擅改底本，今兩存僅出校記，不影響句讀", "note": "劉氏主慘存舊貌，解、戴據釋文及形證主僇。兩造各執，今本作僇於義為長，存疑俟覆。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "慘", "grade": "確證", "confidence": 0.88, "argument": "底本作「慘」與戮同，今本臆改作「僇」即同字，無勞贅注。考漢隸字形，慘與戮稍近，作慘存古本舊貌，今本以意改失真。"}, {"name": "解縉", "method": "他校法", "choice": "僇", "grade": "確證", "confidence": 0.85, "argument": "釋文云「與戮同」，則本字當作「僇」。《說文》僇訓辱，戮訓殺，二字音義並通，古多互用。作「慘」者聲近而訛。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僇", "grade": "確證", "confidence": 0.98, "argument": "上文「截、僻」俱借字，此處當據《詩》釋文作「僇」。「慘」涉形訛作「僇」之左半耳。古書既多借字，此條乃論本字，當存本字。"}]}, {"id": "D0092", "type": "形近疑誤", "left": "有容焉人之有技若", "right": "有之人之彦聖其心", "base": "已", "ref": "己", "choices": ["已", "己"], "chosen": "兩存", "confidence": 0.7, "ocr_conf": 0.6073, "suspended": true, "risk": "僅出校記，不改正文；若誤斷則妄改底本，失舊貌。", "note": "底本作「已」，今本及《釋文》皆作「己」。戴氏斷為形誤，然底本漫漶未足遽改，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "推測", "confidence": 0.55, "argument": "底本字漫，未可驟定。然今本作己，蓋後人據通行理校臆改，失其真。校書不改字，當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "旁證", "confidence": 0.85, "argument": "《尚書·秦誓》他本皆作「若己有之」。《經典釋文》不錄異文，可見「己」字相傳已久，此當形近而誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "己", "grade": "確證", "confidence": 0.95, "argument": "此《尚書·秦誓》文，本作「己」，猶己身也。「已」蓋形近誤。今本作己是，當據正。"}]}, {"id": "D0102", "type": "脫文缺字", "left": "上下疑有闕文誤字", "right": "自由也言由小人導", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.7, "ocr_conf": 1.0, "suspended": true, "risk": "妄斷則或刪古闕文號或強增標點，皆失底本之真", "note": "劉、解主闕文符○，戴主頓號、。闕文存古與文理斷讀各有所據，皆無硬證克定其一，今兩存其說，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本有○，今本無。OCR置信既極高，可見底本實具闕文符，今本乃後人妄刪。夫闕文號為存古之迹，今本不誤而臆刪，失真矣。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.8, "argument": "底本夾註「疑有闕文」，今本以○識之，與底本校語合。據文例可補，然未得他書引證，僅憑校本互勘。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "旁證", "confidence": 0.85, "argument": "據文例，「也言」之間當斷。「也」字絕句，頓號隔之，下「言」字頂格另起，疏中常例。今本作頓號合於文理，當據正。"}]}, {"id": "D0106", "type": "衍文重出", "left": "倣規製取中庸大學", "right": "", "base": "章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松间照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg", "ref": "", "choices": ["章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松间照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg", "", "章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松間照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg"], "chosen": "章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松间照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg", "confidence": 0.7, "ocr_conf": 0.6774, "suspended": true, "risk": "判錯則或妄刪馬光祖跋文，或留存唐詩及OCR亂碼，均失真", "note": "劉主存真、解主刪竄文，皆無版本實證，判兩存。底本不误不改，出校记俟覆核。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "底本", "grade": "確證", "confidence": 0.9, "argument": "今本臆刪馬光祖跋文全篇及竄入之唐詩，違版本形態。底本行款具在，今本「不誤而改」，失真甚矣。"}, {"name": "解縉", "method": "他校法", "choice": "〔〇〕", "grade": "旁證", "confidence": 0.92, "argument": "淳祐壬子馬光祖跋後闌入「明月松間照」王維詩句及OCR亂碼圖片標記，顯為書影襯紙或裝潢竄入，非典籍本文。今本刪之，理固然矣。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "章句併刊之是成四書語孟咸月浸久間有澷滅就加整治是書在天地間無窮達老少皆不可一日度熟後玩味則施之行事其有石駁且畏哉淳祐壬子孟妹翔旦金華馬光祖敬識明月松间照清泉石上流<table><tr><td></td></tr></table>imgs/img_in_image_box_0_0_1190_1704jpg", "grade": "無證", "confidence": 0.1, "argument": "底本OCR信度僅0.68，「明月松間照」乃唐人詩句，顯非宋人跋語，且「孟妹翔旦」於文理不通，疑皆謄錄或後人鈔補之贗雜。今本刪之，恐非脫文。然無版本他校以佐證，依理校不可輒改，當存原貌，出校記以待考。"}]}, {"id": "D0004", "type": "形近疑誤", "left": "之餘不待求之民生", "right": "用彞倫之外是以當", "base": "曰", "ref": "日", "choices": ["曰", "日"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.58, "suspended": true, "risk": "若誤判「曰」則妄改底本正文，若誤判「日」則失古本之真，僅出校不改。", "note": "底本作「曰」，劉向謂今本作「日」乃臆改；解縉、戴震引「民生日用」常語謂當作「日」，然未得確證，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曰", "grade": "推測", "confidence": 0.85, "argument": "南宋本作「曰」，今本作「日」乃形近臆改。影刻本字口雖漫，然原本篇第未亂，晚出今本多經人整理，往往失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "日", "grade": "旁證", "confidence": 0.7, "argument": "「民生日用」乃古之常語，典籍屢見，作「曰」則文理頓窒。形近易訛，理當作「日」。然未得古注類書之確證，未敢遽定底本必誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "日", "grade": "旁證", "confidence": 0.85, "argument": "「日用彞倫」語出《尚書·洪範》「民用彞倫」，「日」「用」連文為古籍常語。「曰」字連上下文不可卒讀，當是形近誤刊。"}]}, {"id": "D0008", "type": "實質異文", "left": "明於是河南程氏兩", "right": "出而有以接乎孟氏", "base": "丁", "ref": "夫子", "choices": ["丁", "夫子"], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.9755, "suspended": true, "risk": "若強斷從「丁」，正文難通；若從「夫子」，無版本佐證，恐妄改。", "note": "底本作「丁」，今本作「夫子」。劉、解主存舊，戴主兩存。「丁」字義不可通，疑涉誤，今不改正文，出校存疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丁", "grade": "確證", "confidence": 0.95, "argument": "底本宋刊本作「丁」，字跡清晰。今本臆改作「夫子」，蓋後人據文義擅改，失古本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "丁", "grade": "旁證", "confidence": 0.88, "argument": "此指二程上接孟子，原文當作「兩先生」。宋本「丁」字蓋涉上下文而訛。「夫子」屬今人臆補，別無他書佐證。宋刻近古，姑從底本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.6, "argument": "「丁」「夫子」音義俱絕遠，非通假。或底本涉他文而誤，或今本以意增補。既無本書他條確證，不敢輒改，當存異出校。"}]}, {"id": "D0046", "type": "衍文重出", "left": "以知本末之先後矣", "right": "右傳之四章釋本末", "base": "目石フ息", "ref": "", "choices": ["目石フ息", ""], "chosen": "兩存", "confidence": 0.72, "ocr_conf": 0.9619, "suspended": true, "risk": "若判錯則刻工記號將冒入正文，影響句讀及文本完整性。", "note": "三家皆謂此為刻工記號，非正文。然無古本硬證可定，今本削之未敢必，姑存底本舊貌，出校記以備考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "推測", "confidence": 0.6, "argument": "此「目石フ息」當是版面斷爛、刻工補綴之跡或重文號之變形，非文本正文。然底本既有其形，今本盡削之，恐失古本之真。據形不敢擅斷，姑兩存之。"}, {"name": "解縉", "method": "他校法", "choice": "目石フ息、", "grade": "旁證", "confidence": 0.78, "argument": "此乃刊工刻經時之記號，非衍文，朱子本不應有。未得古注類書確證，然宋槧本刻工記號附入正文者多見，儒藏本刪之合於校理，底本宜存其舊。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "目石フ息、", "grade": "推測", "confidence": 0.4, "argument": "底本之字當為刻工題名，然OCR所錄不可辨識，無本書內證可定其是非。依樸學闕疑之例，當存底本原貌，出校記以備考，不應擅改。"}]}, {"id": "D0070", "type": "實質異文", "left": "君也機發動所由也", "right": "覆敗也此言教成於", "base": "償", "ref": "債", "choices": ["償", "債"], "chosen": "兩存", "confidence": 0.78, "ocr_conf": 0.9583, "suspended": true, "risk": "若誤斷為債則妄改底本，誤斷為償則掩他本校理之疑。", "note": "底本作償，劉、解主存舊，戴主作債。償字於義可通，今各本及理校之說未臻鐵證，兩存俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "償", "grade": "確證", "confidence": 0.82, "argument": "底本作「償」，今本臆改作「債」。南宋本版刻分明，OCR置信頗高，當存其舊。今本輒改，失真矣。"}, {"name": "解縉", "method": "他校法", "choice": "償", "grade": "旁證", "confidence": 0.75, "argument": "償覆猶今言償覆敗，謂償其債而覆敗也。債乃償之正字，然文義當作償，底本不誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "債", "grade": "旁證", "confidence": 0.85, "argument": "「償」「債」古音同在陽部，然此言「覆敗」乃受責之罰，當作「債」。此涉形近致誤，非通假，依例可正訛。"}]}, {"id": "D0090", "type": "衍文重出", "left": "同欲者自不能巳矣", "right": "是故君子先慎乎德", "base": "梁睿之", "ref": "", "choices": ["梁睿之", ""], "chosen": "兩存", "confidence": 0.78, "ocr_conf": 0.9663, "suspended": true, "risk": "若強刪則滅古注，若強存則正文夾雜批語", "note": "底本有「梁睿之」三字，劉向以為古注存真，然無他書佐證，亦難辨非旁記闌入。今不擅改，出校兩存。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "梁睿之", "grade": "確證", "confidence": 0.95, "argument": "底本作「同欲者自不能巳矣〔梁睿之〕是故君子先慎乎德」，今本削去「梁睿之」三字。蓋今本整理時見其突兀而臆刪之。底本小字夾注存古，今本失真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "今本刪「梁睿之」三字，疑為後人臆刪旁記。然未得他書引證以確考其源流，不敢妄定存廢，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "推測", "confidence": 0.55, "argument": "「梁睿之」似為後人批語闌入正文，然無他本旁證，不合「有本佐證」方可刪之律。存之出校，不擅改。"}]}, {"id": "D0052", "type": "脫文缺字", "left": "益之有哉此君子所", "right": "以重以爲戒而必謹", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "兩存", "confidence": 0.8, "ocr_conf": 1.0, "suspended": true, "risk": "誤判則底本正文遭增改，且變更句讀文氣。", "note": "底本缺字未補。今本作「大學」二字，解縉引朱子書為確證，然無古本實證。劉向存異同，戴震存舊，兩存俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.75, "argument": "底本缺字，今本據文義補「大學」。然版本形態上無法證明南宋本原脫，亦無法證明今本所補即古本之舊。依對校之法，僅錄異同，不改底本。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "朱子《四書章句集注·大學章句》經文末即作「此君子之所以重」云云。今本補「大學」二字，蓋因上下文語境而衍，非底本脫文也。考朱子原書，此句之上接「益之」，之下接「以重」，文氣貫通，無須贅入書名。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "推測", "confidence": 0.15, "argument": "OCR置信度一百分，底本顯無脫文。今本輒補「大學」二字，毫無本書內證，純屬後人臆補。理校最險，當存底本之舊。"}]}, {"id": "D0060", "type": "脫文缺字", "left": "敕值反好樂並去聲", "right": "忿懥怒也蓋是四者", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.8, "ocr_conf": 1.0, "suspended": true, "risk": "誤判則妄補符號，篡改古本行款，且混淆注疏體例句讀", "note": "底本墨釘示缺，劉向主存舊貌。解縉據體例推補圈號，戴震主逗號。然皆無他書確證，文義雖通而符號難定，今兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本有〔〇〕符，示此處有墨釘缺字。今本逕空不作標，反失古本之行款面貌。當存底本之墨釘，以見古刻實貌。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "推測", "confidence": 0.85, "argument": "此卷章句體例，條目間以圈號分隔。「敕值反」與「好樂並去聲」為音注，「忿懥怒也」為義訓，其間當有圈號隔之，底本脫。未得他書確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 0.95, "argument": "此文例為注疏音義交替之體。「好樂並去聲」乃音注，「忿懥怒也」乃義訓，其間當以「、」隔之。文義脫此則音注與義訓相混，據同書文例當補。"}]}, {"id": "D0074", "type": "實質異文", "left": "人而后可以教國人", "right": "平聲蓁音臻詩周南", "base": "夭", "ref": "天", "choices": ["夭", "天"], "chosen": "兩存", "confidence": 0.8, "ocr_conf": 0.9706, "suspended": true, "risk": "誤判則正文遭妄改或句讀割裂", "note": "「夭」「天」之辨，劉主夭、戴主天，各有據。然戴說鐵證在「平聲」二字，猶待核宋槧原刻。今僅出校記，不改底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "夭", "grade": "旁證", "confidence": 0.88, "argument": "此為音釋。「夭平聲」為「桃之夭夭」作音，合乎注例。天字平聲顯與詩旨無涉。今本蓋後人臆改。當從底本舊刊。"}, {"name": "解縉", "method": "他校法", "choice": "天", "grade": "推測", "confidence": 0.95, "argument": "「夭」音烏晧、矯也；「天」平聲則合「天保」之訓。蓋釋《詩·天保》篇名，當作「天」。未得確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "天", "grade": "確證", "confidence": 0.98, "argument": "此注釋《詩·周南·桃夭》篇名，本字當作「天」。《詩》音義云「天，於驕反」，正平聲。底本「夭」乃涉篇名誤，注「平聲」即其鐵證。"}]}, {"id": "D0017", "type": "衍文重出", "left": "后能慮慮而后能得", "right": "後放此止者所當止", "base": "后與後同", "ref": "", "choices": ["后與後同", ""], "chosen": "兩存", "confidence": 0.82, "ocr_conf": 0.9617, "suspended": true, "risk": "若誤斷則妄刪舊注或妄存衍文，皆失考訂之真。", "note": "劉、解以為夾注舊存，戴以為校語闌入正文。二說並通而皆無版本硬證，今兩存之，不妄斷。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "后與後同、", "grade": "確證", "confidence": 0.92, "argument": "南宋本雙行夾注，刻於正文旁。今本整理時脫去夾注，非底本衍文。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "后與後同、", "grade": "旁證", "confidence": 0.85, "argument": "此乃音義夾注，非正文。宋槧經籍多附注釋於正文間，字細雙行。今本芟去注語，遂作〇。當存舊注，不可削。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "后與後同、", "grade": "確證", "confidence": 0.95, "argument": "底本連文「慮慮」，一「慮」為「〔后與後同〕」之殘誤，校語錯入正文。今本校讎精審，刪之是也。"}]}, {"id": "D0005", "type": "脫文缺字", "left": "敗時則有若孔子之", "right": "聖而不得君師之位", "base": "", "ref": "性下司禮監本吴本有矣字", "choices": ["", "性下司禮監本吴本有矣字"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 1.0, "suspended": true, "risk": "若強補矣字或聖字，則以臆測改古本之闕，失存真之旨。", "note": "底本空圍示闕。今本校語羼入正文，文理不通。劉、解、戴三家皆無硬證，姑存其闕，不補不妄斷。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "無證", "confidence": 0.5, "argument": "底本空圍示闕，今本校語羅列司禮監本等異本有矣字，乃存異本之貌。未見原書行款，不敢輒斷孰存古，當兩存之。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "「聖」字義長，然無他書確證可資本校。今本據司禮監本、吴本補「矣」字，未得古注類書旁證，不敢妄從，兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.2, "argument": "底本「〔〇〕」實為殘缺，今本「性下司禮監本吴本有矣字」乃後人校記羼入正文，文理不通。孔子之性或孔子之聖，皆無確證，當出校存異。"}]}, {"id": "D0012", "type": "實質異文", "left": "善程子曰親當作新", "right": "大學者大人之學也", "base": "〇", "ref": "○", "choices": ["〇", "○"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.971, "suspended": true, "risk": "誤改正文則以符號為文字，亂例矣；若不出校，則失宋本舊貌。", "note": "〇與○皆圈點符號，非實質異文。宋刻或作陰文，今本或作陽文，存舊即可，無煩改正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "〇", "grade": "旁證", "confidence": 0.92, "argument": "圈點符號宋本多作陰刻「〇」，今本作陽文「○」，當出後人傳刻臆改。依不誤而改之理，當從底本存舊。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.95, "argument": "〇與○皆圈號，非實質異文，乃圈點符號字形之別耳。南宋本習作〇，今排印本作○，校勘但存其義可也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.98, "argument": "〇與○實為一物，古刻圈點不分黑白，OCR辨識遂生異文。此非實質異文，乃刻工圈點與機讀之別，當作○，無須出校。"}]}, {"id": "D0023", "type": "衍文重出", "left": "則皆得所止之序也", "right": "自天子以至於庶人", "base": "昇居之長", "ref": "", "choices": ["昇居之長", ""], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 0.9568, "suspended": true, "risk": "若徑刪正文恐失古本之舊，若定為註語亦乏他書確證。", "note": "劉氏以為塗本存古當存，戴氏考為雙行註語誤入正文，義皆可通，今姑兩存，不改底本，俟覆核。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "昇居之長、", "grade": "確證", "confidence": 0.95, "argument": "底本行款完整，重文不避。今本空標〇號，顯係後人臆刪。當塗本存古，今本失真。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "「昇居之長」四字未見古注及類書徵引《大學》此文者。既無他書確證為衍，亦無他本佐證今本之刪，不敢妄斷，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "今本無「昇居之長」四字，然考此當屬雙行小字夾註，釋「序」字義。宋刻本往往雙行註語誤入正文，今本或據別本刪之，或傳刻脫漏。二字義皆可通，依例當存其舊，出校記說明即可，不應徑改。"}]}, {"id": "D0025", "type": "脫文缺字", "left": "節結上文兩節之意", "right": "右經一章蓋孔子之", "base": "", "ref": "①一於善司禮監本作必自慊", "choices": ["", "①一於善司禮監本作必自慊"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 1.0, "suspended": true, "risk": "判錯則或妄補正文致失舊貌，或僅出校記，影響句讀無妨", "note": "今本及司禮監本有「一於善必自慊」六字，底本無之。劉、戴皆主旁記誤入或刻漏，未檢得古注確引，今兩存其異，不敢妄補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.9, "argument": "底本行款嚴整，刻工清晰，無脫文之跡。今本所增「一於善」云云，乃校者旁記司禮監本之異文，誤入正文。當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本脫文疑非真脫，恐承上省。「一於善」涉《大學》經文章次。未檢得宋以前類書古注確引此處異同，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "底本脫去「一於善」三字，乃版刻漏脫，非文義異也。今本據他本補之，當出校存記，不得徑改底本。"}]}, {"id": "D0057", "type": "脫文缺字", "left": "欺者然或巳明而不", "right": "謹乎此則其所明又", "base": "", "ref": "銷他本作消亦通", "choices": ["", "銷他本作消亦通"], "chosen": "兩存", "confidence": 0.85, "ocr_conf": 1.0, "suspended": true, "risk": "若妄補「銷」字，恐以旁注為正文；若徑刪，或失古本之舊。", "note": "底本缺字，今本作銷，他本作消。銷消音同可通，或係旁注羼入。疑以傳疑，兩存俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本缺字，今本作銷，他本作消。二字異文當出異同，不敢擅補。注謂亦通，知本有歧異，當兩存之。"}, {"name": "解縉", "method": "他校法", "choice": "銷", "grade": "旁證", "confidence": 0.8, "argument": "今本以他本校補「銷」字，注云「他本作消亦通」。此據他本所得，然未指實書名卷次，吾未得確證以覆按，姑信今本，存以待考。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.8, "argument": "此乃後人旁注羼入正文，非底本脫文。「銷」訓盡滅，合於文義。「消」與「銷」古同屬心紐宵部，音同通用，當出校存異，不當妄補。"}]}, {"id": "D0024", "type": "形近疑誤", "left": "也正心以上皆所以", "right": "身也齊家以下則舉", "base": "脩", "ref": "修", "choices": ["脩", "修"], "chosen": "兩存", "confidence": 0.88, "ocr_conf": 0.6318, "suspended": true, "risk": "妄斷改字將亂古書之真，兩存出校不動正文，無句讀之虞。", "note": "底本作「脩」，今本作「修」。脩、修古通，經典多互作，文無窒礙。戴說是，今存底本原文，附注今本異文，以俟考定。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "脩", "grade": "推測", "confidence": 0.85, "argument": "宋本多作「脩」，存古不妄改。今本作「修」乃後人臆改。「脩」本訓治，經傳多假借，今本往往以通行字易之，失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "修", "grade": "旁證", "confidence": 0.7, "argument": "朱子《大學章句》論八條目，皆作「修身」「齊家」。「脩」「修」雖古通，然朱子文集、語類及宋刻諸本率作「修」字。類書未載此條，今以朱子他書定之，作「修」為長。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "脩、修古通，經典多互作。修身、脩身二義並通，文無窒礙。古書用借字多，不當回改本字。存原文出校可也。"}]}, {"id": "D0011", "type": "脫文缺字", "left": "大舊音泰今讀如字", "right": "子程子曰大學孔氏", "base": "", "ref": "朱熹章句", "choices": ["", "朱熹章句"], "chosen": "兩存", "confidence": 0.9, "ocr_conf": 1.0, "suspended": true, "risk": "妄增則改動正文，誤刪則失注例，故兩存不動正文。", "note": "劉、戴主底本無此四字，解謂屬通例。今本增補與否，文義皆可通，且無硬證決之，兩存其說。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "", "grade": "確證", "confidence": 1.0, "argument": "底本刊行於南宋，朱熹《章句》晚出，非其時所有。今本以後起之注羼入正文本，屬不誤而改。當從底本，不從今本。"}, {"name": "解縉", "method": "他校法", "choice": "朱熹章句", "grade": "確證", "confidence": 0.95, "argument": "底本刻「大學孔氏之舊」，即朱子《大學章句》後之補記。宋本凡章句正文與記文相接處多有小字夾註，今本補「朱熹章句」四字實屬通例，非臆增。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、朱熹章句", "grade": "確證", "confidence": 0.98, "argument": "此非脫文。底本「大舊音泰今讀如字」乃卷首考證之附注，其下原有小字正文「子程子曰」。今本擅增「朱熹章句」四字，實出後人回改，非宋本舊貌。據底本行款，當存原貌，不當增補。"}]}, {"id": "D0080", "type": "實質異文", "left": "母以先後所惡於後", "right": "以從前所惡於右母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "兩存", "confidence": 0.9, "ocr_conf": 0.9582, "suspended": true, "risk": "誤判則妄改正文，破底本之真；懸置僅出校記，存疑待核。", "note": "三家皆主「毋」，謂古通假。然「母」字文義可通，無別本硬證，未敢據改，附記俟考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "確證", "confidence": 0.85, "argument": "底本「母」乃「毋」之省借，漢籍恆見。今本作「毋」全同文義，乃後人據通行字正之，非有別本依憑。然今本不誤，當從之。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.85, "argument": "此顯為層累校語之誤竄。注文本作「毋」，謂禁止之辭，訛作「母」遂混。今本作「毋」是。說見阮元《十三經注疏校勘記》所引諸本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "「毋」本訓禁止之詞。「母」與「毋」古音同紐同部，例得通假。古書多借「母」為「毋」，此以借字作本字，當回改作「毋」。"}]}, {"id": "D0019", "type": "脫文缺字", "left": "知所先後則近道矣", "right": "明德爲本新民爲末", "base": "", "ref": "①大學朱熹章句吴本作大學章句②止原作至據司禮監本吴本及正文改", "choices": ["", "①大學朱熹章句吴本作大學章句②止原作至據司禮監本吴本及正文改"], "chosen": "兩存", "confidence": 0.93, "ocr_conf": 1.0, "suspended": true, "risk": "若誤判脫文而補字，將校記竄入正文，失底本之真。", "note": "案底本〔〇〕乃句讀圈點，非脫文。今本所錄實後人校語，機器誤摻正文。至、止音近義通，無確證，存疑待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本唯正文，末附〔〇〕圈點句讀。今本所錄乃後人校記，非正文也。機器誤認校語為正文，非底本脫文。吾校書當正辨之。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "今本所錄乃後人校記竄入正文者，非有他書確證可比。至、止之辯，未見古注類書引及此句，未得確證，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "案所校「止」「至」二字，同屬端紐脂、質陰入對轉，音義實近。然「知止而後有定」與「知至」於《大學》文脈皆通，今無鐵證定奪。據「若不改無窒礙」之例，當存底本至字，出校記存異。"}]}, {"id": "D0032", "type": "形近疑誤", "left": "污而自新則當因其", "right": "新者而曰曰新之可", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.6, "ocr_conf": 0.6558, "suspended": false, "risk": "不改底本，僅出校記；若誤判，影響訓詁，不涉句讀。", "note": "底本作「巳」。劉、解、戴三家皆主「已」，謂宋刻形近互訛，文義當作「已然」解。然未見原書，無版本確證，今不改正文，附校存疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "推測", "confidence": 0.65, "argument": "底本字字缺筆，疑刻工草率，不足據定。今本作「已」合「已然」之義，或本舊鈔。然未見原書，不敢妄改。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "旁證", "confidence": 0.78, "argument": "「因其已新」文從字順，已者竟也、成也。宋本俗寫「已」「巳」相亂，刊本多有互訛。無他書確證可資對校，然審文理當作「已」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "推測", "confidence": 0.7, "argument": "此承「自新」而言，作「已新」文義自通。宋刻「已」「巳」相混習見，且OCR僅得0.66，恐是形近致誤。然未見原書影，無確左證，不敢遽斷。"}]}, {"id": "D0049", "type": "實質異文", "left": "其意者自脩之首也", "right": "者禁止之辭自欺云", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "毋", "confidence": 0.72, "ocr_conf": 0.9585, "suspended": false, "risk": "若判錯改字則破底本，今僅出校記，無損句讀。", "note": "底本「母」當為「毋」之省借。解縉引石經古注為確證，戴震明通借之例。然底本文義勉強可通，謹出校記不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "毋", "grade": "推測", "confidence": 0.6, "argument": "底本作「母」，今本作「毋」。古鈔喜省偏傍，「毋」省作「母」甚常見。且「禁止之辭」當從古作「毋」。然涉實質異文，莫得偏傍旁證，當存疑。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.92, "argument": "「毋者禁止之辭」乃〈大學〉正義釋「毋自欺」之恆言。唐石經及諸古注所引皆作「毋」，音義相合。底本作「母」蓋形近而誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "旁證", "confidence": 0.9, "argument": "「毋」為禁止之辭，此本書文例也。母、毋古音同紐同部，古多通借。依古書用借字多之例，當存借字作「毋」，不當回改本字。底作「母」蓋傳寫之誤。"}]}, {"id": "D0064", "type": "脫文缺字", "left": "音彦碩叶韻時若反", "right": "諺俗語也溺愛者不", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "從底本「〇」讀如重文，不出補字", "confidence": 0.72, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判重文為脫文而補字，則虛增正文，亂原書體例。", "note": "劉謂底本「〇」乃重文號承上「反」字，戴謂體例當補。重文之說義可通，今存底本原貌，別附校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「〔〇〕」乃重文號，承上「反」字，讀如「反反」。今本以為缺字而臆補「○」，是未辨重文形制而誤。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "無證", "confidence": 0.0, "argument": "機器判底本脫字，然底本此處原有〇，今本同之，實無脫漏。案無他書可證此處當有脫文，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本既有〔〇〕符，其前脫一○字。考文例，音注前必有隔以○者。今本增○，合於本書體例，底本實脫，當據補。"}]}, {"id": "D0068", "type": "實質異文", "left": "一言僨事一人定國", "right": "音奮一人謂君也機", "base": "償", "ref": "債", "choices": ["償", "債"], "chosen": "償", "confidence": 0.8, "ocr_conf": 0.9594, "suspended": false, "risk": "誤改作「債」則音讀不通，反失釋文之旨。", "note": "底本「償」音奮，釋「僨」字音讀，於上下文可通。今本作「債」誤。依底本可通不改之例，存原字，出校記明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "償", "grade": "旁證", "confidence": 0.9, "argument": "底本作「償」，音奮，乃釋上「僨」字之音讀。今本作「債」，失音讀之旨。宋本存古，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "償", "grade": "旁證", "confidence": 0.85, "argument": "《禮記·大學》「一言僨事」，鄭玄注：「僨，猶覆敗也。」「僨」從「賁」聲，與「奮」音同。「償」訓「還也」，音食羊反，與「奮」音殊異。今本作「債」蓋後人妄改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "償", "grade": "確證", "confidence": 0.85, "argument": "釋《大學》僨事之音當从償。若作債，音則不符合經文反切，故當从底本作償。"}]}, {"id": "D0007", "type": "脫文缺字", "left": "天運循環無往不復", "right": "隆盛治教休明於是", "base": "", "ref": "宋德", "choices": ["", "宋德"], "chosen": "宋德", "confidence": 0.85, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文僅出校，誤判則句讀雖通而缺字終懸。", "note": "底本空缺，劉向謂重文號磨滅，今本作「宋德」與文理合。然無版本實證，依底本可通之例不改，出校存疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "、宋德", "grade": "旁證", "confidence": 0.85, "argument": "底本「復」下空一格，乃重文號「｜」磨滅之殘痕，與上下字距相合。今本作「宋德」二字，乃後人辨識重文號所補，當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "宋德", "grade": "推測", "confidence": 0.6, "argument": "「天運循環無往不復」與「隆盛」之間，文氣隔斷。今本補「宋德」二字，文理始通。然未得他書引證，不敢遽定，姑從今本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "宋德", "grade": "旁證", "confidence": 0.85, "argument": "循環無往不復後接宋德隆盛，文理順適，乃宋臣頌聖常辭。然無本書他處確證，屬理校。今本所補合理，可從。"}]}, {"id": "D0014", "type": "實質異文", "left": "者也但爲氣稟所拘", "right": "欲所蔽則有時而昏", "base": "入", "ref": "人", "choices": ["入", "人"], "chosen": "人", "confidence": 0.85, "ocr_conf": 0.9677, "suspended": false, "risk": "底本可通則不改；此底本實不通，破例改正文，影響句讀。", "note": "底本「入」當爲「人」之形訛。解縉引《語類》《衍義》確證，戴震證以宋儒常語。底本文窒，從今本改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "入", "grade": "旁證", "confidence": 0.85, "argument": "底本作「入」，與上「拘」字相對成文，行款完整，當存古。今本作「人」，蓋後人不明「入欲」之義而臆改。劉向立法，不改一字，今本之失明矣。"}, {"name": "解縉", "method": "他校法", "choice": "人", "grade": "確證", "confidence": 0.85, "argument": "《朱子語類》卷四、真德秀《大學衍義》卷三皆引作「人欲所蔽」。「人欲」乃宋儒常言，「入欲」不通。今本作「人」是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "人", "grade": "旁證", "confidence": 0.9, "argument": "氣稟所拘、物欲所蔽乃宋儒常語，作「人欲」文理始安。若作「入」則訓詁窒礙。二字古音同紐同部，傳刻易譌。據文義當從今本。"}]}, {"id": "D0037", "type": "實質異文", "left": "乎緡詩作綿詩小雅", "right": "蠻之篇緡蠻鳥聲丘", "base": "綿", "ref": "緜", "choices": ["綿", "緜"], "chosen": "綿", "confidence": 0.85, "ocr_conf": 0.9716, "suspended": false, "risk": "不改底本正文僅出校記，句讀無涉，低風險。", "note": "底本作綿。劉、解二家據石經、釋文主緜，戴氏謂二字音義全同實一字異體。今從戴說，底本文義可通，存異體不改，出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "緜", "grade": "旁證", "confidence": 0.8, "argument": "底本作「綿」，今本作「緜」。案緜從糸部，帛也，綿从竹，聯緜也。古書傳鈔中「緜」訛作「綿」乃常見，今本或存古形。"}, {"name": "解縉", "method": "他校法", "choice": "緜", "grade": "確證", "confidence": 0.92, "argument": "此乃《詩經·小雅》篇名。唐石經、《經典釋文》及諸唐以前古注所引皆作「緜」。「綿」係後世通行字，底本作「綿」當據古本及石經正作「緜」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "綿从糸帛聲，緜从糸從帛會意，實一字之異體，猶詩綿蠻或作緜蠻。二字音義全同，無涉通假，當存異不改，出校記云異體。"}]}, {"id": "D0040", "type": "實質異文", "left": "詩作咺諠詩作諼並", "right": "晚反恂鄭氏讀作峻", "base": "况", "ref": "況", "choices": ["况", "況"], "chosen": "况", "confidence": 0.85, "ocr_conf": 0.9696, "suspended": false, "risk": "不改底本，僅出校記。若誤斷則妄改古字，失傳本之真。", "note": "底本作况，今本作況。戴氏以況為俗增，劉氏謂存古貌；解氏以為古今字，理亦可通。底本可通，存舊不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "况", "grade": "旁證", "confidence": 0.85, "argument": "底本南宋遞修本作「况」，從水從兄，為漢唐傳本故貌。今本作「況」，乃後人據通行字臆改。晚出之本多失真，不誤而改者十居七八，當存底本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "況", "grade": "推測", "confidence": 0.92, "argument": "「況晚反」《經典釋文》屢見，陸氏書法例作「況」不作「况」。二字實古今字，非實質異文，當以「況」為正。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "况", "grade": "確證", "confidence": 0.95, "argument": "況乃况之俗增，古書本作况。此音義引「況晚反」，為曉母三等字，从水之況乃後起，當从底本俗體存原貌不改。"}]}, {"id": "D0048", "type": "形近疑誤", "left": "と下之物莫不因其", "right": "知之理而益窮之以", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.85, "ocr_conf": 0.6299, "suspended": false, "risk": "誤判則正文存訛字，影響句讀及文義理解。", "note": "底本「巳」刻工訛字，劉、解、戴三家皆主「已」。然底本蛇辰之訓不可通，據文義出校，不改正文以存真。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "旁證", "confidence": 0.8, "argument": "「已知」乃本篇習語，理當作「已」。宋本刻工鐫字，巳已形近極易相混。今本作「已」，當是校正刻工之失，非臆改也。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "無證", "confidence": 0.6, "argument": "此乃《朱子語類》理語，「已知之理」文義甚明。「已」「巳」形近，刊板修板屢訛。然未得他書確證，不敢妄斷，姑從今本作「已」，仍俟覆核字口。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "確證", "confidence": 0.98, "argument": "此段言「因其已知之理」，「已知」乃已成知識之謂，文從字順。「巳」訓蛇辰，置此窒礙難通。版刻蛇足偶訛，據文義當正作「已」。"}]}, {"id": "D0006", "type": "實質異文", "left": "徒蓋莫不聞其說而", "right": "氏之傳獨得其宗於", "base": "曽", "ref": "曾", "choices": ["曽", "曾"], "chosen": "曾", "confidence": 0.88, "ocr_conf": 0.9757, "suspended": false, "risk": "僅出校記，不改字，不影響句讀；誤判亦不過多存一俗體。", "note": "曽為曾之異體俗字，古今同音，非實質異文。底本可通，今本作曾，不改正文，出校記存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曽", "grade": "確證", "confidence": 0.95, "argument": "南宋本作「曽」，上从曰，合唐石經及北宋監本之舊。今本作「曾」，乃後人依通行字逈改，失古本之真。據刻本形態，當從宋本。"}, {"name": "解縉", "method": "他校法", "choice": "曾", "grade": "旁證", "confidence": 0.95, "argument": "曽為曾之俗省，實同一字，非實質異文。宋本多俗體，後人改歸正字，義無別也。他校無關宏旨。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "曾", "grade": "確證", "confidence": 0.99, "argument": "「曽」乃「曾」之異體俗字，非實質異文。二字古音全同，本無二致。宋本多作「曽」，今本正作「曾」，當從今本正之，不煩存異。"}]}, {"id": "D0063", "type": "脫文缺字", "left": "敖好並去聲鮮上聲", "right": "人謂衆人之猶於也", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.88, "ocr_conf": 1.0, "suspended": false, "risk": "誤判脫文則妄補正文，亂原書音注體例", "note": "三家皆主○，劉謂底本固具重文號，解、戴謂圈號分隔音注與正文。底本可通，不改正文，存原式。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本有重文號○，表疊字或分章，非脫文。今本標○，同其形制。機誤判脫，實底本固具，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "「敖好鮮」即《大學》「敖惰」之音注，「人謂眾」乃疏文。○為音注與正文間之圈號分隔符，諸經注疏本皆然。底本OCR置信度足，當存原式圈號。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "此處釋「敖好」與「鮮」二字音讀，其下必有圈以隔音訓與正文。底本音訓與正文相亂，正缺一圈。今本補○，合乎體例，當從補。"}]}, {"id": "D0069", "type": "脫文缺字", "left": "事一人定國償音奮", "right": "一人謂君也機發動", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.88, "ocr_conf": 1.0, "suspended": false, "risk": "若判錯，誤補符號入正文，破古本行款之真，影響句讀考證。", "note": "劉、戴皆主○，對校、本校合符。然底本可通，不改正文，僅出校記云：今本有○，底本脫，據補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本音注「償音奮」後有「○」號，蓋章次重文斷隔之記。今本徑空其位，乃後人臆去符號，失古本行款之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "推測", "confidence": 0.9, "argument": "案「〔〇〕」乃底本殘缺或漫漶之代號，非真有字。據文理「定國償」與「一人謂君也」間當有頓隔，候選「、」於義為長。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本上下文皆作「〇一人」，文例一致。今本有○字，底本乃脫文，當據今本補。"}]}, {"id": "D0003", "type": "脫文缺字", "left": "禮樂射御書數之文", "right": "及其十有五年則自", "base": "", "ref": "大學章句序", "choices": ["", "大學章句序"], "chosen": "大學章句序", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判不改，正文將缺篇題，影響句讀與篇第。", "note": "底本脫「大學章句序」五字。劉向據今本版本實證，戴震據本書文例，三家校說合轍，當補。然底本可存其闕，今出校記不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學章句序", "grade": "確證", "confidence": 0.99, "argument": "底本禮樂射御書數之文下接小注連圈，乃篇題易位之式。今本加「大學章句序」五字，符南宋當塗本行款篇第。機判置信一點零零，的為版本實據，當從今本補。"}, {"name": "解縉", "method": "他校法", "choice": "大學章句序", "grade": "旁證", "confidence": 0.35, "argument": "此乃朱子《大學章句序》文。底本圈符實為標題符號，其下脫「大學章句序」五字。據文體與他本校語旁證之，然未得古本殘卷確證，不敢遽定。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學章句序", "grade": "確證", "confidence": 1.0, "argument": "底本「禮樂射御書數之文」乃〈大學章句序〉篇題後之正文，其前必有「大學章句序」五字。今本據文例及體例補之，實為復原，當從。"}]}, {"id": "D0009", "type": "實質異文", "left": "以俟後之君子極知", "right": "踰無所逃罪然於國", "base": "僣", "ref": "僭", "choices": ["僣", "僭"], "chosen": "僣", "confidence": 0.9, "ocr_conf": 0.9719, "suspended": false, "risk": "不改正文，僅出校記。若妄改作僭，則失古本之舊。", "note": "底本作「僣」，从㡭省，隸古定體也，文義可通。今本作「僭」，乃後人改正字。劉、解謂存古，戴謂當從正字。今從底本，今本作「僭」附存校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "僣", "grade": "確證", "confidence": 0.95, "argument": "底本刻作「僣」，从「㡭」省文，乃隸古定之體，存漢魏六朝之舊。今本作「僭」，乃後人據正字臆改。宋本存古，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "僣", "grade": "旁證", "confidence": 0.6, "argument": "僣、僭古今字，漢碑多作僣，唐以前古注引亦作僣。底本作僣，當存舊，今本作僭乃後人改正字，不必據改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僭", "grade": "確證", "confidence": 0.95, "argument": "僣為僭之或體，二字本訓皆踰越也，典籍中多互作。此非假借，乃異體之別，當從今本正字作僭。"}]}, {"id": "D0020", "type": "脫文缺字", "left": "格物治平聲後放此", "right": "明明德於天下者使", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "從底本重文號，此處不脫", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "妄補字或改行款，則誤後人以底本脫漏", "note": "底本「此」後重文號今本奪之，劉向以行款確證。解縉疑為分節、戴震辨非脫文，然皆不否底本之實。今本失之臆斷。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「此」後有重文號○，今本奪之。據行款與重文形制，底本未脫字，乃今本臆刪，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "「格物治平聲後放此」乃疏文標例之語，其下圈符疑為分節標識。今本校補，未見古注、類書引及此處者，未得確證，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "旁證", "confidence": 0.85, "argument": "「格物治平」下、「聲後放此」上，文氣當斷，宜有頓號。然古籍本無標點，實非脫文。今本所增乃校者施點。當存借字，不當回改。底本不誤，惟今本施點可取。"}]}, {"id": "D0022", "type": "脫文缺字", "left": "下平治去聲後放此", "right": "物格者物理之極處", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "僅出校記不改正文；若徑補圈，涉符號非文字，恐啟增改之漸。", "note": "底本「後放此」下脫圈，今本有○以隔凡例與傳文。三家咸主補圈，今存其讀，唯不輒改正文，出校記之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「後放此」下脫一圓圈。下文「物格者」句首當有圈以別章，底本失刻；今本據通行卷第補圈，正合宋本行款分章之式。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "圈點符號，非正文脫字。底本原刻有〇而今版易以○，乃圈號形制之別，校讎不當判為脫文。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "此處「下平治去聲後放此」乃凡例起語，其下當有圈以隔之。「物格者」為傳文。今本有○，合乎體例。底本偶脫，據今本補。"}]}, {"id": "D0034", "type": "脫文缺字", "left": "巳新者而曰曰新之", "right": "可略有閒斷也康誥", "base": "", "ref": "不", "choices": ["", "不"], "chosen": "不", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "補字改正文，若誤判則虛增原文，然三證合轍，風險甚微。", "note": "底本曰曰連文，脫字顯然。劉向據行款，解縉以《大學》他校，戴震以文例義理，三家的「不」字，當據今本補正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "不", "grade": "旁證", "confidence": 0.9, "argument": "底本曰曰連文，疑上字本作不，傳抄誤脫。蓋書作不可，脫不成曰，遂成曰曰。今本作不，合行款字數，存古之真。"}, {"name": "解縉", "method": "他校法", "choice": "不", "grade": "確證", "confidence": 0.9, "argument": "此引《大學》釋「苟日新，日日新，又日新」。《大學》明言「又日新」，且《禮記·大學》本文可為他校之證，底本脫「不」字無疑。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "不", "grade": "確證", "confidence": 0.92, "argument": "引《康誥》作「不曰新」，與上文「巳新者」相對成義。脫此字則文氣中斷、義理難通。今本補「不」字，於文例、義理皆合，當從。"}]}, {"id": "D0039", "type": "實質異文", "left": "也澳於六反菉詩作", "right": "猗叶韻音阿僩下版", "base": "緑", "ref": "綠", "choices": ["緑", "綠"], "chosen": "緑", "confidence": 0.9, "ocr_conf": 0.9792, "suspended": false, "risk": "若誤改作綠，失古本舊貌，此條僅出校記，無關句讀。", "note": "底本作緑，今本作綠。劉、解、戴三家皆謂古今異體，音義並同。底本可通，不改正文，出校存異。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "緑", "grade": "確證", "confidence": 0.9, "argument": "底本作「緑」旁注「猗」，今本臆改作「綠」失之。緑从系彔聲，綠从录，形制有别。宋刻行款存古，未經後人整齊，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "緑", "grade": "旁證", "confidence": 0.75, "argument": "「緑」「綠」古今字，唐前寫本多作「緑」。此引《詩》「緑猗」即《衛風·淇奥》「綠竹猗猗」，二字本通。他校乏確據，然底本作「緑」存古，今本作「綠」乃後人規範，非實質異文。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "緑綠二字音義並同，特異體別構耳，非關通假假借。古籍傳鈔，偏旁或省或繁，其實一也。既無義理窒礙，當存底本舊貌，出校記以備他本異文即可，無須回改。"}]}, {"id": "D0050", "type": "脫文缺字", "left": "慊快也足也獨者人", "right": "所不知而巳所獨知", "base": "", "ref": "①慊吴本作謙", "choices": ["", "①慊吴本作謙"], "chosen": "人慊", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "改動正文補「慊」字；誤刪「人」字則句讀俱廢。", "note": "底本「人」下闕蝕，據今本及文理補「慊」字。劉、戴二家所主相同，確鑿可從。「吴本作謙」乃校語，不當羼入正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "慊", "grade": "確證", "confidence": 0.95, "argument": "底本〔〇〕乃闕文方框，非無此字。今本出校云「慊，吴本作謙」，是宋刻原有此字而闕蝕。據版本形態，當從底本補「慊」字，今本僅錄校語耳。"}, {"name": "解縉", "method": "他校法", "choice": "①慊吴本作謙", "grade": "旁證", "confidence": 0.8, "argument": "宋本此處正文脫「慊」字，注語則以「吳本作謙」存異。二字古通，如《大學》「謙」與此同訓快足，故吳氏別本作謙。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "慊", "grade": "確證", "confidence": 0.95, "argument": "此段釋《大學》「慎其獨」也。經云「此謂誠於中，形於外，故君子必慎其獨也」，《章句》承之曰「獨者，人所不知而己所獨知也」，文義一貫，章法昭然。底本脫去「人」字，則語意不完，今據今本及文理補之。「吴本作謙」乃後人校語羼入正文，當刪。"}]}, {"id": "D0072", "type": "脫文缺字", "left": "喻諸人者未之有也", "right": "好去聲此又承上文", "base": "", "ref": "無諸己而后非諸人原脱據元甲本司禮監本仿元本吴本補", "choices": ["", "無諸己而后非諸人原脱據元甲本司禮監本仿元本吴本補"], "chosen": "無諸己而后非諸人", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "誤判則妄增正文，破宋刊舊第；若不補則文義不貫", "note": "底本脱七字，據《禮記·大學》本文及《經典釋文》、元甲本等校補。劉氏謂〇非脱文記號，然他書確證在前，今從補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "底本（南宋當塗郡齋刊遞修本）", "grade": "確證", "confidence": 0.85, "argument": "底本「喻諸人」上承「非諸人」，行文相接。夾注「〇」為前文釋音，非脫文之記。元本以下據通行本臆補，反失宋刊舊第。不改一字，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "無諸己而后非諸人", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》本文作「無諸己而后非諸人」，《經典釋文》卷十四、《四書章句集注》俱同，的為原文。底本脫此七字，當據補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "無諸己而后非諸人", "grade": "確證", "confidence": 0.98, "argument": "此承上文大學之道，大學章句諸本皆有此句，文理方貫。底本脱，今據元甲本等多本校補，非以意改，實復舊觀。"}]}, {"id": "D0081", "type": "實質異文", "left": "母以從前所惡於右", "right": "以交於左所惡於左", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "毋", "confidence": 0.9, "ocr_conf": 0.9603, "suspended": false, "risk": "若誤斷「母」存，則正文存形訛，句讀生歧，經義蒙晦，誤導後學。", "note": "底本「母」乃「毋」之形訛，戴氏辨音義殊絕，解氏引朱子本確證，今本作「毋」是。底本文義不可通，依例當改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "旁證", "confidence": 0.8, "argument": "底本重文「母」字連上讀，存古疊字之式。今本改作「毋」，失重文之跡，蓋後人妄添，反失真。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.85, "argument": "此《大學》矩之道文。朱熹章句本作「毋」。經傳中「毋」作禁辭，「母」為母親，義界判然。今儒藏本作「毋」合於正統本。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "此文出自《大學》絜矩之道。「母」古音之部，「毋」魚部，非通假，實形近訛字。經典皆作「毋」，義為禁止，當從今本作「毋」。"}]}, {"id": "D0083", "type": "脫文缺字", "left": "矩之道惡先並去聲", "right": "此覆解上文絜矩二", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "從底本，以〇爲句讀重文號或分節符，非脫文", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "誤判則妄增一字，亂宋槧體例，影響句讀。", "note": "劉氏謂重文號，戴氏謂分節符，二說殊塗，然皆主非脫文，不當臆增。解氏主脫，信不及劉、戴，今存底本原貌。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本書「聲〔〇〕此」，〇乃句讀重文號，非脫文。今本別出○字，乃不知重文號而臆增，失之。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "宋槧本凡正文疏間以〇隔之，體例畫一。此處釋「矩之道惡先並去聲」屬疏文，上下當有〇以判章句，底本偶脫耳。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "底本「去聲」下小注已盡，其旁空圜爲分節符，猶今本之○。此宋槧刻書通例，原版具在，非脫文也。"}]}, {"id": "D0085", "type": "脫文缺字", "left": "可以不慎辟則爲天", "right": "節讀爲截辟讀爲僻", "base": "", "ref": "下僇矣", "choices": ["", "下僇矣"], "chosen": "天下僇矣", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "補三字入正文，若誤判則妄增正文，然有鄭注確證可據。", "note": "底本「天」下脫文，劉、戴主補「下僇矣」，解縉據《尚書正義》引鄭注確證當作「天下僇矣」，據他校確證補正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "下僇矣", "grade": "旁證", "confidence": 0.9, "argument": "底本「天」下作〔〇〕重文號，顯係刻時遺漏「下僇矣」三字。今本增補，當有古本為據。當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "、下僇矣", "grade": "確證", "confidence": 0.9, "argument": "此係唐孔穎達《尚書正義》轉引漢鄭玄注。鄭注原作「可以不慎辟，則爲天下僇矣」，底本脫「天下」二字。據《十三經注疏》本確證。今本補之是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "下僇矣", "grade": "確證", "confidence": 0.95, "argument": "詳此文本文氣，「可以不慎辟」下當有結語。「辟則爲天」斷不可通，顯因脫簡而誤接注語「節讀爲截辟讀爲僻」。以全書文例求之，此處脫「下僇矣」三字，文義乃安，當據今本補。"}]}, {"id": "D0088", "type": "脫文缺字", "left": "宜峻詩作駿易去聲", "right": "詩文王篇師衆也配", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判脫文而補綴，將妄增正文，亂原刻行款。", "note": "劉向見重文於版面，解縉辨釋音符，戴震據文理定缺字。三家雖各執一端，然皆證底本非脫文，今存○不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.85, "argument": "底本實有重文圓圍〇，原字與注首字同。今機器誤判為無，今本存之可見原刻行款。此非脫文，乃辨識之失。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本OCR置信度滿分，知此字實存於版面。「〇」乃釋音標識，古籍音注中恒見。今本亦作〇，屬空圈符號，非脫文，毋庸補綴。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本文理當作『詩文王篇師衆也』，『詩』字適缺於○處。今本有○正為存缺文符號，合於體例，當存不改。"}]}, {"id": "D0089", "type": "形近疑誤", "left": "與民同欲者自不能", "right": "矣梁睿之是故君子", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.9, "ocr_conf": 0.6656, "suspended": false, "risk": "若誤判為巳，句讀、文義俱失；今僅出校記，不改正文，無損底本。", "note": "底本「巳」與「已」形極近。劉向據版刻書影辨為「已」，解、戴以文義證之，「不能自已」為古語。今不改正文，姑存俟覆。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "旁證", "confidence": 0.9, "argument": "南宋刊本重文號與末筆收勢有別，從書影可辨，「巳」乃OCR誤識，「已」為原刻。「不能自已」為古語，版刻形跡可證。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "推測", "confidence": 0.75, "argument": "「不能已」為古籍常語，義作「不止」，「不能巳」無義。巳已形近，當作已。然未得本書以外確證，尚俟旁參。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "旁證", "confidence": 0.95, "argument": "「不能已」者，謂勢不能止也。「不能巳」文義不通。「巳」「已」形極近，蒙上句「同欲」而訛。此乃刊刻筆誤，當正作「已」。"}]}, {"id": "D0100", "type": "脫文缺字", "left": "財恒足矣恒胡登反", "right": "呂氏曰國無遊民則", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.9, "ocr_conf": 1.0, "suspended": false, "risk": "不改底本，僅存校記，不影響句讀。", "note": "劉、解並謂圈爲隔音注與正文之識，屬版刻體例，非脱文。戴震欲改作「、」，乃體例之異，無硬證。今從底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「足矣恒胡登反」與「呂氏曰」之間原有陰文圈〔〇〕以隔音注與正文。今本空缺，乃謄錄時脫漏重文符號，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "宋槧習用墨圏、白圏作注疏起訖之識，非脫文。恒胡登反下接呂氏曰，當有○為隔，今本合，底本不脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 0.95, "argument": "底本「財恒足矣恒胡登反〔〇〕呂氏曰」連書，諸篇引他書皆以「、」隔之。無此頓點，注文與經文糾纏。今本補「、」，合於體例，當從。"}]}, {"id": "D0105", "type": "衍文重出", "left": "字放老眼為宜孟正", "right": "大學章句併刊之是", "base": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "ref": "", "choices": ["肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", ""], "chosen": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "confidence": 0.9, "ocr_conf": 0.9564, "suspended": false, "risk": "誤刪致序文斷裂，失宋本篇第行款之真。", "note": "今本全刪此段。劉向對校存舊，戴震本校證官制文義完足，皆主當存。底本可通，今不改正文，僅出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸、", "grade": "確證", "confidence": 0.97, "argument": "底本有明示之〔〕括號，乃存舊貌之原態，與大學章句併刊之文相屬。今本臆刪為〔〇〕，遂使章次斷裂，失宋本篇第行款之真，不誤而改之失也。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本此段似序文夾注，今本削之，未得他書確證。無古籍旁參，不敢妄斷衍奪，當兩存其疑。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "肅吳公所刊見謂善本尤應竭來假守依倣規製取中庸", "grade": "旁證", "confidence": 0.8, "argument": "「正肅」乃宋人常稱御史中丞之詞，「假守」謂權攝郡事，皆宋世官制文例。文義完足，當存。今本奪此段，疑脫簡，非衍文。"}]}, {"id": "D0001", "type": "衍文重出", "left": "", "right": "大學章句序大學之", "base": "宋本大學章句", "ref": "", "choices": ["宋本大學章句", ""], "chosen": "宋本大學章句", "confidence": 0.92, "ocr_conf": 0.9583, "suspended": false, "risk": "判錯則誤刪底本正文六字，失宋刻行款之真", "note": "底本連書「宋本大學章句」六字接正文，劉向對校謂刻書實態，戴震本校亦謂文義無礙。底本可通，不改正文，今本以符號代之者出校存疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "宋本大學章句、", "grade": "確證", "confidence": 0.95, "argument": "底本正文連書「宋本大學章句」六字接正文，乃刻書實態，非衍文。今本以校勘符號代之，已失宋刻行款之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.1, "argument": "此似版式銜接之語，非正文。然類書古注無引《章句序》者，未得確證，不敢妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "宋本大學章句、", "grade": "旁證", "confidence": 0.95, "argument": "此六字乃書名及篇目連文，文義無窒礙。今本脫漏，非底本衍文，當存底本原貌。惟涉版式，未敢徑改，出校記存之。"}]}, {"id": "D0010", "type": "衍文重出", "left": "子新安朱熹序大學", "right": "大舊音泰今讀如字", "base": "朱熹章句", "ref": "", "choices": ["朱熹章句", ""], "chosen": "朱熹章句", "confidence": 0.92, "ocr_conf": 0.9591, "suspended": false, "risk": "判錯則誤刪宋本行款，失舊貌，僅涉校記不改正文。", "note": "底本連書「朱熹章句」乃宋本行款，非衍文。今本作○，蓋後人誤刪。底本可通，今本亦兩存之，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "朱熹章句、", "grade": "確證", "confidence": 0.95, "argument": "底本「大學朱熹章句大舊音泰」連書，乃宋本行款實況，猶存刻本原貌。今本概作○，係後人整理時妄刪，失卻宋槧行款之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "朱熹章句", "grade": "旁證", "confidence": 0.9, "argument": "底本「子新安朱熹序大學朱熹章句大舊音泰」文脈貫通。「朱熹章句」乃書題附注，今本削作〇，蓋誤以為重出。宋刻本可證其非衍，今本當脪。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "旁證", "confidence": 0.85, "argument": "「朱熹章句」蓋宋本夾注書名，非衍文。今本刊落恐失舊貌。然無他本確證，依理校鐵律，當存異不改，出校記而已。"}]}, {"id": "D0041", "type": "實質異文", "left": "其精也瑟嚴密之貌", "right": "武毅之貌赫喧宣著", "base": "僩", "ref": "僴", "choices": ["僩", "僴"], "chosen": "僩", "confidence": 0.92, "ocr_conf": 0.9819, "suspended": false, "risk": "底本不誤，若反從今本改僴，則失古本之真。", "note": "底本作僩，與《釋文》、唐石經合。今本作僴乃或體，不誤而改。底本既通，存文出校。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "僩", "grade": "確證", "confidence": 0.9, "argument": "「僩」从門閑聲，「僴」从門𢎧聲，本為二字。宋刻行款分明，不涉形近。今本蓋以涉雅訓而改，屬不誤而改，失古本之真。"}, {"name": "解縉", "method": "他校法", "choice": "僩", "grade": "旁證", "confidence": 0.85, "argument": "《說文》無僴字，僴乃僩之或體。《經典釋文》卷三引《大學》正作僩，唐石經亦作僩。底本合於古訓，作僩是。今本改作或體，反失本真。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僩", "grade": "確證", "confidence": 0.95, "argument": "《大學》引《淇奧》作僩，《釋文》及古訓皆作僩。南宋底本同之。僴乃後傳寫或刻工手誤，今本回改，未諳古書通借之例。"}]}, {"id": "D0047", "type": "衍文重出", "left": "教必使學者即凡天", "right": "下之物莫不因其巳", "base": "申方つと", "ref": "", "choices": ["申方つと", ""], "chosen": "即凡天下之物", "confidence": 0.92, "ocr_conf": 0.9592, "suspended": false, "risk": "逕刪正文四字，須覆驗底本紙面是否旁注竄入", "note": "底本「申方つと」含日文假名，斷非古本原文。劉氏謂重文符號未確其形。文從「即凡天下之物」為順，今正之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "申方つと、", "grade": "確證", "confidence": 0.98, "argument": "今本毫無痕跡逕刪，失對校之法。底本行款重文符號明晰，當存其舊，不改一字。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.15, "argument": "未得確證。所載「申方つと」內含日文假名，顯非古本本文，疑後人校語竄入正文或鈔手旁注。俟考善本定讞。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "申方つと", "grade": "無證", "confidence": 0.0, "argument": "底本「申方つと」為日文假名，斷非宋刊本之舊，實係後人批校竄入。此處文義當作「即凡天下之物」，無此四字則文從字順。然原委無確證，當徹查紙本版面以定其非原刻正文。"}]}, {"id": "D0058", "type": "形近疑誤", "left": "乎此則其所明又非", "right": "有而無以爲進德之", "base": "已", "ref": "己", "choices": ["已", "己"], "chosen": "已", "confidence": 0.92, "ocr_conf": 0.6355, "suspended": false, "risk": "底本不誤，僅出校記，不改正文。若強改作「己」則文義窒礙。", "note": "「已」字底本可通，劉向、解縉、戴震三說同。薛注引作「已有」，文義順適，今本作「己」乃形近之誤，今從底本不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "已", "grade": "旁證", "confidence": 0.9, "argument": "南宋本字作「已」，與「有」連文，蓋「已有」連讀。今本作「己」乃形近臆改。晚出之本往往經人整理而失真，當從底本不改字。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "旁證", "confidence": 0.85, "argument": "今本作「己」疑因形近而誤。古書多作「已有」，如《文選·東京賦》薛注引此文作「已有」。解縉按：此當從底本作「已」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "確證", "confidence": 0.9, "argument": "「非已有」謂非先所固有，文從字順，合古人言語之理。若作「己」，則文義窒礙不通。「已」「己」形近易誤，當正作「已」。"}]}, {"id": "D0076", "type": "實質異文", "left": "其家此三引詩皆以", "right": "歎上文之事而又結", "base": "咏", "ref": "詠", "choices": ["咏", "詠"], "chosen": "咏", "confidence": 0.92, "ocr_conf": 0.9728, "suspended": false, "risk": "誤判則妄改古體為今字，失存真之旨；今僅出校記，不影響句讀。", "note": "「咏」「詠」古今異體，義訓全同。底本作「咏」存古體，於文無窒礙，據不改字之例存原文，附校記明之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "咏", "grade": "旁證", "confidence": 0.85, "argument": "南宋本作「咏」，從口，存古體。今本改作「詠」，乃後人據通行字整理，反失真。依對校之法，當存底本原字。"}, {"name": "解縉", "method": "他校法", "choice": "咏", "grade": "旁證", "confidence": 0.75, "argument": "咏為詠之古文，二字本同。《說文》詠从口永聲，或作咏。此屬古今字異，底本作咏非誤，不必改作詠。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "咏為詠之古文，二字本為異體，同從永得聲，非關通假。古今字例繁多，二字義訓全同，於文無窒礙，當存異不改，出校記而已。"}]}, {"id": "D0077", "type": "實質異文", "left": "天下平矣所惡於上", "right": "以使下所惡於下母", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "毋", "confidence": 0.92, "ocr_conf": 0.9792, "suspended": false, "risk": "不改正文，僅出校記，不影響句讀。", "note": "底本作「母」，劉向存古主之。解縉、戴震據他書及訓詁定為「毋」，義長。底本雖可通，然旁證鑿然，出校不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "確證", "confidence": 0.85, "argument": "底本字跡明確作「母」，非漫漶闕筆。今本輒改為「毋」，屬後人臆加筆畫以從通行字。宋刻存古，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "旁證", "confidence": 0.85, "argument": "南宋刊本多刻「母」爲「毋」，二字形近致混。「毋」乃本字，《釋文》、群經古註皆作「毋」。此係刊刻通病，當從今本作毋。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.98, "argument": "毋訓無，禁詞，於義為長。母為形近訛字。古音明母同紐，然母實非通假，乃傳寫之誤。當改底本作毋。"}]}, {"id": "D0094", "type": "實質異文", "left": "聖通明也尚庶幾也", "right": "忌也違拂戾也殆危", "base": "媢", "ref": "媚", "choices": ["媢", "媚"], "chosen": "媢", "confidence": 0.92, "ocr_conf": 0.9559, "suspended": false, "risk": "判錯僅誤出校記，不改正文，影響句讀訓詁。", "note": "底本作「媢」，今本作「媚」。劉氏存古，戴氏以《說文》「媢，妒也」確證，與《尚書》怨詈之義合。今本涉義旁改，今從底本不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "媢", "grade": "旁證", "confidence": 0.85, "argument": "底本作「媢」，與「忌」字相屬。今本改作「媚」，乃後人據通行義整理而臆改。南宋刊本存古，晚出之本失真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "媢", "grade": "未得確證", "confidence": 0.6, "argument": "媢忌連文，古訓以媢為妒。媚忌則文理難安，疑今本涉義旁改。然未得類書古注確證，未敢遽定。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "媢", "grade": "確證", "confidence": 0.98, "argument": "此釋《尚書·無逸》「小人怨汝詈汝，則皇自敬德」。「媢忌」承上「怨詈」言，《說文》「媢，夫妒婦也」，《五經文字》作「聖」即「媢」之隸變。作「媚」則與上下文乖違。"}]}, {"id": "D0104", "type": "衍文重出", "left": "準備差遣劉兼高校", "right": "正肅吳公所刊見謂", "base": "正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", "ref": "", "choices": ["正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", ""], "chosen": "正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", "confidence": 0.92, "ocr_conf": 0.9552, "suspended": false, "risk": "誤判則正文脫漏刻書識語，失宋刻舊觀。", "note": "劉、戴均定為刻書識語雙行夾注，非衍文。文義可通，依底本可通則不改，今本刪之失真。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.93, "argument": "此非衍文，乃刻書識語之夾註。刻工於正文行款雙行小字夾入，今本擅刪，失刻書之真。當存舊觀。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "此段疑涉後人校語羼入正文，然未得他書確證，不敢輒斷為衍文。今本刪之或有所據，亦未可知。未得確證，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "正當塗郡齋舊有文公語孟集註一與本文皆大字放老眼為宜孟", "grade": "確證", "confidence": 0.92, "argument": "此乃宋刻版樣之校語或識語，雙行小字夾注於正文中，非衍文。文義自足，今本刪去實爲脫漏，當存底本之舊。"}]}, {"id": "D0026", "type": "脫文缺字", "left": "大讀作泰諟古是字", "right": "大甲商書顧謂常目", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "不改則兩條目混連，致句讀失序、文義窒礙", "note": "底本脫一圈，劉向據對校、戴震據本校皆主補○，今本可證，據補。戴氏謂當作頓號，然○即此書之斷條體例，非異讀。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本上下皆以重文符〇分隔，今本存之。底本此處脫去一圈，顯為傳摹遺漏，當據今本補入。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "底本前後文皆有圈號分隔釋例，此處脫一圈。今本補○，符合體例。然無他書確證，據文例定為旁證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "、", "grade": "確證", "confidence": 0.95, "argument": "此書之例，引書目條目間皆以頓號別之。「泰諟古是字」與「大甲商書」乃兩條，中必有頓號以斷之。底本脫此號則文義相連，窒礙殊甚，今本是也，當補。"}]}, {"id": "D0028", "type": "脫文缺字", "left": "克明峻德峻書作俊", "right": "帝典堯典虞書峻大", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "改動正文，補一缺字；若誤判則正文增衍一符，然三家合證，風險極微。", "note": "底本「俊」後逕接「帝典」，於例不合。劉氏對校、解氏他校、戴氏本校皆主當有○以承經文「峻」字，三家殊塗同歸，據補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本釋文「峻書作俊」，其前必有○以示《尚書》經文之「峻」字，今本釋文脫○，遂使「俊」字上無所承，蓋後人傳鈔刊落之失，當據底本補。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "「克明峻德」出《尚書·堯典》。「俊」「峻」古今字。《經典釋文》云「峻，本亦作俊」，是作○有古訓的據，底本脫此字，當補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本「俊」後緊接「帝典」，當有缺文。疏語釋「峻」訖必當別起釋「帝典」，此處脫一圈斷。今本有○合於體例，當據補。"}]}, {"id": "D0030", "type": "衍文重出", "left": "苟日新日日新又日", "right": "新盤沐浴之盤也銘", "base": "新銘曰苟曰新曰曰新又曰", "ref": "", "choices": ["新銘曰苟曰新曰曰新又曰", ""], "chosen": "刪「新銘曰苟曰新曰曰新又曰」十三字", "confidence": 0.93, "ocr_conf": 0.5927, "suspended": false, "risk": "誤刪則失重文行款之古；不刪則正文不可句讀。", "note": "劉、解、戴三家校法各異而結論同：此十三字乃重文號誤入正文，復與注語相混。《禮記·大學》可證，的係衍文，當刪。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "新銘曰苟曰新曰曰新又曰", "grade": "確證", "confidence": 0.95, "argument": "底本重文號誤識為正文。宋代行款重文「〽」連綴，OCR置信度低，正誤入正文。今本省號存古，當從今本。底本不誤而今本臆改者非此例也。"}, {"name": "解縉", "method": "他校法", "choice": "新銘曰苟曰新曰曰新又曰", "grade": "確證", "confidence": 0.88, "argument": "此段夾註小字，後人取銘辭旁注也。後一小字「新」乃涉上「又曰新」而衍。今本刪之，與《禮記·大學》所引湯之盤銘合，的是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "新銘曰苟曰新曰曰新又曰", "grade": "確證", "confidence": 0.98, "argument": "此涉《大學》盤銘，底本「日日」乃「曰曰」之訛。銘文重出與注語相混，明為衍文，當刪「新銘曰苟曰新曰曰新又曰」十三字。"}]}, {"id": "D0031", "type": "形近疑誤", "left": "故銘其盤言誠能一", "right": "有以滌其舊染之污", "base": "曰", "ref": "日", "choices": ["曰", "日"], "chosen": "日", "confidence": 0.93, "ocr_conf": 0.668, "suspended": false, "risk": "改正文，若誤判則古鈔重文之跡盡失，版本源流將不可考。", "note": "「曰」當作「日」，形近之誤。劉氏謂重文古鈔之跡，然《大學》舊文及朱子《章句》均作「日」，今據正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曰", "grade": "旁證", "confidence": 0.9, "argument": "此乃盤銘連篇重文也。「曰」作重文號，正存古鈔舊式。今本輒改作「日」，失版刻重文之跡，顯為後人臆改。"}, {"name": "解縉", "method": "他校法", "choice": "日", "grade": "確證", "confidence": 0.9, "argument": "《禮記·大學》湯之盤銘曰：苟日新，日日新，又日新。宋熹《四書章句集注》引作「苟日新，日日新，又日新」，不作「曰」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "日", "grade": "確證", "confidence": 0.85, "argument": "此引《大學》「日日新」之文。「日有以滌」者，日日滌其舊染也。「曰」為「日」之形誤，當據今本正。"}]}, {"id": "D0044", "type": "實質異文", "left": "不忘也此兩節詠歎", "right": "泆其味深長當熟玩", "base": "滛", "ref": "淫", "choices": ["滛", "淫"], "chosen": "淫", "confidence": 0.93, "ocr_conf": 0.9584, "suspended": false, "risk": "改動正文恐涉擅改，出校存俗體為妥", "note": "「滛」乃「淫」之省筆俗體，非實質異文。今本作「淫」存正字，據文例正之不改底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "淫", "grade": "確證", "confidence": 0.95, "argument": "「滛」乃「淫」之省訛俗體，部件「⺡」訛作「⺀」。底本刻工或手誤。今本作「淫」存正體。此非文義之辨，乃字形正俗之校。"}, {"name": "解縉", "method": "他校法", "choice": "淫", "grade": "確證", "confidence": 0.85, "argument": "「滛」乃「淫」之異體俗字。宋代刻本每有省筆，非實質異文。文獻通作「淫泆」，義為過度逸樂，與「詠歎」並言，今本作「淫」是也。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "淫", "grade": "確證", "confidence": 0.92, "argument": "「滛」為「淫」之異體俗訛，非通假。淫泆連文，古書習見，義為過度流溢。今本作淫乃正字，當從。然據鐵律五，古書借字尚存不改，此屬異體，回改正字可也。"}]}, {"id": "D0073", "type": "脫文缺字", "left": "者未之有也好去聲", "right": "此又承上文一人定", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.93, "ocr_conf": 1.0, "suspended": false, "risk": "增補符號○，不涉漢字改動，句讀從之。", "note": "底本「好去聲」與疏文之間脫○。劉向對校、戴震本校皆證注疏體例當有圈識，今據補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本既有「好去聲」注文，其下必繫以圈點判語，方為完帙。今本存○而底本無，顯是底本鈔刊時遺落重文符號，今本存古。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.9, "argument": "底本實有圈符，OCR置信度滿分，顯為符號而非漢字，故不涉脫文，當塗本原貌即如此，今本同，無須增補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "注疏之體，音釋與疏文之間恆以圈識隔之。上文「好去聲」為音釋，下文「此又承上文」為疏，中以○標識，此本書之體例。今本有○而底本脫之，當補。"}]}, {"id": "D0002", "type": "實質異文", "left": "入小學而教之以洒", "right": "應對進退之節禮樂", "base": "埽", "ref": "掃", "choices": ["埽", "掃"], "chosen": "埽", "confidence": 0.95, "ocr_conf": 0.9599, "suspended": false, "risk": "誤判僅出校，不改原文，不礙句讀", "note": "底本作「埽」可通。劉、解、戴三家均確證「埽」为本字。今本「掃」乃後起通行字。今本異文出校記，底本不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "埽", "grade": "確證", "confidence": 0.95, "argument": "底本南宋遞修本作「埽」，存古形。今本作「掃」乃後世通行字臆改。古書「洒埽」連文，漢唐舊籍及石刻皆作「埽」，從底本。"}, {"name": "解縉", "method": "他校法", "choice": "埽", "grade": "確證", "confidence": 0.85, "argument": "《周禮·秋官·隸僕》鄭玄注引作「埽」。賈公彥疏所據亦作「埽」，足證唐以前古本皆作「埽」。今本作「掃」，蓋後世通行字代之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "埽", "grade": "確證", "confidence": 0.95, "argument": "埽乃掃之本字，从土帚會意。洒埽乃古書恆言，如《禮記·內則》「洒埽室堂」是也。後世乃贅加手旁作掃。底本存古字，今本乃後起俗字，自當存底本之舊，不當從今本回改。"}]}, {"id": "D0016", "type": "實質異文", "left": "言明明德新民皆當", "right": "於至善之地而不遷", "base": "至", "ref": "止", "choices": ["至", "止"], "chosen": "止", "confidence": 0.95, "ocr_conf": 0.9564, "suspended": false, "risk": "若誤判「兩存」，則經文實誤不顯，學者據誤本立說。", "note": "底本「至」涉上下「至善」誤。解縉引孔疏、朱子《章句》確證當作「止」，今改正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "止", "grade": "旁證", "confidence": 0.9, "argument": "《大學》本作「止於至善」，底本作「至」，顯係涉上下文「至善」而誤。今本作「止」合於經傳舊第，存古之本。當從今本。"}, {"name": "解縉", "method": "他校法", "choice": "止", "grade": "確證", "confidence": 0.98, "argument": "《禮記·大學》孔穎達疏引《大學》正文云「止於至善」，此唐前古注所引也。朱子《章句》釋「止」為「必至於是而不遷」，則正文自作「止」明矣。底本「至」乃涉注文而誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "止", "grade": "確證", "confidence": 0.95, "argument": "此釋「止於至善」。「止」本訓「所止」，謂必至於至善之境而止而不遷。「至」字與「不遷」義複，當作「止」。"}]}, {"id": "D0021", "type": "脫文缺字", "left": "身脩身脩而后家齊", "right": "國治國治而后天下", "base": "", "ref": "家齊而后", "choices": ["", "家齊而后"], "chosen": "家齊而后", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "底本句讀斷裂，脫文致文氣不屬，不補則全章不可讀。", "note": "底本脫「而后家齊」四字。劉氏對校、解氏他校相臺本、戴氏本校句法互證，三家合參，當據今本補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "家齊而后", "grade": "確證", "confidence": 0.9, "argument": "底本重文「脩」字兼攝前後，脩下、後上脫「而后家齊」四字，脩字下脫重文號。據上下句法對稱之版式，此顯為脫文，當從今本補。"}, {"name": "解縉", "method": "他校法", "choice": "家齊而后", "grade": "確證", "confidence": 0.95, "argument": "底本重「身脩身脩」「國治國治」，顯係刻工跳行誤衍，「家齊而后」文理不屬，當是脫文。宋本相臺《禮記》正作「家齊而后國治」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "家齊而后", "grade": "確證", "confidence": 1.0, "argument": "此文出《大學》傳之五章，以「而后」雙疊為例。下云「國治而後天下平」，上有「身脩而後家齊」足證今本是，底本脫四字，當據補。"}]}, {"id": "D0038", "type": "衍文重出", "left": "於信於緝之於音烏", "right": "詩文王之篇穆穆深", "base": "○", "ref": "", "choices": ["○", ""], "chosen": "○", "confidence": 0.95, "ocr_conf": 0.9776, "suspended": false, "risk": "若誤刪則句讀斷裂，注疏體式全失", "note": "底本字跡完整，戴氏謂重文符合注疏體式，劉氏對校亦同。今本臆刪致「烏」字無所附，當存底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○、", "grade": "確證", "confidence": 0.95, "argument": "底本字跡清晰，無蟲蝕殘泐，重文及符號形態完整。今本蓋後人嫌其繁冗而臆刪，失卻舊貌。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "未得確證", "confidence": 0.6, "argument": "底本圈符或為校讀符，今本刪之。然未得他書引證可資對勘，不敢妄斷衍脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "「烏○詩文王之篇」為注疏標示篇名之固定體式。「○」當為「詩」之重文符號，即「烏詩文王之篇」。今本刪「○」字，則「烏」字文義無所附。當存底本原字。"}]}, {"id": "D0042", "type": "脫文缺字", "left": "利此以没丗不忘也", "right": "於戲音嗚呼樂音洛", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判兩存，則篇題缺漏永滯，注屬無歸。", "note": "底本〔〇〕當是脫去篇章題名「大學」二字。劉氏、戴氏據注文「於戲」確證此屬《大學》音義，今從之補正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "底本雙行夾注「於戲音嗚呼樂音洛」為《大學》「於戲前王不忘」之音義。此處為篇章題名之脫漏，非正文脫文。當從今本補「大學」題名。今本非臆改，實存古貌。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.2, "argument": "「利此以没丗不忘也」與〈大學〉無涉，今本所增未得古注類書確證，不敢妄斷，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "此篇本《大學》篇末亂亡，錯入《坊記》。注文「於戲」乃釋《大學》此文。底本脫「大學」二字，今本據他本及注文補，足成文例，當從。"}]}, {"id": "D0043", "type": "實質異文", "left": "乆而不忘也此兩節", "right": "歎滛泆其味深長當", "base": "詠", "ref": "咏", "choices": ["詠", "咏"], "chosen": "詠", "confidence": 0.95, "ocr_conf": 0.955, "suspended": false, "risk": "不改正文，僅出校記。若妄斷反亂體例。", "note": "「詠」底本可通，今本作「咏」，《說文》或體也，音義全同。依底本可通不改之例，存舊出校，不回改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "詠", "grade": "旁證", "confidence": 0.9, "argument": "南宋本作「詠」，從言從永，乃漢唐相承之正字。今本作「咏」，從口旁，乃後起通行體。晚出之本往往以時俗字臆改，反失古本之真，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "未得確證", "confidence": 0.3, "argument": "詠、咏古今字，實同一字。遍檢類書古注所引，未得確證此處他書異同。二本無優劣，未可妄斷。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.98, "argument": "「詠」與「咏」本為異體，《說文》或體即作「咏」。二字形異而音義全同，無涉通假。古書當存底本之舊，出校記云今本作「咏」可也，無庸回改。"}]}, {"id": "D0061", "type": "實質異文", "left": "以起下章蓋意誠則", "right": "無惡而實有善矣所", "base": "眞", "ref": "真", "choices": ["眞", "真"], "chosen": "眞", "confidence": 0.95, "ocr_conf": 0.9781, "suspended": false, "risk": "若改作「真」則失古本原貌，然此條不涉句讀，僅正俗之別，誤判不影響文義。", "note": "底本作「眞」，今本作「真」。三家皆謂正俗之別，非實質異文。底本可通，存古不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "眞", "grade": "旁證", "confidence": 0.85, "argument": "南宋本作「眞」，乃古字本形。今本作「真」，係後人據通行體臆改。晚出之本多經整理而失真，當從底本存古。"}, {"name": "解縉", "method": "他校法", "choice": "眞", "grade": "旁證", "confidence": 0.9, "argument": "眞為正字，真為俗體。宋本作眞，今本作真，乃後世以俗易正，非實質異文，實古今正俗之別。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "眞", "grade": "確證", "confidence": 0.95, "argument": "眞乃古本正字，真為省俗。底本從目從匕從乚，合《說文》古文結構，今本真乃後世通行省體。此非通假，實正俗之別，當從底本。"}]}, {"id": "D0065", "type": "脫文缺字", "left": "衆也弟去聲長上聲", "right": "身脩則家可教矣孝", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "判錯則正文誤增符號或句讀混亂，今僅出校記，無損正文。", "note": "劉向據南宋刊本實有○符，戴震本校體例亦證之，今本脫漏為鈔胥之失。底本當據補圈號，然不改正文，僅出校記。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 1.0, "argument": "底本南宋刊本實有「○」以分隔注文與正文。今本空缺，乃騰錄時漏鈔圈號，非底本脫文。"}, {"name": "解縉", "method": "他校法", "choice": "、○", "grade": "旁證", "confidence": 0.9, "argument": "鈔注、音義之屬，正文、釋音、墨團各屬一層，故「弟去聲長上聲」後當施句讀以隔正文。今本於墨團前置句讀，合乎層次。未得古注、類書確證，然卷中釋音體例可徵。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本已有○符隔注音與經文，此處當亦同例，非脫文也。今本有○為確，底本偶奪之。"}]}, {"id": "D0066", "type": "脫文缺字", "left": "於上而教成於下也", "right": "康誥曰如保赤子心", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "補二字通文義，誤判則句讀斷絕、出處失據", "note": "底本〔〇〕處有脫文。劉向以對校釋為疊字符，解縉以他校證《禮記》原文，戴震以本校理校斷文義，三法互證，當補「大學」二字。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "底本「教成於下也」下接〔〇〕符，乃重文或篇名標識，宋本多借〔〕代疊字號。今本明作「大學」二字，實釋底本符號，非臆增。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "考《禮記·大學》原文正作「康誥曰如保赤子」，此為《大學》引《書》之文。底本缺「大學」二字，則莫辨所引何篇，當據今本補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 0.98, "argument": "「於上而教成於下」與「康誥曰」間文義斷絕，顯有脫文。以《禮記·大學》本經證之，正作「教成於下也大學康誥曰」，當據今本補「大學」二字。"}]}, {"id": "D0082", "type": "實質異文", "left": "以交於左所惡於左", "right": "以交於右此之謂絜", "base": "母", "ref": "毋", "choices": ["母", "毋"], "chosen": "毋", "confidence": 0.95, "ocr_conf": 0.9618, "suspended": false, "risk": "改正文。若誤判，則妄改舊貌，存疑可僅出校記。", "note": "底本作「母」，據《大學》古本及諸經注疏他校確證，當作「毋」，即「無」也。母、毋隸書形近致訛，今據正。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "母", "grade": "推測", "confidence": 0.85, "argument": "底本南宋刊本作「母」。今本作「毋」乃後人據通行理校臆改。「母」「毋」形近易混，古書多互訛，然底本既存舊貌，當從底本，不得輒改。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "此《大學》絜矩章文。古本及諸經注疏皆作「毋」，字義為「無」。底本作「母」當係形近致誤。經文相承已久，他校足證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "此《大學》絜矩章文，本作「毋」。「母」「毋」隸書形近致訛。此禁辭，作「毋」於文義始通，作「母」則窒礙難通，當據正。"}]}, {"id": "D0087", "type": "脫文缺字", "left": "克配上帝儀監于殷", "right": "命不易道得衆則得", "base": "", "ref": "峻", "choices": ["", "峻"], "chosen": "峻", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判脫文而擅補峻字，則破壞底本重文體例。", "note": "底本重文號〔〇〕當爲峻字重出。劉氏以刻例定之，解、戴引《詩》及毛傳確證。底本實作峻，非脫文，毋庸補。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "峻", "grade": "確證", "confidence": 0.95, "argument": "底本有重文號〔〇〕，即上字重文，指「峻」字重出。此乃刻書通例，非脫文。今本作峻，正合重文之例。"}, {"name": "解縉", "method": "他校法", "choice": "峻", "grade": "確證", "confidence": 0.98, "argument": "此《尚書·康誥》文。《詩·文王》毛傳引作「儀監于殷，峻命不易」，《大雅》亦作「峻」。「峻」訓大，字義通而古注可據，底本蓋脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "峻", "grade": "確證", "confidence": 0.98, "argument": "此《大學》引《詩·文王》「儀監于殷，峻命不易」之文。《詩·大雅》正作「峻命不易」，故今本補「峻」字有據。底本脫此字，當據補。"}]}, {"id": "D0097", "type": "實質異文", "left": "用迸猶逐也言有此", "right": "疾之人妨賢而病國", "base": "媢", "ref": "娼", "choices": ["媢", "娼"], "chosen": "媢", "confidence": 0.95, "ocr_conf": 0.9811, "suspended": false, "risk": "若誤從今本作「娼」，則失古訓且乖本義", "note": "底本作「媢」，與《尚書》《說文》及《史記》合，訓「疾」合本義。今本作「娼」涉女旁妄改，今從底本，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "媢", "grade": "旁證", "confidence": 0.9, "argument": "宋當塗本作「媢」，與《尚書》《詩經》古字合；今本作「娼」乃後人臆改。晚出本多經整理，失真者眾，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "媢", "grade": "旁證", "confidence": 0.9, "argument": "《說文》云「媢，夫妬婦也」，《書·無逸》作「無嫉媢」。《詩·小雅》舊疏引作「媢嫉」。古書「妨賢病國」恆與「媢疾」連文，今本作「娼」者蓋後人妄改。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "媢", "grade": "確證", "confidence": 0.95, "argument": "此釋《書·秦誓》「媢嫉以惡之」。《說文》「媢，夫妒婦也」，《史記》載此正作「媢」。訓「疾」合「嫉」本義。作「娼」蓋涉女旁妄改。"}]}, {"id": "D0054", "type": "衍文重出", "left": "廣體胖故君子必誠", "right": "胖步丹反胖安舒也", "base": "其意", "ref": "", "choices": ["其意", ""], "chosen": "保留底本「其意」", "confidence": 0.96, "ocr_conf": 0.9616, "suspended": false, "risk": "誤刪則正文與音訓割裂，致句讀紊亂。", "note": "底本「其意」與下「胖」字連書，係經文夾注起語。劉、解、戴三家均主存，今本刪之非舊槧之舊，今從底本不補不刪。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "其意、", "grade": "旁證", "confidence": 0.85, "argument": "底本「誠其意」三字與下「胖」字連書，無別行，明係「誠其意也」注文「胖步丹反」之釋字。今本刪之，恐出後人臆刪，非舊槧之舊。"}, {"name": "解縉", "method": "他校法", "choice": "其意", "grade": "旁證", "confidence": 0.95, "argument": "此節乃《禮記·大學》經文，作「故君子必誠其意」。釋文因釋「胖」字音訓，據經文，自當有「其意」二字。今本刪之則不成句，斷非衍文。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "其意", "grade": "確證", "confidence": 0.98, "argument": "《大學》「富潤屋」章舊注疏文例，釋經字必先舉句中二字以起訓。此處舉「胖」字釋之，上必有所屬。且「胖步丹反」為音訓，故「其意」為正文夾注起語，今本脫之，當據底本補。"}]}, {"id": "D0093", "type": "實質異文", "left": "反書作介斷丁亂反", "right": "音冒○秦誓周書斷", "base": "媢", "ref": "媚", "choices": ["媢", "媚"], "chosen": "媢", "confidence": 0.96, "ocr_conf": 0.9769, "suspended": false, "risk": "若誤判作媚，則音冒無著，直改正文致失底本之真。", "note": "底本作媢，音冒，與劉向、解縉、戴震之校合，確證鑿然，今本作媚蓋臆改，不從。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "媢", "grade": "確證", "confidence": 0.95, "argument": "底本音讀作「音冒」，與「媢」字聲相應。今本作「媚」，音當如寐，與「音冒」全不合。足見今本臆改，失底本之真。"}, {"name": "解縉", "method": "他校法", "choice": "媢", "grade": "確證", "confidence": 0.75, "argument": "《釋文》音冒之字當作媢。《釋文·爾雅音義》釋媢云莫報反，此字確訓音冒，與媚音異。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "媢", "grade": "確證", "confidence": 0.98, "argument": "此乃《經典釋文·卷音禮記音義》釋《大學》「媢疾以惡之」之音。鄭注訓媢為妒，音冒，與底本「音冒」契合。媚訓愛悅，於妒疾之訓窒礙不通。當存媢。"}]}, {"id": "D0095", "type": "實質異文", "left": "人爲能愛人能惡人", "right": "讀爲屏古字通用迸", "base": "逆", "ref": "大學迸", "choices": ["逆", "大學迸"], "chosen": "逆", "confidence": 0.96, "ocr_conf": 0.9596, "suspended": false, "risk": "若誤從今本，則妄加書名破句讀。", "note": "底本作「逆」可通。三家均主逆，謂逆讀爲屏，今本「大學迸」妄加書名竄入，不從。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "逆", "grade": "確證", "confidence": 0.95, "argument": "底本南宋遞修本作「逆」，行款連貫。今本臆改作「大學迸」，蓋因見下文「迸」字而誤連上文，破壞原本次第。底本不誤而今本妄改，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "逆", "grade": "旁證", "confidence": 0.85, "argument": "此段引《禮記·大學》「唯仁人爲能愛人能惡人」以釋經。逆讀爲屏，謂逆即屏之假借。作「大學迸」者涉上文名相竄入，當從底本作「逆」。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "逆", "grade": "確證", "confidence": 0.98, "argument": "此疏《大學》「能愛人能惡人」文，鄭注正作「逆讀爲屏」。「逆」「屏」古音同紐同部，通用合例。今本「大學迸」乃後人妄加書名竄改，當從底本存「逆」字。"}]}, {"id": "D0027", "type": "脫文缺字", "left": "矣帝典曰克明峻德", "right": "峻書作俊帝典堯典", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.97, "ocr_conf": 1.0, "suspended": false, "risk": "補二字改正文，影響句讀及章節歸屬", "note": "底本脫「大學」二字。解縉據《朱子語類》補，戴震以本書文例證之，二家互參，確然無疑。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "", "grade": "確證", "confidence": 0.95, "argument": "南宋本行款連屬，作「矣帝典曰克明峻德」，文氣相接。今本臆補「大學」二字，顯出後人整理，反失古本之真。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.98, "argument": "此乃《大學》釋「明明德」引《堯典》之文。朱子《章句》標「右傳之首章」，故注疏本於「矣」字前脫「大學」二字。今本據《朱子語類》卷十四補，確然無疑。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "引《帝典》即《堯典》。案《大學》「克明峻德」正引此語，此乃疏解《大學》經文，脫「大學」二字則文無所承，今本是也，當補。"}]}, {"id": "D0029", "type": "實質異文", "left": "誤在没世不忘之下", "right": "之盤銘曰苟日新日", "base": "湯", "ref": "物", "choices": ["湯", "物"], "chosen": "湯", "confidence": 0.97, "ocr_conf": 0.9596, "suspended": false, "risk": "底本不誤，今本誤。此條無改動風險，僅出校記辨明今本之非。", "note": "今本作「物」係涉上文末字而誤，劉向、解縉、戴震三家咸主「湯」，今從底本不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "湯", "grade": "確證", "confidence": 0.98, "argument": "盤銘乃湯事，南宋本作「湯」合篇第章次。今本作「物」當係臆改，失古本之真。"}, {"name": "解縉", "method": "他校法", "choice": "湯", "grade": "確證", "confidence": 0.98, "argument": "此《大學》引《盤銘》文。朱熹《章句》明注「湯之盤銘曰」。《禮記·大學》正文本作「湯」，《經典釋文》亦作「湯」。「物」字蓋今本排印之誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "湯", "grade": "確證", "confidence": 0.99, "argument": "《大學》「湯之盤銘曰」乃經文定本，諸本皆同。「物」字涉上文「沒世不忘」末字而誤。此本證也，當從底本作「湯」，今本誤。"}]}, {"id": "D0036", "type": "實質異文", "left": "而不如鳥乎緡詩作", "right": "詩小雅綿蠻之篇緡", "base": "綿", "ref": "緜○", "choices": ["綿", "緜○"], "chosen": "綿", "confidence": 0.97, "ocr_conf": 0.9716, "suspended": false, "risk": "此條無爭議，誤判僅涉校記繁簡，不影響正文句讀。", "note": "底本作「綿」無誤。劉、解、戴三家合參，《釋文》亦作「綿」，今本「緜」俗字耳，不從。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "綿", "grade": "確證", "confidence": 0.95, "argument": "底本字跡明作「綿」，未作「緜」。今本改作「緜」，乃後人以別體代正字，屬不誤而改。據底本形態，當存原貌。"}, {"name": "解縉", "method": "他校法", "choice": "綿", "grade": "確證", "confidence": 0.95, "argument": "此乃夾註「詩作綿」也。《經典釋文》云「綿蠻，面延反」，字正作「綿」。底本「綿」字不誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "綿", "grade": "確證", "confidence": 0.9, "argument": "《詩·小雅》本作「綿蠻」，底本作「綿」乃錄《詩》文，與「緡」上下相承。今本「緜」乃俗字，○為空缺，當據底本及《毛詩》存「綿」字，不當從俗空缺。"}]}, {"id": "D0084", "type": "脫文缺字", "left": "民之父母民之所好", "right": "好之民之所惡惡之", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "大學", "confidence": 0.97, "ocr_conf": 1.0, "suspended": false, "risk": "若誤判則正文脫文失補，致句讀不明、出處無考", "note": "底本「民之父母民之所好」上有脫文。劉向據南宋本，解縉據《禮記·大學》孔疏，戴震據本書文例，三證合流，今補「大學」二字。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "南宋本此句實出《禮記·大學》，今本據篇第增「大學」二字以明出處，合於章次。底本原文當有此二字，非臆增，今本可從。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.95, "argument": "此句見《禮記·大學》，孔穎達疏引正文作「民之所好好之，民之所惡惡之」，其上正有「大學」二字，足證底本脫此二字。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "大學", "grade": "確證", "confidence": 1.0, "argument": "文見《禮記·大學》。若不補「大學」二字，則文氣不貫，無以知此語所出。今據本書他篇例及《禮記》原文補。"}]}, {"id": "D0045", "type": "脫文缺字", "left": "人也必也使無訟乎", "right": "無情者不得盡其辭", "base": "", "ref": "①錫原作錫據仿元本及韻會改②泆仿元本作液", "choices": ["", "①錫原作錫據仿元本及韻會改②泆仿元本作液"], "chosen": "人也必也使無訟乎〔〇〕無情者不得盡其辭", "confidence": 0.98, "ocr_conf": 1.0, "suspended": false, "risk": "若據今本增字，則校語羼入正文，亂經文句讀。", "note": "底本不誤。今本所夾「錫」「泆」乃他條校記竄入正文，非本經脫文。三家皆主底本可通，不當臆增。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "人也必也使無訟乎〔〇〕無情者不得盡其辭", "grade": "確證", "confidence": 1.0, "argument": "底本OCR置信度一點零零，且此句乃《論語》原文，文理銜接無間。今本所夾注乃校語竄入正文，非底本脫文。據行款考之，底本不誤，今本臆增，斷不可從。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本〔〇〕為圈號，今本所竄入者乃他條校記，非本經脫文。經文止於〇，無脫。機器誤連他文。今本雜注不當羼入。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "底本引《論語·子路》文作「無訟乎」，自有出處，文義自通。校記所列「錫」「泆」乃他本校語，今與底本無涉。據底本存之，不當輒改。"}]}, {"id": "D0051", "type": "形近疑誤", "left": "也獨者人所不知而", "right": "所獨知之地也言欲", "base": "巳", "ref": "己", "choices": ["巳", "己"], "chosen": "己", "confidence": 0.98, "ocr_conf": 0.6544, "suspended": false, "risk": "不改正文，僅出校記；若誤判兩存則遺形訛於定本", "note": "「巳」當作「己」，形近之訛。劉氏對校、解氏他校引《中庸》朱注、戴氏本校訓詁並合，確證昭然。然底本文義可通，出校不改。", "opini
