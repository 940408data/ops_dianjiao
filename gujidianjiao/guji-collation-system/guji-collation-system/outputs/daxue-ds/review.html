學", "grade": "確證", "confidence": 0.9, "argument": "《禮記·大學》篇名，孔穎達《正義》引《堯典》注可證，底本脫二字，今本是。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.25, "argument": "底本無『大學』二字，今本有之，然無他書對校，亦無文義窒礙，不敢遽補。"}]}, {"id": "D0012", "type": "實質異文", "left": "善程子曰親當作新", "right": "大學者大人之學也", "base": "〇", "ref": "○", "choices": ["〇", "○"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 0.971, "suspended": true, "risk": "若強斷，或誤改版式、或亂句讀，均傷文獻真相。", "note": "底本〇為分段符，今本○為句讀符，二家各據其例，無硬證可決，故兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "〇", "grade": "確證", "confidence": 0.95, "argument": "底本作〇，乃宋刻通例，為分段符號；今本改為○，失其舊式。當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.7, "argument": "底本墨釘作〇，《儒藏》依宋元刻例改○，他書無明文，以類書虛圈例推之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本圈抹為校勘記號，○乃句讀符，非字異。二本形同義別，當從今本句讀，底本不必改。"}]}, {"id": "D0020", "type": "脫文缺字", "left": "格物治平聲後放此", "right": "明明德於天下者使", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 1.0, "suspended": true, "risk": "不誤補而誤脫，損體例；不誤脫而誤補，反增贅文。", "note": "底本空圍可通，今本增圈亦存例。三家無確證，姑兩存之，以待覆核。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本『○』本為句讀空圍，今本臆補『○』，與版式合；底本無脫，今本冗增。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.7, "argument": "《經典釋文》音義例以圈分隔，他本多存此符，底本或脫，今據儒藏本補。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.95, "argument": "今本存○，朱子章句本經文每節首加○以別之，底本脫此圈，文義無礙，然當據補以存體例。"}]}, {"id": "D0025", "type": "脫文缺字", "left": "節結上文兩節之意", "right": "右經一章蓋孔子之", "base": "", "ref": "①一於善司禮監本作必自慊", "choices": ["", "①一於善司禮監本作必自慊"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 1.0, "suspended": true, "risk": "若妄補，則失底本原貌；若徑刪，則恐佚真文。", "note": "底本無字，今本補入，司禮監本別作㈠，諸本互異，無版刻他書確證，故兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade"  0.95, "argument": "底本宋刻作「埽」，乃古字；今本改「掃」為後起俗字，非存古之義。版本形態從宋本爲正。"}, {"name": "解縉", "method": "他校法", "choice": "埽", "grade": "確證", "confidence": 0.9, "argument": "《說文解字》云：「埽，弃也。」又《禮記·內則》注引作「埽」，唐寫本《毛詩正義》亦作「埽」。宋刻經注皆用「埽」，《儒藏》改「掃」乃後起字。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "旁證", "confidence": 0.95, "argument": "埽、掃古音同屬心紐幽部，通假字。底本用埽，今本用掃，義同，無須改字。"}]}, {"id": "D0004", "type": "形近疑誤", "left": "之餘不待求之民生", "right": "用彞倫之外是以當", "base": "曰", "ref": "日", "choices": ["曰", "日"], "chosen": "曰", "confidence": 0.95, "ocr_conf": 0.58, "suspended": false, "risk": "若改『日』則失典據，且誤讀文義。", "note": "底本『曰』字可通，與《洪範》『曰用彝倫』合，今本作『日』乃形近訛字，此從底本。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "曰", "grade": "確證", "confidence": 0.9, "argument": "底本作『曰』，字口清晰，與『曰用彞倫』文義相合；今本作『日』，乃形近致誤，且無版本依據。"}, {"name": "解縉", "method": "他校法", "choice": "曰", "grade": "確證", "confidence": 0.95, "argument": "《尚書·洪範》篇屢見「彝倫攸敘」「彝倫攸斁」，皆「曰用」連文。此處「民生日用彝倫」乃成語，下當接「曰」字，作「曰用彝倫」。若作「日用」，則失典據。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "曰", "grade": "旁證", "confidence": 0.85, "argument": "底本「曰」字本義為言說，上下文「求之民生曰用彞倫」中「曰」為發語或謂語，與「日」義不諧。且形近易訛，當存本字。"}]}, {"id": "D0009", "type": "實質異文", "left": "以俟後之君子極知", "right": "踰無所逃罪然於國", "base": "僣", "ref": "僭", "choices": ["僣", "僭"], "chosen": "僭", "confidence": 0.95, "ocr_conf": 0.9719, "suspended": false, "risk": "改正為正體，不影響文義；僅涉字形，無版本之爭。", "note": "底本「僣」乃「僭」之俗字，今從正體。戴震說精確，三家無異義，徑改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "僣", "grade": "確證", "confidence": 0.95, "argument": "底本南宋刻，尚存古字，《說文》無僭，僣為正字。今本作僭，乃後世改易，非版本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "僭", "grade": "確證", "confidence": 0.85, "argument": "《說文》無「僣」字，「僭」為正體。《玉篇》《廣韻》皆作「僭」，元明類書引經傳亦作「僭」。《永樂大典》他卷引此句，俱作「僭」字可證。底本「僣」乃俗寫或誤刻。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僭", "grade": "確證", "confidence": 1.0, "argument": "僣為僭之俗寫，非通假。底本作僣，今本作僭，實為正俗之別，當從正體僭。"}]}, {"id": "D0015", "type": "脫文缺字", "left": "之以復其初也新者", "right": "革其舊之謂也言旣", "base": "", "ref": "大學", "choices": nce": 0.8, "argument": "底本注文‘得后與後同後放此’後有空格，今本補○符，乃宋刻標識分節通例，非脫文，當存。"}]}, {"id": "D0028", "type": "脫文缺字", "left": "克明峻德峻書作俊", "right": "帝典堯典虞書峻大", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文，不影響句讀，僅出校記備考。", "note": "底本『峻』下空字為篇題分隔符，非脫文。今本增『○』，然無硬證，兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.95, "argument": "底本無此字，今本有之，然底本『峻書作俊』下『〇』為篇題分隔符號，非脫文，今本當衍。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "旁證", "confidence": 0.7, "argument": "底本作『峻』，他書引《書》多作『俊』，二字古通，今本補『○』或屬刻工空格，未得确信，故兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本『峻書作俊』後脫『○』，此乃經注間隔符號，今本有之，當據補。"}]}, {"id": "D0032", "type": "形近疑誤", "left": "污而自新則當因其", "right": "新者而曰曰新之可", "base": "巳", "ref": "已", "choices": ["巳", "已"], "chosen": "已", "confidence": 0.95, "ocr_conf": 0.6558, "suspended": false, "risk": "若誤判，則改動底本正文，但文義可通，不影響句讀。", "note": "底本作「巳」，乃形近之訛。戴震據文義、訓詁證「已」表已然，義長，今從之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "巳", "grade": "旁證", "confidence": 0.7, "argument": "底本刊刻『巳』字字口尚存，南宋本用『巳』多於『已』；今本臆改。"}, {"name": "解縉", "method": "他校法", "choice": "已", "grade": "旁證", "confidence": 0.7, "argument": "《禮記·大學》引文「日新之謂盛德」無「巳」字用例，且「已」表已然，義長。然未得唐寫本確證，故為旁證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "已", "grade": "確證", "confidence": 0.95, "argument": "文義言‘因其已新者而日日新’，‘已’表已然，與‘日日新’承接；‘巳’為干支，於義無取。底本‘巳’字乃‘已’形近之誤。"}]}, {"id": "D0033", "type": "實質異文", "left": "則當因其巳新者而", "right": "新之可略有閒斷也", "base": "曰曰", "ref": "日日新之又日", "choices": ["曰曰", "日日新之又日"], "chosen": "日日新之又日", "confidence": 0.95, "ocr_conf": 0.6228, "suspended": false, "risk": "若判誤，則改動大量經文，但此處有他書確證，風險低。", "note": "底本『曰曰』乃重文號誤釋，據《禮記·大學》經文及諸本，當作『日日新之又日』。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "日日新之又日", "grade": "旁證", "confidence": 0.9, "argument": "底本作『曰曰』，乃重文號誤釋。南宋本常以重文號代複字，後人橫刻作『曰曰』，實為『日日』。今本增『新之又』三字，與經義合，且版本系統中此處多作『日日新之又日』，底本脫文顯然。"}, {"name": "解縉", "method": "他校法", "choice": "日日新之又日", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》湯之盤銘曰：『苟日新，日日新，又日新。』北宋本引此句，底本『曰曰』顯為形訛。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "日日新之又日", "grade": "確證", "confidence": 0.95, "argument": "《大學》『苟日新，日日新，又日新』，底本『曰曰』顯為『日日』形訛，且『又日』二字脫文。據經義文例，當從今本。"}]}, {"id": "D0035", "type": "實質異文", "left": "止於至善也右傳之", "right": "章釋新民詩云邦畿", "base": "二", "ref": "一", "choices": ["二", "一"], "chosen": "二", "confidence": 0.95, "ocr_conf": 0.9726, "suspended": false, "risk": "若從今本改『一』，則失舊第之序，改動正文。", "note": "案：底本作『二』，與傳文次第合，今本作『一』疑後人妄改，今從底本不改。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "二", "grade": "確證", "confidence": 0.95, "argument": "南宋本作『二』，與傳文次第合；今本作『一』，疑後人妄改，失舊第之序。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "未檢得他書引此處作序數，無從判別二、一之正誤，故兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "二", "grade": "確證", "confidence": 0.95, "argument": "底本明標『右傳之〔二〕章』，正合經文次第；今本作『一』，蓋後人誤改。無他書佐證，不可從。"}]}, {"id": "D0036", "type": "實質異文", "left": "而不如鳥乎緡詩作", "right": "詩小雅綿蠻之篇緡", "base": "綿", "ref": "緜○", "choices": ["綿", "緜○"], "chosen": "綿", "confidence": 0.95, "ocr_conf": 0.9716, "suspended": false, "risk": "若改則失底本舊貌，且無必要。", "note": "底本『綿』字可通，且劉向、解縉皆據實證，今據存底本，不改正文。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "綿", "grade": "確證", "confidence": 0.95, "argument": "底本明作「綿」，且引《小雅·綿蠻》篇名，緡為傳寫之誤，儒藏本作「緜○」乃後人臆改，失底本舊貌。"}, {"name": "解縉", "method": "他校法", "choice": "綿", "grade": "確證", "confidence": 0.95, "argument": "《毛詩·小雅·綿蠻》正義引作「綿」，唐寫本《毛詩》殘卷亦同，宋本底本「緡」乃形近之訛，當據他書正。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "緜○", "grade": "旁證", "confidence": 0.85, "argument": "《小雅·緜蠻》毛詩作「緜」，緡、緜古音同屬明紐元部，通假可存。底本引「緡詩」亦借字，不當回改。"}]}, {"id": "D0038", "type": "衍文重出", "left": "於信於緝之於音烏", "right": "詩文王之篇穆穆深", "base": "○", "ref": "", "choices": ["○", ""], "chosen": "兩存", "confidence": 0.95, "ocr_conf": 0.9776, "suspended": false, "risk": "不改底本正文，僅出校記，不影響 dence": 0.95, "argument": "底本行款整齊，凡韻注標識必用雙圈○，今本○處底本墨丁，當係刊刻脫漏，非衍文。"}, {"name": "解縉", "method": "他校法", "choice": "、", "grade": "旁證", "confidence": 0.8, "argument": "《經典釋文》《玉篇》引俗諺，句讀間例用頓點。今本空格似出後人臆補，底本無字反近古式。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本‘碩叶韻’下當有圈記，以別注音與下句；今本有○，底本偶脫，非關義理，可補。"}]}, {"id": "D0066", "type": "脫文缺字", "left": "於上而教成於下也", "right": "康誥曰如保赤子心", "base": "", "ref": "大學", "choices": ["", "大學"], "chosen": "兩存", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "不改正文，僅出校記；若判錯，不影響文義理解。", "note": "底本無『大學』，行款完整；今本補入，雖有所據，然非底本原貌，今兩存其說。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 1.0, "argument": "底本行款完整，無缺字痕跡，今本增『大學』二字，蓋後人依經文補入，非底本原貌。"}, {"name": "解縉", "method": "他校法", "choice": "大學", "grade": "確證", "confidence": 0.9, "argument": "《禮記·大學》引《康誥》「如保赤子」，孔穎達《正義》明標「大學」篇名。宋本脫此二字，今本補之，當從。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本無「大學」二字，文義自足；今本增入，未見古本對校，不可遽補。且「〇」或為章句空格，非脫文確證。"}]}, {"id": "D0067", "type": "脫文缺字", "left": "而后嫁者也中去聲", "right": "此引書而釋之又明", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "○", "confidence": 0.95, "ocr_conf": 1.0, "suspended": false, "risk": "不改則句讀不清，段落不別，影響文義理解。", "note": "據《釋文》舊例及類書引文，底本此處當有圈號，今補之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "確證", "confidence": 0.9, "argument": "底本行款整飭，無空格墨釘，今本多出圈號，疑後人臆增；二本異文，底本為古，當從之。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "《釋文》舊例，每章音義後以圈別之。此處底本當有圈，今本有之，可據補。類書引《釋文》亦存此式。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.7, "argument": "底本此處原文不連屬，『○』乃段落間隔之常例，今本補之，義理無礙，當從。"}]}, {"id": "D0068", "type": "實質異文", "left": "一言僨事一人定國", "right": "音奮一人謂君也機", "base": "償", "ref": "債", "choices": ["償", "債"], "chosen": "償", "confidence": 0.95, "ocr_conf": 0.9594, "suspended": false, "risk": const KEY = 'guji:' + DATA.work + ':' + DATA.run_id;
let dec = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'pending', cur = 0;

const save = () => localStorage.setItem(KEY, JSON.stringify(dec));
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function visible(){
  return DATA.cases.filter(c => filter === 'all' ? true
    : filter === 'done' ? (dec[c.id] || !c.suspended)
    : (c.suspended && !dec[c.id]));
}

function render(){
  const list = document.getElementById('list');
  const items = visible();
  document.getElementById('n1').textContent = DATA.cases.filter(c=>c.suspended&&!dec[c.id]).length;
  document.getElementById('n2').textContent = DATA.cases.filter(c=>dec[c.id]||!c.suspended).length;
  document.getElementById('n3').textContent = DATA.cases.length;
  const solved = Object.keys(dec).length;
  const need = DATA.cases.filter(c=>c.suspended).length;
  document.getElementById('prog').textContent =
    `懸置 ${need} 條，已處理 ${solved} 條`;

  if(!items.length){ list.innerHTML = '<div class="empty">此頁無條目。懸置條目已全部處理。</div>'; return; }
  list.innerHTML = items.map((c,i) => {
    const d = dec[c.id];
    const chs = c.choices.map((x,k) =>
      `<button class="ch ${d&&d.choice===x?'sel':''}" data-id="${c.id}" data-v="${esc(x)}">
        <kbd>${k+1}</kbd>${esc(x)||'〇（刪）'}</button>`).join('');
    const ops = c.opinions.map(o =>
      `<div class="op"><span class="who">${esc(o.name)}</span>
       <span class="g">${esc(o.method)}·${esc(o.grade)}·${o.confidence.toFixed(2)}</span>
       主「${esc(o.choice)}」：${esc(o.argument)}</div>`).join('');
    return `<div class="case ${d?'done':''} ${i===cur?'cur':''}" data-id="${c.id}">
      <div class="meta"><span class="badge">${esc(c.id)}</span>
        <span class="badge">${esc(c.type)}</span>
        <span class="badge">合議一致度 ${c.confidence.toFixed(2)}</span>
        <span class="badge">OCR ${c.ocr_conf.toFixed(2)}</span>
        ${c.suspended?'<span class="badge" style="color:#9c3b2e">懸置</span>':''}</div>
      <div class="ctx">…${esc(c.left)}<b>〔${esc(c.base)||'〇'}〕</b>${esc(c.right)}…
        <br><span style="font-size:14px;color:#6f6555">今本此處作：〔${esc(c.ref)||'〇'}〕</span></div>
      <div class="ops">${ops}</div>
      <div class="risk">機器裁斷：${esc(c.chosen)}　｜　${esc(c.risk)}</div>
      <div class="choices">${chs}
        <button class="ch ${d&&d.choice==='兩存'?'sel':''}" data-id="${c.id}" data-v="兩存"><kbd>3</kbd>兩存</button>
      </div>
      <textarea placeholder="人工按語（將寫入校勘記）" data-note="${c.id}">${esc(d?d.note:'')}</textarea>
    </div>`;
  }).join('') + `<div class="hint">鍵盤：J／K 移動　1‑9 選讀法　3 兩存　E 導出<br>
   決策存於本機 localStorage，導出 decisions.json 後回灌流水線即可重出定本。</div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('.ch');
  if(t){ const id = t.dataset.id;
    dec[id] = {choice: t.dataset.v, note: (dec[id]||{}).note || '', at: new Date().toISOString()};
    save(); render(); return; }
  const tab = e.target.closest('.tab');
  if(tab){ filter = tab.dataset.f; cur = 0;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===tab));
    render(); }
});
document.addEventListener('input', e => {
  const id = e.target.dataset.note;
  if(id){ dec[id] = Object.assign({choice:'', note:''}, dec[id], {note:e.target.value}); save(); }
});
document.getElementById('exp').onclick = () => {
  const out = {work: DATA.work, run_id: DATA.run_id,
    exported_at: new Date().toISOString(), decisions: dec};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download = 'decisions.json'; a.click();
};
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA') return;
  const items = visible();
  if(e.key === 'j'){ cur = Math.min(cur+1, items.length-1); render(); }
  if(e.key === 'k'){ cur = Math.max(cur-1, 0); render(); }
  if(e.key === 'e'){ document.getElementById('exp').click(); }
  if(/^[1-9]$/.test(e.key) && items[cur]){
    const c = items[cur]; const opts = c.choices.concat(['兩存']);
    const v = opts[+e.key-1]; if(v===undefined) return;
    dec[c.id] = {choice:v, note:(dec[c.id]||{}).note||'', at:new Date().toISOString()};
    save(); render();
  }
});
render();
</script></html>
