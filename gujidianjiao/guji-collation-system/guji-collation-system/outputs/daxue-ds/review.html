末題識慣例，無衍文跡象；今本脫去二十四字，當據底本補入。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.4, "argument": "他書未見引及此段，亦無類書、古注可證。底本有而今本無，疑衍或脫，然無確據，姑兩存之。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "推測", "confidence": 0.6, "argument": "底本此段字數冗長，疑為校語竄入正文，然無他本可證，不敢遽刪。今本刪去亦無窒礙，故兩存之。"}]}, {"id": "D0073", "type": "衍文重出", "left": "以知本末之先後矣", "right": "右傳之四章釋本末", "base": "目石フ息", "ref": "", "choices": ["目石フ息", ""], "chosen": "兩存", "confidence": 0.45, "ocr_conf": 0.9619, "suspended": true, "risk": "不妄改正文，僅出校記；若判錯不影響正文，唯懸置待覆核。", "note": "三家皆無堅證，底本『目石フ息』文義不明，今本刪之亦無據，姑兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.7, "argument": "底本『目石フ息』疑為刻工記或墨丁誤衍，今本刪之，然無版本對校證據，不可遽定衍脫。"}, {"name": "解縉", "method": "他校法", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "未見他書引及此處，類書古注亦無援據，不敢遽定衍脫。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.4, "argument": "底本此處文義未明，又無本書他處文例可證，或為衍文，或為校語，不敢遽斷，故兩存之。"}]}, {"id": "D0019", "type": "實質異文", "left": "明於是河南程氏兩", "right": "出而有以接乎孟氏", "base": "丁", "ref": "夫子", "choices": ["丁", "夫子"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 0.9755, "suspended": true, "risk": "若強改，則遺失底本古貌；不校則失他書確證。", "note": "底本作『丁』，文義可通；今本作『夫子』，亦有他書確證。兩說並存，以待別證。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "丁", "grade": "確證", "confidence": 0.95, "argument": "底本南宋刊本，行款古舊，『丁』字無避諱改動；今本『夫子』乃後人臆改，且晚出本多失古貌。"}, {"name": "解縉", "method": "他校法", "choice": "夫子", "grade": "確證", "confidence": 0.9, "argument": "《朱子語類》卷九十三引程子門人言「明道伊川兩夫子出」，又《宋史·道學傳》並稱「兩夫子」，可證底本『丁』為形訛。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "丁", "grade": "確證", "confidence": 0.9, "argument": "明道、伊川兄弟，序稱兩丁，古以丁為子，無需改字。夫子於文義不合。"}]}, {"id": "D0046", "type": "脫文缺字", "left": "克明峻德峻書作俊", "right": "帝典堯典虞書峻大", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.5, "ocr_conf": 1.0, "suspended": true, "risk": "若強斷，誤改句讀，失注疏體例或經義", "note": "底本 es": ["湯", "物"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 0.9596, "suspended": true, "risk": "若妄改，恐失經典舊文之真；若妄從，則違異文實證之存疑原則。", "note": "底本作「湯」合《禮記》舊文，今本作「物」有鄭注、《釋文》及類書可證，兩說皆有理據，未可遽定，姑兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "湯", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》引盤銘曰「湯之盤銘」，底本作「湯」合於經典舊文，今本改「物」無版本依據，疑後人臆改。"}, {"name": "解縉", "method": "他校法", "choice": "物", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》鄭玄注引「湯之盤銘」，《釋文》本作「物」；《北堂書鈔》卷百三十五引亦作「物」，底本「湯」乃涉下文「湯之」而誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "湯", "grade": "確證", "confidence": 0.9, "argument": "《大學》引湯之盤銘，底本作湯，合經義；今本作物，無小學依據，當從底本。"}]}, {"id": "D0053", "type": "實質異文", "left": "而曰曰新之可略有", "right": "斷也康誥曰作新民", "base": "閒", "ref": "間", "choices": ["閒", "間"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 0.9683, "suspended": true, "risk": "若強判一字，將失文獻實相，致校勘失據，且無助經義。", "note": "底本「閒」字，宋本避諱缺筆，然《禮記》注疏及《釋文》皆作「間」，今本亦同，二說皆有理據，故兩存之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "間", "grade": "旁證", "confidence": 0.7, "argument": "底本作「閒」乃宋本避諱缺筆，實為「間」字。今本徑改作「間」，未失其真，可從。"}, {"name": "解縉", "method": "他校法", "choice": "閒", "grade": "確證", "confidence": 0.85, "argument": "《禮記·大學》孔疏引鄭注云「其間無斷」，又《經典釋文》出「閒」字，皆可證底本作「閒」是，今本改「間」非。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "閒", "grade": "旁證", "confidence": 0.85, "argument": "底本作「閒」乃古本字，訓間隙，正合「無間斷」之義。今本作「間」為後起俗寫，義同，可通而不必改。"}]}, {"id": "D0057", "type": "衍文重出", "left": "於信於緝之於音烏", "right": "詩文王之篇穆穆深", "base": "○", "ref": "", "choices": ["○", ""], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 0.9776, "suspended": true, "risk": "若誤刪，則失底本體例；若誤存，則衍文留於正文，文義無礙。", "note": "底本墨釘疑為校記分隔符，今本徑刪，他書無徵，未可遽定，故兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "底本『○』為校記分隔符號，今本徑刪，失其體例。當據底本存之。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.85, "argument": "《經典釋文·毛詩音義》於〈文王〉篇「於緝」下注「於音烏」，不別出墨釘。底本此處墨釘疑為後人誤增，他書無徵，故從今本。"}, {"name": " hod": "他校法", "choice": "○", "grade": "確證", "confidence": 0.95, "argument": "《經典釋文·毛詩音義》‘媢’字下云‘本又作冒’，明此處當有句讀圈。今本從《釋文》補圈，底本偶脫耳。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "兩存", "grade": "無證", "confidence": 0.3, "argument": "底本無圈，今本增之，然無左證，依理校存疑，不改底本。"}]}, {"id": "D0150", "type": "脫文缺字", "left": "上下疑有闕文誤字", "right": "自由也言由小人導", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.6, "ocr_conf": 1.0, "suspended": true, "risk": "若強改正文，恐誤補字致義紊；若不出校，後人疑底本有脫。", "note": "底本無闕文跡，刻工省文或後人妄補未定。今本補○，說文可參，然無確證，兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "兩存", "grade": "旁證", "confidence": 0.6, "argument": "底本無此字，今本增○，然底本行款未見闕文之跡，疑為刻工省文或後人妄補。版本形態不足定其是非，姑兩存之。"}, {"name": "解縉", "method": "他校法", "choice": "○", "grade": "旁證", "confidence": 0.7, "argument": "《說文》「○」為「囗」字古文，他書引《釋名》或作「○」，今本據此補，底本脫文可從。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "○", "grade": "旁證", "confidence": 0.9, "argument": "底本闕文處今本補○，以符空格慣例。若無他證，從今本補之，不害義理。"}]}, {"id": "D0086", "type": "形近疑誤", "left": "苟焉以自欺者然或", "right": "明而不謹乎此則其", "base": "巳", "ref": "己", "choices": ["巳", "己"], "chosen": "兩存", "confidence": 0.65, "ocr_conf": 0.6647, "suspended": true, "risk": "若誤改，則失底本之舊；若不改，則文義或窒礙。", "note": "底本作“巳”，字口清晰；今本作“己”，義理可通。三家各有所據，無確證，故兩存待考。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "巳", "grade": "旁證", "confidence": 0.85, "argument": "底本南宋刊本，字口巳形清晰，無避諱改筆；今本作己，乃後人臆改，非存古之舊。"}, {"name": "解縉", "method": "他校法", "choice": "己", "grade": "確證", "confidence": 0.92, "argument": "《玉篇》「己，身也」，與「苟焉以自欺」義合。宋本多作「己」，明本同，無作「巳」之例。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "己", "grade": "旁證", "confidence": 0.85, "argument": "『己』與『自』對文，『己明』即『自明』，義理通順。『巳』為『已』之訛，無義可說。形近致誤，宜從改。"}]}, {"id": "D0095", "type": "脫文缺字", "left": "音彦碩叶韻時若反", "right": "諺俗語也溺愛者不", "base": "", "ref": "○", "choices": ["", "○"], "chosen": "兩存", "confidence": 0.65, "ocr_conf": 1.0, "suspended": true, "risk": "若改底本，恐誤補非脫之字，損舊本原貌。", "note": "三家皆無確證：底本刊刻完整，今本○或為俗例，非必脫文，宜兩存以待覆核。", "opinio e": "旁證", "confidence": 0.85, "argument": "底本宋刊，存古字「母」；今本改作「毋」，乃後人依通行文例所改，非版本之舊。"}, {"name": "解縉", "method": "他校法", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "《禮記·大學》鄭玄注及孔穎達疏並引作「毋」，《經典釋文》亦出「毋」字，他書所引皆同，底本「母」為形誤。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "毋", "grade": "確證", "confidence": 0.95, "argument": "底本『母』乃『毋』之借字，古音同明母魚部，二字通用。此句『毋以交於右』與上文『所惡於左毋以交於右』文例一致，作禁止之義，當從今本。"}]}, {"id": "D0121", "type": "實質異文", "left": "節讀爲截辟讀爲僻", "right": "與戮同詩小雅節南", "base": "慘", "ref": "僇", "choices": ["慘", "僇"], "chosen": "僇", "confidence": 0.95, "ocr_conf": 0.9763, "suspended": false, "risk": "改正文一字，不影響句讀；若誤改則失《小雅》本字。", "note": "底本注云‘慘與戮同’，明指僇字；慘乃形誤，今本作僇合《小雅》舊本，從之。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "僇", "grade": "確證", "confidence": 0.95, "argument": "底本‘慘’字乃注文小字竄入，校語‘慘與戮同’本作‘僇與戮同’，今本作‘僇’合《小雅》舊本，蓋底本誤衍。"}, {"name": "解縉", "method": "他校法", "choice": "慘", "grade": "旁證", "confidence": 0.75, "argument": "《詩·小雅·節南山》『慘慘』，毛傳訓『憂』，鄭箋云『慘』與『僇』通。然古注多引作『慘』，未得確證。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "僇", "grade": "確證", "confidence": 0.95, "argument": "底本注云‘慘與戮同’，明指僇（戮）字；‘慘’為形誤，音義俱乖，當從今本正作僇。"}]}, {"id": "D0122", "type": "實質異文", "left": "節南山之篇節截然", "right": "大貌師尹周太師尹", "base": "髙", "ref": "高", "choices": ["髙", "高"], "chosen": "高", "confidence": 0.95, "ocr_conf": 0.9784, "suspended": false, "risk": "僅出校記，不改正文，無損文義。", "note": "高、髙本一字異體，底本作俗寫，今本從正字，義同不改，但存其異。", "opinions": [{"name": "劉向", "method": "對校法", "choice": "髙", "grade": "確證", "confidence": 0.95, "argument": "底本宋刻作「髙」，乃小篆「高」隸定之古體，今本改作「高」，失其舊形，當從底本。"}, {"name": "解縉", "method": "他校法", "choice": "高", "grade": "確證", "confidence": 0.85, "argument": "《毛詩正義》引《節南山》傳云：「節，高峻貌。」《釋文》亦作「高」。底本「髙」乃俗寫，非正字。"}, {"name": "戴震", "method": "本校法・理校法（音韻訓詁）", "choice": "高", "grade": "確證", "confidence": 0.95, "argument": "《節南山》毛傳云‘節，高峻貌’；高、髙本一字異體，底本作‘髙’者俗寫，今本從正字，義同不改。"}]}, {"id": "D0124", "type": "脫文缺字", "left": "宜峻詩作駿易去聲", "right": "詩文王篇師衆也配", "base": "", "ref": "○", "choices": ["", "○"], "chosen": " const KEY = 'guji:' + DATA.work + ':' + DATA.run_id;
let dec = JSON.parse(localStorage.getItem(KEY) || '{}');
let filter = 'pending', cur = 0;

const save = () => localStorage.setItem(KEY, JSON.stringify(dec));
const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function visible(){
  return DATA.cases.filter(c => filter === 'all' ? true
    : filter === 'done' ? (dec[c.id] || !c.suspended)
    : (c.suspended && !dec[c.id]));
}

function render(){
  const list = document.getElementById('list');
  const items = visible();
  document.getElementById('n1').textContent = DATA.cases.filter(c=>c.suspended&&!dec[c.id]).length;
  document.getElementById('n2').textContent = DATA.cases.filter(c=>dec[c.id]||!c.suspended).length;
  document.getElementById('n3').textContent = DATA.cases.length;
  const solved = Object.keys(dec).length;
  const need = DATA.cases.filter(c=>c.suspended).length;
  document.getElementById('prog').textContent =
    `懸置 ${need} 條，已處理 ${solved} 條`;

  if(!items.length){ list.innerHTML = '<div class="empty">此頁無條目。懸置條目已全部處理。</div>'; return; }
  list.innerHTML = items.map((c,i) => {
    const d = dec[c.id];
    const chs = c.choices.map((x,k) =>
      `<button class="ch ${d&&d.choice===x?'sel':''}" data-id="${c.id}" data-v="${esc(x)}">
        <kbd>${k+1}</kbd>${esc(x)||'〇（刪）'}</button>`).join('');
    const ops = c.opinions.map(o =>
      `<div class="op"><span class="who">${esc(o.name)}</span>
       <span class="g">${esc(o.method)}·${esc(o.grade)}·${o.confidence.toFixed(2)}</span>
       主「${esc(o.choice)}」：${esc(o.argument)}</div>`).join('');
    return `<div class="case ${d?'done':''} ${i===cur?'cur':''}" data-id="${c.id}">
      <div class="meta"><span class="badge">${esc(c.id)}</span>
        <span class="badge">${esc(c.type)}</span>
        <span class="badge">合議一致度 ${c.confidence.toFixed(2)}</span>
        <span class="badge">OCR ${c.ocr_conf.toFixed(2)}</span>
        ${c.suspended?'<span class="badge" style="color:#9c3b2e">懸置</span>':''}</div>
      <div class="ctx">…${esc(c.left)}<b>〔${esc(c.base)||'〇'}〕</b>${esc(c.right)}…
        <br><span style="font-size:14px;color:#6f6555">今本此處作：〔${esc(c.ref)||'〇'}〕</span></div>
      <div class="ops">${ops}</div>
      <div class="risk">機器裁斷：${esc(c.chosen)}　｜　${esc(c.risk)}</div>
      <div class="choices">${chs}
        <button class="ch ${d&&d.choice==='兩存'?'sel':''}" data-id="${c.id}" data-v="兩存"><kbd>3</kbd>兩存</button>
      </div>
      <textarea placeholder="人工按語（將寫入校勘記）" data-note="${c.id}">${esc(d?d.note:'')}</textarea>
    </div>`;
  }).join('') + `<div class="hint">鍵盤：J／K 移動　1‑9 選讀法　3 兩存　E 導出<br>
   決策存於本機 localStorage，導出 decisions.json 後回灌流水線即可重出定本。</div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('.ch');
  if(t){ const id = t.dataset.id;
    dec[id] = {choice: t.dataset.v, note: (dec[id]||{}).note || '', at: new Date().toISOString()};
    save(); render(); return; }
  const tab = e.target.closest('.tab');
  if(tab){ filter = tab.dataset.f; cur = 0;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===tab));
    render(); }
});
document.addEventListener('input', e => {
  const id = e.target.dataset.note;
  if(id){ dec[id] = Object.assign({choice:'', note:''}, dec[id], {note:e.target.value}); save(); }
});
document.getElementById('exp').onclick = () => {
  const out = {work: DATA.work, run_id: DATA.run_id,
    exported_at: new Date().toISOString(), decisions: dec};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download = 'decisions.json'; a.click();
};
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'TEXTAREA') return;
  const items = visible();
  if(e.key === 'j'){ cur = Math.min(cur+1, items.length-1); render(); }
  if(e.key === 'k'){ cur = Math.max(cur-1, 0); render(); }
  if(e.key === 'e'){ document.getElementById('exp').click(); }
  if(/^[1-9]$/.test(e.key) && items[cur]){
    const c = items[cur]; const opts = c.choices.concat(['兩存']);
    const v = opts[+e.key-1]; if(v===undefined) return;
    dec[c.id] = {choice:v, note:(dec[c.id]||{}).note||'', at:new Date().toISOString()};
    save(); render();
  }
});
render();
</script></html>
